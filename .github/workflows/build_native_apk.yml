name: Build FlowRip Studio Pro UI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate FlowRip Studio Project
        run: |
          mkdir -p app/src/main/java/com/soundrip/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/color

          # 0. Official FlowRip Brand Logo & Launcher Icons (Stage 10 Brand System)
          python3 -m pip install --quiet pillow

          cat << 'PYEOF' > /tmp/generate_brand_assets.py
          import base64, os, io
          from PIL import Image, ImageDraw

          master_b64 = ""
          master_bytes = base64.b64decode(master_b64)
          master_img = Image.open(io.BytesIO(master_bytes))
          master_rgba = master_img.convert('RGBA')

          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          for name in ['ic_flowrip_brand.png', 'app_logo.png', 'ic_launcher_emblem.png']:
              with open(f'app/src/main/res/drawable/{name}', 'wb') as fp:
                  fp.write(master_bytes)

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, sz in sizes.items():
              os.makedirs(f'app/src/main/res/{folder}', exist_ok=True)
              canvas = Image.new('RGBA', (sz, sz), (255, 255, 255, 255))
              emblem_sz = int(sz * 0.76)
              emblem = master_rgba.resize((emblem_sz, emblem_sz), Image.Resampling.LANCZOS)
              canvas.paste(emblem, ((sz - emblem_sz) // 2, (sz - emblem_sz) // 2), emblem)
              canvas.save(f'app/src/main/res/{folder}/ic_launcher.png', format='PNG', optimize=True)

              round_canvas = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              mask = Image.new('L', (sz, sz), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, sz, sz), fill=255)
              round_canvas.paste(canvas, (0, 0), mask)
              round_canvas.save(f'app/src/main/res/{folder}/ic_launcher_round.png', format='PNG', optimize=True)

          print('Brand assets & mipmaps generated successfully!')
          PYEOF
          python3 -c "import textwrap; exec(textwrap.dedent(open('/tmp/generate_brand_assets.py').read()))"

          # 0.1 Download clean modern Roboto typography (guarantees OEM fonts never distort branding)
          mkdir -p app/src/main/res/font
          curl -sL --retry 3 https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Bold.ttf -o app/src/main/res/font/brand_bold.ttf || cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf app/src/main/res/font/brand_bold.ttf
          curl -sL --retry 3 https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf -o app/src/main/res/font/brand_regular.ttf || cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf app/src/main/res/font/brand_regular.ttf

