              private fun extractYouTubeId(rawUrl: String): String? {
                  val trimmed = rawUrl.trim()
                  val patterns = arrayOf(
                      "(?:v=|v%3D|/v/|youtu\\.be/|/embed/|/shorts/|/live/|/e/|watch\\?feature=[^&]*&v=)([a-zA-Z0-9_-]{11})",
                      "(?:[\\?&]v=)([a-zA-Z0-9_-]{11})",
                      "([a-zA-Z0-9_-]{11})"
                  )
                  for (p in patterns) {
                      val matcher = Pattern.compile(p, Pattern.CASE_INSENSITIVE).matcher(trimmed)
                      if (matcher.find()) {
                          return matcher.group(1)
                      }
                  }
                  return null
              }
          
              private fun codecHasMedia(codec: String?): Boolean {
                  val c = codec?.trim()?.lowercase(Locale.US) ?: return false
                  return c.isNotEmpty() && c != "none" && c != "null"
              }
          
              private fun parseHeightFromText(vararg values: String?): Int {
                  for (value in values) {
                      if (value.isNullOrBlank()) continue
          
                      // Matches text such as 1080p, 720p60, 2160P HDR, etc.
                      val pMatcher = Pattern.compile("""(?<!\d)(144|240|360|480|720|1080|1440|2160|4320)p(?:\d{2})?""", Pattern.CASE_INSENSITIVE).matcher(value)
                      if (pMatcher.find()) {
                          return pMatcher.group(1)?.toIntOrNull() ?: 0
                      }
          
                      // Matches resolution strings such as 1920x1080 or 1080x1920.
                      val resMatcher = Pattern.compile("""(\d{2,5})\s*[x×]\s*(\d{2,5})""", Pattern.CASE_INSENSITIVE).matcher(value)
                      if (resMatcher.find()) {
                          val w = resMatcher.group(1)?.toIntOrNull() ?: 0
                          val h = resMatcher.group(2)?.toIntOrNull() ?: 0
                          if (w > 0 && h > 0) return minOf(w, h)
                      }
                  }
                  return 0
              }
          
              private fun detectFormatHeight(width: Int, height: Int, format: String?, formatNote: String?): Int {
                  if (height > 0) return height
                  return parseHeightFromText(formatNote, format)
              }
          
              private fun videoQualityLabel(height: Int): String? {
                  return when (height) {
                      4320 -> "4320p (8K UHD)"
                      2160 -> "2160p (4K UHD)"
                      1440 -> "1440p (2K QHD)"
                      1080 -> "1080p (Full HD)"
                      720 -> "720p (HD)"
                      480 -> "480p"
                      360 -> "360p"
                      240 -> "240p"
                      144 -> "144p"
                      else -> if (height > 0) "${height}p" else null
                  }
              }
          
              private fun sortDetectedHeights(heights: Set<Int>): List<Int> {
                  val preferredOrder = listOf(4320, 2160, 1440, 1080, 720, 480, 360, 240, 144)
                  val known = preferredOrder.filter { it in heights }
                  val unknown = heights.filter { it !in preferredOrder && it > 0 }.sortedDescending()
                  return known + unknown
              }
          
              private fun handleWifiOnlySettingToggled(wifiOnlyEnabled: Boolean) {
                  if (wifiOnlyEnabled) {
                      if (DownloadService.isDownloading && !NetworkHelper.isWifiConnected(this)) {
                          showAppToast("Wi-Fi Only enabled. Pausing download until Wi-Fi is connected.", true)
                          val pauseIntent = Intent(this, DownloadService::class.java).apply {
                              action = DownloadService.ACTION_PAUSE
                              putExtra(DownloadService.EXTRA_PAUSE_REASON, PauseReason.WAITING_WIFI.name)
                          }
                          startService(pauseIntent)
                      }
                  } else {
                      val waitingWifi = QueueManager.getWaitingWifiItem(this)
                      if (waitingWifi != null && !DownloadService.isDownloading) {
                          showAppToast("Wi-Fi Only disabled. Resuming download on available connection.")
                          QueueManager.resumeItem(this, waitingWifi.id)
                      } else if (!DownloadService.isDownloading && !DownloadService.isPaused) {
                          QueueManager.startNext(this)
                      }
                  }
                  refreshQueueUI()
              }
          
              private fun registerActivityNetworkMonitoring() {
                  if (activityNetworkCallback != null) return
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as? android.net.ConnectivityManager ?: return
                  try {
                      val builder = android.net.NetworkRequest.Builder()
                          .addCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      activityNetworkCallback = object : android.net.ConnectivityManager.NetworkCallback() {
                          override fun onCapabilitiesChanged(network: android.net.Network, networkCapabilities: android.net.NetworkCapabilities) {
                              runOnUiThread {
                                  QueueManager.onNetworkAvailabilityChanged(this@MainActivity)
                                  refreshQueueUI()
                              }
                          }
          
                          override fun onLost(network: android.net.Network) {
                              runOnUiThread {
                                  QueueManager.onNetworkAvailabilityChanged(this@MainActivity)
                                  refreshQueueUI()
                              }
                          }
                      }
                      cm.registerNetworkCallback(builder.build(), activityNetworkCallback!!)
                  } catch (e: Exception) {
                      Log.w("MainActivity", "Error registering network callback: ${e.message}")
                  }
              }
          
              private fun unregisterActivityNetworkMonitoring() {
                  activityNetworkCallback?.let {
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as? android.net.ConnectivityManager
                          cm?.unregisterNetworkCallback(it)
                      } catch (e: Exception) {}
                      activityNetworkCallback = null
                  }
              }
          
