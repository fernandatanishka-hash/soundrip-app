              private fun renderFavoritesUI() {
                  if (!::favoritesListContainer.isInitialized) return
                  favoritesListContainer.removeAllViews()
          
                  val favSet = prefs.getStringSet("flowrip_favorites_set", emptySet()) ?: emptySet()
                  val searchQuery = if (::favoritesSearchInput.isInitialized) favoritesSearchInput.text.toString().trim() else ""
          
                  val favItems = cachedHistoryItems.filter { item ->
                      val key = item.id.ifEmpty { item.name }
                      favSet.contains(key)
                  }
          
                  val typeFiltered = when (favoritesFilter) {
                      "VIDEO" -> favItems.filter { !it.isAudio }
