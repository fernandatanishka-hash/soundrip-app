          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="48dp"
              android:background="@drawable/bg_spinner_item_selector"
              android:gravity="center_vertical"
              android:paddingStart="18dp"
              android:paddingEnd="18dp"
              android:paddingTop="12dp"
              android:paddingBottom="12dp"
              android:singleLine="true"
              android:ellipsize="end"
              android:textColor="#0F172A"
              android:textSize="14sp"
              android:textStyle="bold" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:background="#F8FAFC">

              <!-- App Pages Container -->
              <FrameLayout
                  android:id="@+id/containerPages"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/bottomNavSection">

                  <!-- PAGE 1: HOME -->
                  <ScrollView
                      android:id="@+id/pageHome"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:fillViewport="true"
                      android:scrollbars="none">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:paddingHorizontal="24dp"
                          android:paddingTop="36dp"
                          android:paddingBottom="24dp">

                          <!-- Brand Header Row -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical">

                              <androidx.cardview.widget.CardView
                                  android:layout_width="40dp"
                                  android:layout_height="40dp"
                                  app:cardCornerRadius="20dp"
                                  app:cardElevation="2dp"
                                  app:cardBackgroundColor="#03030C">

                                  <ImageView
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:src="@drawable/ic_launcher_emblem"
                                      android:scaleType="fitCenter"
                                      android:padding="5dp" />
                              </androidx.cardview.widget.CardView>

                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginStart="10dp"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:background="@drawable/bg_badge"
                                  android:paddingHorizontal="14dp"
                                  android:paddingVertical="7dp">

                                  <View
                                      android:layout_width="7dp"
                                      android:layout_height="7dp"
                                      android:background="#10B981" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="  Ultra HD 1080p &amp; 320kbps MP3"
                                      android:textColor="#4F46E5"
                                      android:textSize="11sp"
                                      android:textStyle="bold" />
                              </LinearLayout>
                          </LinearLayout>

                          <!-- Hero Title -->
                          <LinearLayout
                              android:id="@+id/viewHomeHero"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:layout_marginTop="20dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Download Media"
                                  android:textColor="#0F172A"
                                  android:textSize="30sp"
                                  android:textStyle="bold"
                                  android:letterSpacing="-0.02" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Fast, studio-quality MP3 audio and 1080p MP4 video downloads from YouTube."
                                  android:textColor="#64748B"
                                  android:textSize="13sp"
                                  android:layout_marginTop="6dp"
                                  android:lineSpacingExtra="3dp" />
                          </LinearLayout>

                          <!-- FULL-WIDTH URL INPUT PILL -->
                          <androidx.cardview.widget.CardView
                              android:layout_width="match_parent"
                              android:layout_height="58dp"
                              android:layout_marginTop="24dp"
                              app:cardCornerRadius="29dp"
                              app:cardElevation="3dp"
                              app:cardBackgroundColor="#FFFFFF">

                              <RelativeLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:paddingHorizontal="20dp">

                                  <TextView
                                      android:id="@+id/txtLinkIcon"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_centerVertical="true"
                                      android:text="🔗"
                                      android:textSize="16sp" />

                                  <EditText
                                      android:id="@+id/urlInput"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:layout_toEndOf="@id/txtLinkIcon"
                                      android:layout_toStartOf="@+id/btnClear"
                                      android:layout_marginStart="10dp"
                                      android:layout_marginEnd="6dp"
                                      android:background="@null"
                                      android:hint="Paste YouTube video or music link..."
                                      android:textColorHint="#94A3B8"
                                      android:textColor="#0F172A"
                                      android:textSize="13sp"
                                      android:singleLine="true"
                                      android:imeOptions="actionDone" />

                                  <TextView
                                      android:id="@+id/btnClear"
                                      android:layout_width="28dp"
                                      android:layout_height="28dp"
                                      android:layout_alignParentEnd="true"
                                      android:layout_centerVertical="true"
                                      android:text="✕"
                                      android:textColor="#94A3B8"
                                      android:textSize="14sp"
                                      android:gravity="center"
                                      android:visibility="gone" />
                              </RelativeLayout>
                          </androidx.cardview.widget.CardView>

                          <!-- FULL-WIDTH MAIN ACTION BUTTON (DIRECTLY BELOW INPUT) -->
                          <Button
                              android:id="@+id/btnMainAction"
                              android:layout_width="match_parent"
                              android:layout_height="56dp"
                              android:layout_marginTop="14dp"
                              android:text="📋 PASTE LINK"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold"
                              android:backgroundTint="#4F46E5"
                              app:cornerRadius="28dp"
                              android:elevation="4dp" />

                          <!-- VALUE PROPOSITION BADGES -->
                          <LinearLayout
                              android:id="@+id/viewHomeFeatures"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:layout_marginTop="32dp">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:paddingVertical="12dp">

                                  <androidx.cardview.widget.CardView
                                      android:layout_width="44dp"
                                      android:layout_height="44dp"
                                      app:cardCornerRadius="22dp"
                                      app:cardElevation="0dp"
                                      app:cardBackgroundColor="#EEF2FF">
                                      <TextView
                                          android:layout_width="match_parent"
                                          android:layout_height="match_parent"
                                          android:text="⚡"
                                          android:textSize="18sp"
                                          android:gravity="center" />
                                  </androidx.cardview.widget.CardView>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical"
                                      android:layout_marginStart="14dp">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Instant Multi-Threaded Engine"
                                          android:textColor="#0F172A"
                                          android:textSize="13sp"
                                          android:textStyle="bold" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Powered by optimized yt-dlp &amp; FFmpeg"
                                          android:textColor="#64748B"
                                          android:textSize="11sp" />
                                  </LinearLayout>
                              </LinearLayout>

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:paddingVertical="12dp">

                                  <androidx.cardview.widget.CardView
                                      android:layout_width="44dp"
                                      android:layout_height="44dp"
                                      app:cardCornerRadius="22dp"
                                      app:cardElevation="0dp"
                                      app:cardBackgroundColor="#ECFDF5">
                                      <TextView
                                          android:layout_width="match_parent"
                                          android:layout_height="match_parent"
                                          android:text="🎬"
                                          android:textSize="18sp"
                                          android:gravity="center" />
                                  </androidx.cardview.widget.CardView>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical"
                                      android:layout_marginStart="14dp">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Both Audio (MP3) &amp; Video (MP4)"
                                          android:textColor="#0F172A"
                                          android:textSize="13sp"
                                          android:textStyle="bold" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Crystal-clear 1080p, 720p HD and 320kbps audio"
                                          android:textColor="#64748B"
                                          android:textSize="11sp" />
                                  </LinearLayout>
                              </LinearLayout>

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:paddingVertical="12dp">

                                  <androidx.cardview.widget.CardView
                                      android:layout_width="44dp"
                                      android:layout_height="44dp"
                                      app:cardCornerRadius="22dp"
                                      app:cardElevation="0dp"
                                      app:cardBackgroundColor="#FEF3C7">
                                      <TextView
                                          android:layout_width="match_parent"
                                          android:layout_height="match_parent"
                                          android:text="📂"
                                          android:textSize="18sp"
                                          android:gravity="center" />
                                  </androidx.cardview.widget.CardView>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical"
                                      android:layout_marginStart="14dp">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Direct Phone Storage"
                                          android:textColor="#0F172A"
                                          android:textSize="13sp"
                                          android:textStyle="bold" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Saved right in your phone's Downloads folder"
                                          android:textColor="#64748B"
                                          android:textSize="11sp" />
                                  </LinearLayout>
                              </LinearLayout>
                          </LinearLayout>

                          <!-- PREVIEW CARD -->
                          <androidx.cardview.widget.CardView
                              android:id="@+id/viewPreviewCard"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="20dp"
                              android:visibility="gone"
                              app:cardCornerRadius="20dp"
                              app:cardElevation="4dp"
                              app:cardBackgroundColor="#FFFFFF">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical"
                                  android:padding="18dp">

                                  <!-- Thumbnail with Rounded Corners -->
                                  <androidx.cardview.widget.CardView
                                      android:layout_width="match_parent"
                                      android:layout_height="180dp"
                                      app:cardCornerRadius="14dp"
                                      app:cardElevation="0dp">

                                      <ImageView
                                          android:id="@+id/previewThumbnail"
                                          android:layout_width="match_parent"
                                          android:layout_height="match_parent"
                                          android:scaleType="centerCrop"
                                          android:src="@drawable/ic_play_gradient" />
                                  </androidx.cardview.widget.CardView>

                                  <TextView
                                      android:id="@+id/previewTitle"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:text="Loading media..."
                                      android:textColor="#0F172A"
                                      android:textSize="15sp"
                                      android:textStyle="bold"
                                      android:layout_marginTop="12dp"
                                      android:maxLines="2"
                                      android:ellipsize="end" />

                                  <TextView
                                      android:id="@+id/previewDetails"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:text="Fetching stream details..."
                                      android:textColor="#64748B"
                                      android:textSize="12sp"
                                      android:layout_marginTop="3dp" />

                                  <!-- Format Selector Tabs (MP3 vs MP4) -->
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Select Format:"
                                      android:textColor="#0F172A"
                                      android:textSize="12sp"
                                      android:textStyle="bold"
                                      android:layout_marginTop="16dp" />

                                  <LinearLayout
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:layout_marginTop="8dp">

                                      <!-- MP3 Card -->
                                      <LinearLayout
                                          android:id="@+id/cardMp3"
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1"
                                          android:background="@drawable/bg_card_selected"
                                          android:orientation="vertical"
                                          android:padding="12dp">

                                          <LinearLayout
                                              android:layout_width="match_parent"
                                              android:layout_height="wrap_content"
                                              android:orientation="horizontal"
                                              android:gravity="center_vertical">

                                              <TextView
                                                  android:id="@+id/radioDotMp3"
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="●"
                                                  android:textColor="#4F46E5"
                                                  android:textSize="14sp" />

                                              <TextView
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="  MP3 Audio"
                                                  android:textColor="#0F172A"
                                                  android:textSize="13sp"
                                                  android:textStyle="bold" />
                                          </LinearLayout>

                                          <TextView
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="Music &amp; Podcasts"
                                              android:textColor="#64748B"
                                              android:textSize="11sp"
                                              android:layout_marginTop="4dp" />
                                      </LinearLayout>

                                      <View
                                          android:layout_width="12dp"
                                          android:layout_height="1dp" />

                                      <!-- MP4 Card -->
                                      <LinearLayout
                                          android:id="@+id/cardMp4"
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1"
                                          android:background="@drawable/bg_card_unselected"
                                          android:orientation="vertical"
                                          android:padding="12dp">

                                          <LinearLayout
                                              android:layout_width="match_parent"
                                              android:layout_height="wrap_content"
                                              android:orientation="horizontal"
                                              android:gravity="center_vertical">

                                              <TextView
                                                  android:id="@+id/radioDotMp4"
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="○"
                                                  android:textColor="#94A3B8"
                                                  android:textSize="14sp" />

                                              <TextView
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="  MP4 Video"
                                                  android:textColor="#0F172A"
                                                  android:textSize="13sp"
                                                  android:textStyle="bold" />
                                          </LinearLayout>

                                          <TextView
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:id="@+id/txtMp4Subtitle"
                                              android:text="Up to 1080p Full HD"
                                              android:textColor="#64748B"
                                              android:textSize="11sp"
                                              android:layout_marginTop="4dp" />
                                      </LinearLayout>
                                  </LinearLayout>

                                  <!-- Quality Dropdown & Loading Indicator -->
                                  <TextView
                                      android:id="@+id/qualityLabel"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Quality:"
                                      android:textColor="#0F172A"
                                      android:textSize="12sp"
                                      android:textStyle="bold"
                                      android:layout_marginTop="14dp" />

                                  <!-- Dynamic Quality Detection Loading State -->
                                  <LinearLayout
                                      android:id="@+id/layoutQualityLoading"
                                      android:layout_width="match_parent"
                                      android:layout_height="44dp"
                                      android:layout_marginTop="6dp"
                                      android:background="@drawable/bg_card_unselected"
                                      android:orientation="horizontal"
                                      android:gravity="center_vertical"
                                      android:paddingStart="14dp"
                                      android:paddingEnd="14dp"
                                      android:visibility="gone">

                                      <ProgressBar
                                          android:id="@+id/progressQualityLoading"
                                          android:layout_width="18dp"
                                          android:layout_height="18dp"
                                          android:indeterminate="true"
                                          android:indeterminateTint="#4F46E5" />

                                      <TextView
                                          android:id="@+id/txtQualityLoading"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:layout_marginStart="10dp"
                                          android:text="Detecting available stream qualities..."
                                          android:textColor="#64748B"
                                          android:textSize="12sp"
                                          android:textStyle="bold" />
                                  </LinearLayout>

                                  <androidx.appcompat.widget.AppCompatSpinner
                                      android:id="@+id/qualitySpinner"
                                      android:layout_width="match_parent"
                                      android:layout_height="44dp"
                                      android:layout_marginTop="6dp"
                                      android:background="@drawable/bg_card_unselected"
                                      android:spinnerMode="dropdown"
                                      android:popupBackground="@drawable/bg_spinner_popup"
                                      app:popupTheme="@style/Theme.FlowRip.SpinnerPopup" />

                                  <!-- Start Download Action Button -->
                                  <Button
                                      android:id="@+id/btnStartDownload"
                                      android:layout_width="match_parent"
                                      android:layout_height="54dp"
                                      android:layout_marginTop="18dp"
                                      android:text="⬇ START DOWNLOAD"
                                      android:textColor="#FFFFFF"
                                      android:textSize="14sp"
                                      android:textStyle="bold"
                                      android:backgroundTint="#4F46E5"
                                      app:cornerRadius="27dp" />
                              </LinearLayout>
                          </androidx.cardview.widget.CardView>

                          <!-- DOWNLOADING PROGRESS CARD -->
                          <androidx.cardview.widget.CardView
                              android:id="@+id/viewDownloadingCard"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="20dp"
                              android:visibility="gone"
                              app:cardCornerRadius="20dp"
                              app:cardElevation="4dp"
                              app:cardBackgroundColor="#FFFFFF">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical"
                                  android:gravity="center_horizontal"
                                  android:padding="24dp">

                                  <!-- Track Info Row -->
                                  <LinearLayout
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:gravity="center_vertical">

                                      <androidx.cardview.widget.CardView
                                          android:layout_width="56dp"
                                          android:layout_height="56dp"
                                          app:cardCornerRadius="12dp"
                                          app:cardElevation="0dp">

                                          <ImageView
                                              android:id="@+id/downloadingThumb"
                                              android:layout_width="match_parent"
                                              android:layout_height="match_parent"
                                              android:scaleType="centerCrop"
                                              android:src="@drawable/ic_play_gradient" />
                                      </androidx.cardview.widget.CardView>

                                      <LinearLayout
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1"
                                          android:orientation="vertical"
                                          android:layout_marginStart="14dp">

                                          <TextView
                                              android:id="@+id/downloadingTitle"
                                              android:layout_width="match_parent"
                                              android:layout_height="wrap_content"
                                              android:text="Downloading media..."
                                              android:textColor="#0F172A"
                                              android:textSize="14sp"
                                              android:textStyle="bold"
                                              android:maxLines="1"
                                              android:ellipsize="end" />

                                          <TextView
                                              android:id="@+id/downloadingFormat"
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="MP3 • 320 kbps"
                                              android:textColor="#4F46E5"
                                              android:textSize="11sp"
                                              android:layout_marginTop="3dp" />
                                      </LinearLayout>
                                  </LinearLayout>

                                  <!-- Large Circular Percentage Indicator -->
                                  <RelativeLayout
                                      android:layout_width="140dp"
                                      android:layout_height="140dp"
                                      android:layout_marginTop="26dp">

                                      <ProgressBar
                                          android:id="@+id/circularProgressBar"
                                          style="?android:attr/progressBarStyleHorizontal"
                                          android:layout_width="140dp"
                                          android:layout_height="140dp"
                                          android:indeterminate="false"
                                          android:max="100"
                                          android:progress="0"
                                          android:progressDrawable="@drawable/circular_progress_drawable" />

                                      <LinearLayout
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:layout_centerInParent="true"
                                          android:gravity="center"
                                          android:orientation="vertical">

                                          <TextView
                                              android:id="@+id/txtCircularPercent"
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="0%"
                                              android:textColor="#0F172A"
                                              android:textSize="26sp"
                                              android:textStyle="bold" />

                                          <TextView
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="DOWNLOADING"
                                              android:textColor="#94A3B8"
                                              android:textSize="9sp"
                                              android:textStyle="bold" />
                                      </LinearLayout>
                                  </RelativeLayout>

                                  <!-- Linear Progress Bar -->
                                  <ProgressBar
                                      android:id="@+id/linearProgressBar"
                                      style="@style/Widget.AppCompat.ProgressBar.Horizontal"
                                      android:layout_width="match_parent"
                                      android:layout_height="6dp"
                                      android:layout_marginTop="24dp"
                                      android:max="100"
                                      android:progress="0"
                                      android:progressTint="#6366F1" />

                                  <TextView
                                      android:id="@+id/txtDownloadStats"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Connecting to stream..."
                                      android:textColor="#64748B"
                                      android:textSize="12sp"
                                      android:layout_marginTop="8dp" />
                                  <!-- Live Download Metrics Bar (Speed, Size, ETA) -->
                                  <LinearLayout
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:layout_marginTop="14dp"
                                      android:background="@drawable/bg_badge"
                                      android:padding="12dp">

                                      <!-- Speed Metric -->
                                      <LinearLayout
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1"
                                          android:gravity="center"
                                          android:orientation="vertical">

                                          <TextView
                                              android:id="@+id/txtDownloadSpeed"
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="--"
                                              android:textColor="#0F172A"
                                              android:textSize="13sp"
                                              android:textStyle="bold"
                                              android:maxLines="1" />

                                          <TextView
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="SPEED"
                                              android:textColor="#94A3B8"
                                              android:textSize="9sp"
                                              android:textStyle="bold"
                                              android:layout_marginTop="2dp" />
                                      </LinearLayout>

                                      <View
                                          android:layout_width="1dp"
                                          android:layout_height="24dp"
                                          android:layout_gravity="center_vertical"
                                          android:background="#E2E8F0" />

                                      <!-- Size Metric -->
                                      <LinearLayout
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1.3"
                                          android:gravity="center"
                                          android:orientation="vertical">

