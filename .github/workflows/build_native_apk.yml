                      top.contains("1440") || top.contains("2K") -> "Up to 1440p 2K QHD"
                      top.contains("1080") -> "Up to 1080p Full HD"
                      top.contains("720") -> "Up to 720p HD"
                      top.contains("480") -> "Up to 480p"
                      top.contains("360") -> "Up to 360p"
                      top.contains("240") -> "Up to 240p"
