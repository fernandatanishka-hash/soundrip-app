              private fun openNowPlaying(item: StorageHelper.HistoryItem) {
                  currentPlayingItem = item
                  overlayNowPlaying?.let { overlay ->
                      overlay.visibility = View.VISIBLE
                      findViewById<TextView>(R.id.txtPlayerTitle)?.text = item.name
                      findViewById<TextView>(R.id.txtPlayerArtist)?.text = "FlowRip Audio • ${item.resolution ?: "MP3"}"
                      val txtPlayIcon = findViewById<TextView>(R.id.txtPlayerPlayIcon)
          
                      try {
                          currentMediaPlayer?.stop()
                          currentMediaPlayer?.release()
                          currentMediaPlayer = null
          
                          val uri = if (item.file != null) {
                              android.net.Uri.fromFile(item.file)
                          } else {
                              item.uri
                          }
          
                          if (uri != null) {
                              currentMediaPlayer = android.media.MediaPlayer().apply {
                                  setDataSource(applicationContext, uri)
                                  prepare()
                                  start()
                                  setOnCompletionListener {
                                      txtPlayIcon?.text = "▶"
                                      isPlayingAudio = false
                                  }
                              }
                              txtPlayIcon?.text = "❚❚"
                              isPlayingAudio = true
                          }
                      } catch (e: Exception) {
                          playExternalMedia(item)
                      }
                  }
              }
          
              private fun shareItem(item: StorageHelper.HistoryItem) {
                  try {
                      val uri = if (item.file != null) {
                          FileProvider.getUriForFile(this, "$packageName.provider", item.file)
                      } else {
                          item.uri ?: return
                      }
                      val mimeType = if (item.isAudio) "audio/*" else "video/*"
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = mimeType
                          putExtra(Intent.EXTRA_STREAM, uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share media via"))
                  } catch (e: Exception) {
                      showAppToast("Could not share file: ${e.message}")
                  }
              }
          
              private fun confirmAndDeleteItem(item: StorageHelper.HistoryItem) {
                  MaterialAlertDialogBuilder(this)
                      .setTitle("Delete this file?")
                      .setMessage("\"${item.name}\"\n\nThis will permanently delete this file from your device.")
                      .setPositiveButton("Delete") { _, _ ->
                          thread(name = "FlowRipDeleteThread") {
                              var deleted = false
                              try {
                                  if (item.file != null) {
                                      deleted = item.file.delete()
                                      if (deleted) {
                                          MediaScannerConnection.scanFile(
                                              applicationContext,
                                              arrayOf(item.file.absolutePath),
                                              null,
                                              null
                                          )
                                      }
                                  } else if (item.uri != null) {
                                      deleted = try {
                                          DocumentsContract.deleteDocument(contentResolver, item.uri)
                                      } catch (e: Exception) {
                                          DocumentFile.fromSingleUri(this@MainActivity, item.uri)?.delete() ?: false
                                      }
                                  }
                              } catch (e: Exception) {
                                  Log.w("MainActivity", "Error deleting file: ${e.message}")
                                  deleted = false
                              }
          
                              runOnUiThread {
                                  if (deleted) {
                                      thumbnailCache.remove(item.id)
                                      thumbnailCache.remove(getThumbnailCacheKey(item))
                                      try {
                                          val diskFile = getDiskThumbnailFile(this@MainActivity, getThumbnailCacheKey(item))
                                          if (diskFile.exists()) diskFile.delete()
                                      } catch (e: Exception) {}
                                      cachedHistoryItems = cachedHistoryItems.filter { it.id != item.id }
                                      renderHistoryUI()
                                      showAppToast("File deleted")
                                  } else {
                                      showAppToast("Could not delete file")
                                  }
                              }
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }
          
              private fun attachDownloadListener() {
                  DownloadService.setListener { event ->
                      runOnUiThread {
                          when (event) {
                              is DownloadService.DownloadEvent.Progress -> {
                                  showDownloaderState(2)
                                  updatePauseResumeButton(isPaused = false)
                                  downloadingTitle.text = DownloadService.currentTitle
                                  downloadingFormat.text = DownloadService.currentFormat
                                  val p = maxOf(circularProgressBar.progress, event.progress)
                                  updateDownloadProgressAnimated(p, animate = true)
                                  txtDownloadSpeed.text = event.speed
                                  txtDownloadSize.text = event.sizeInfo
                                  txtDownloadEta.text = event.eta
                                  txtDownloadStats.text = event.stats
                                  refreshQueueUI()
                              }
                              is DownloadService.DownloadEvent.Paused -> {
                                  showDownloaderState(2)
                                  updatePauseResumeButton(isPaused = true)
                                  downloadingTitle.text = DownloadService.currentTitle
                                  downloadingFormat.text = DownloadService.currentFormat
                                  circularProgressBar.progress = event.progress
                                  txtCircularPercent.text = "${event.progress}%"
                                  linearProgressBar.progress = event.progress
                                  txtDownloadSpeed.text = "--"
                                  txtDownloadEta.text = "--"
                                  txtDownloadSize.text = event.sizeInfo
                                  val statusMsg = if (event.reason == PauseReason.WAITING_WIFI) "Waiting for Wi-Fi" else "Download paused"
                                  txtDownloadStats.text = statusMsg
                                  refreshQueueUI()
                              }
                              is DownloadService.DownloadEvent.Resumed -> {
                                  showDownloaderState(2)
                                  updatePauseResumeButton(isPaused = false)
                                  txtDownloadStats.text = "Resuming download..."
                                  refreshQueueUI()
                              }
                              is DownloadService.DownloadEvent.Completed -> {
                                  lastDownloadedFile = event.file
                                  updatePauseResumeButton(isPaused = false)
                                  completedFileName.text = event.file.name + event.resolutionInfo
                                  refreshHistory()
                                  refreshQueueUI()
                                  val nextItem = QueueManager.getActiveItem(this@MainActivity)
                                      ?: QueueManager.getNextEligibleItem(this@MainActivity)
                                  if (nextItem != null) {
                                      downloadingTitle.text = nextItem.title
                                      downloadingFormat.text = "${nextItem.format} • ${nextItem.quality}"
                                      circularProgressBar.progress = 0
                                      txtCircularPercent.text = "0%"
                                      linearProgressBar.progress = 0
                                      txtDownloadSpeed.text = "--"
                                      txtDownloadSize.text = "--"
                                      txtDownloadEta.text = "--"
                                      txtDownloadStats.text = "Starting next download..."
                                      showDownloaderState(2)
                                  } else {
                                      circularProgressBar.progress = 100
                                      linearProgressBar.progress = 100
                                      txtCircularPercent.text = "100%"
                                      txtDownloadSpeed.text = "--"
                                      txtDownloadSize.text = "--"
                                      txtDownloadEta.text = "--"
                                      showDownloaderState(3)
                                      val completeBrand = findViewById<View>(R.id.containerCompleteBrand)
                                      completeBrand?.let { cb ->
                                          cb.scaleX = 0.85f
                                          cb.scaleY = 0.85f
                                          cb.alpha = 0f
                                          cb.animate()
                                              .scaleX(1.0f)
                                              .scaleY(1.0f)
                                              .alpha(1.0f)
                                              .setDuration(220L)
                                              .setInterpolator(DecelerateInterpolator())
                                              .start()
                                      }
                                  }
                                  showAppToast("Download Complete!${event.resolutionInfo}", true)
                              }
                              is DownloadService.DownloadEvent.Error -> {
                                  updatePauseResumeButton(isPaused = false)
                                  txtDownloadSpeed.text = "--"
                                  txtDownloadSize.text = "--"
                                  txtDownloadEta.text = "--"
                                  refreshQueueUI()
                                  val nextItem = QueueManager.getActiveItem(this@MainActivity)
                                      ?: QueueManager.getNextEligibleItem(this@MainActivity)
                                  if (nextItem != null) {
                                      downloadingTitle.text = nextItem.title
                                      downloadingFormat.text = "${nextItem.format} • ${nextItem.quality}"
                                      circularProgressBar.progress = 0
                                      txtCircularPercent.text = "0%"
                                      linearProgressBar.progress = 0
                                      txtDownloadStats.text = "Starting next download..."
                                      showDownloaderState(2)
                                  } else {
                                      showErrorState(event.message)
                                  }
                              }
                              is DownloadService.DownloadEvent.Cancelled -> {
                                  updatePauseResumeButton(isPaused = false)
                                  circularProgressBar.progress = 0
                                  linearProgressBar.progress = 0
                                  txtCircularPercent.text = "0%"
                                  txtDownloadSpeed.text = "--"
                                  txtDownloadSize.text = "--"
                                  txtDownloadEta.text = "--"
                                  refreshQueueUI()
                                  val nextItem = QueueManager.getActiveItem(this@MainActivity)
                                      ?: QueueManager.getNextEligibleItem(this@MainActivity)
                                  if (nextItem != null) {
                                      downloadingTitle.text = nextItem.title
                                      downloadingFormat.text = "${nextItem.format} • ${nextItem.quality}"
                                      circularProgressBar.progress = 0
                                      txtDownloadStats.text = "Starting next download..."
                                      showDownloaderState(2)
                                  } else {
                                      showDownloaderState(1)
                                      showAppToast("Download cancelled")
                                  }
                              }
                          }
                      }
                  }
              }
          
              private fun startDownloadFlow() {
                  val wasStillDetecting = isLoadingFormats
                  val rawInput = urlInput.text.toString().trim()
                  val cleanId = currentVideoId ?: extractYouTubeId(rawInput)
                  val url = if (cleanId != null) "https://www.youtube.com/watch?v=$cleanId" else rawInput
                  if (url.isEmpty()) return
          
                  val selectedQuality = qualitySpinner.selectedItem?.toString() ?: "Best"
                  if (selectedQuality.contains("No audio") || selectedQuality.contains("No video")) {
                      showAppToast("Selected format is not available for this media")
                      return
                  }
          
                  val resolvedTitle = if (previewTitle.text.toString().isNotEmpty() && previewTitle.text != "Loading media..." && previewTitle.text != "Inspecting stream...") {
                      previewTitle.text.toString()
                  } else {
                      downloadingTitle.text.toString().takeIf { it.isNotEmpty() && it != "Downloading media..." } ?: "Media File"
                  }
          
                  urlInput.text?.clear()
                  currentVideoId = null
                  lastFormatDetectionUrl = null
                  lastFormatErrorUrl = null
                  if (wasStillDetecting) {
                      // Stop the background detection job from touching UI after the download starts.
                      activeDetectionUrl = null
                      activeDetectionJobId = qualityRequestSequence.incrementAndGet()
                      isLoadingFormats = false
                  }
          
                  executeDownloadTask(url, resolvedTitle, isAudio, selectedQuality)
              }
          
              private fun executeDownloadTask(url: String, title: String, isAudioSelection: Boolean, selectedQuality: String) {
                  val item = QueueItem(
                      url = url,
                      title = title,
                      format = if (isAudioSelection) "MP3" else "MP4",
                      quality = selectedQuality,
                      isAudio = isAudioSelection
                  )
                  val startedNow = QueueManager.enqueue(this@MainActivity, item)
                  if (startedNow) {
                      showDownloaderState(2)
                      downloadingTitle.text = item.title
                      downloadingFormat.text = "${item.format} • ${item.quality}"
                      circularProgressBar.progress = 0
                      txtCircularPercent.text = "0%"
                      linearProgressBar.progress = 0
                      txtDownloadSpeed.text = "--"
                      txtDownloadSize.text = "--"
                      txtDownloadEta.text = "--"
                      txtDownloadStats.text = "Starting background download service..."
                  } else {
                      val wifiOnly = NetworkHelper.isWifiOnlyEnabled(this@MainActivity)
                      val wifiConnected = NetworkHelper.isWifiConnected(this@MainActivity)
                      if (wifiOnly && !wifiConnected) {
                          showAppToast("Added to queue: Waiting for Wi-Fi")
                      } else {
                          showAppToast("Added to download queue: ${item.title}")
                      }
                      if (DownloadService.isDownloading || DownloadService.isPaused || QueueManager.getPausedItem(this@MainActivity) != null) {
                          showDownloaderState(2)
                      } else {
                          showDownloaderState(0)
                      }
                  }
                  refreshQueueUI()
              }
          
              private fun refreshQueueUI() {
                  val items = QueueManager.getItems(this)
                  if (items.isEmpty()) {
                      viewQueueSection.visibility = View.GONE
                      return
                  }
          
                  viewQueueSection.visibility = View.VISIBLE
                  txtQueueBadge.text = "${items.size} ${if (items.size == 1) "item" else "items"}"
                  queueListContainer.removeAllViews()
          
                  items.forEach { item ->
                      val itemCard = androidx.cardview.widget.CardView(this).apply {
                          radius = dpToPx(16).toFloat()
                          cardElevation = dpToPx(2).toFloat()
                          setCardBackgroundColor(android.graphics.Color.parseColor("#13192B"))
                          val lp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          lp.bottomMargin = dpToPx(10)
                          layoutParams = lp
                          applyPressScaleEffect(0.985f)
                          alpha = 0f
                          translationY = dpToPx(8).toFloat()
                          animate()
                              .alpha(1f)
                              .translationY(0f)
                              .setDuration(160L)
                              .setInterpolator(DecelerateInterpolator())
                              .start()
                      }
          
                      val cardInner = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dpToPx(14), dpToPx(12), dpToPx(14), dpToPx(12))
                      }
          
                      val topRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = android.view.Gravity.CENTER_VERTICAL
                      }
          
                      val formatBadge = TextView(this).apply {
                          text = "${item.format} • ${item.quality}"
                          textSize = 10f
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                          setTextColor(if (item.isAudio) android.graphics.Color.parseColor("#4F46E5") else android.graphics.Color.parseColor("#059669"))
                          setBackgroundResource(R.drawable.bg_badge)
                          setPadding(dpToPx(8), dpToPx(3), dpToPx(8), dpToPx(3))
                      }
                      topRow.addView(formatBadge)
          
                      val statusBadge = TextView(this).apply {
                          val lp = LinearLayout.LayoutParams(
                              0,
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              1f
                          )
                          lp.marginStart = dpToPx(8)
                          layoutParams = lp
                          textSize = 11f
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                          when (item.status) {
                              QueueStatus.DOWNLOADING -> {
                                  text = "⚡ Active (${item.progress}%)"
                                  setTextColor(android.graphics.Color.parseColor("#4F46E5"))
                              }
                              QueueStatus.PAUSED -> {
                                  if (item.pauseReason == PauseReason.WAITING_WIFI) {
                                      text = "📶 Waiting for Wi-Fi (${item.progress}%)"
                                      setTextColor(android.graphics.Color.parseColor("#D97706"))
                                  } else {
                                      text = "⏸ Paused (${item.progress}%)"
                                      setTextColor(android.graphics.Color.parseColor("#F59E0B"))
                                  }
                              }
                              QueueStatus.QUEUED -> {
                                  val wifiOnly = NetworkHelper.isWifiOnlyEnabled(this@MainActivity)
                                  val wifiConnected = NetworkHelper.isWifiConnected(this@MainActivity)
                                  if (wifiOnly && !wifiConnected) {
                                      text = "⏳ Waiting for Wi-Fi"
                                      setTextColor(android.graphics.Color.parseColor("#D97706"))
                                  } else {
                                      text = "⏳ Waiting"
                                      setTextColor(android.graphics.Color.parseColor("#64748B"))
                                  }
                              }
                              QueueStatus.COMPLETED -> {
                                  text = "✓ Completed"
                                  setTextColor(android.graphics.Color.parseColor("#10B981"))
                              }
                              QueueStatus.FAILED -> {
                                  text = "✗ Failed"
                                  setTextColor(android.graphics.Color.parseColor("#EF4444"))
                              }
                              QueueStatus.CANCELLED -> {
                                  text = "⊘ Cancelled"
                                  setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                              }
                          }
                      }
                      topRow.addView(statusBadge)
          
                      when (item.status) {
