              fun switchTab(index: Int) {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as? InputMethodManager
                  imm?.hideSoftInputFromWindow(window.decorView.windowToken, 0)
                  currentFocus?.clearFocus()
          
                  if (index == currentTabIndex && ::pageHome.isInitialized && pageHome.visibility == View.VISIBLE) {
                      return
                  }
          
                  val pages = arrayOf(pageHome, pageHistory, pagePlaylist, pageSettings)
                  currentTabIndex = index
          
                  pages.forEachIndexed { i, p ->
                      if (i == index) {
                          p.alpha = 0f
                          p.visibility = View.VISIBLE
                          p.animate().alpha(1f).setDuration(180L).setInterpolator(DecelerateInterpolator()).start()
                      } else {
                          p.visibility = View.GONE
                      }
                  }
          
                  updateNavBar(index)
          
                  if (index == 1) refreshHistory(forceRescan = true)
                  if (index == 2) renderFavoritesUI()
                  if (index == 0) refreshQueueUI()
              }
          
