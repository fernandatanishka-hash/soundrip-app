                              // 4. Downloaded Size / Total Size (Cumulative across streams)
                              val dlMatcher = Pattern.compile("(\\d+(?:\\.\\d+)?\\s*(?:[KMGTP]?i?B|B))\\s+of", Pattern.CASE_INSENSITIVE).matcher(rawLine)
                              val totMatcher = Pattern.compile("of\\s+~?\\s*(\\d+(?:\\.\\d+)?\\s*(?:[KMGTP]?i?B|B))", Pattern.CASE_INSENSITIVE).matcher(rawLine)
                              val singleSizeMatcher = Pattern.compile("\\[download\\]\\s+(\\d+(?:\\.\\d+)?\\s*(?:[KMGTP]?i?B|B))\\s+at", Pattern.CASE_INSENSITIVE).matcher(rawLine)

                              if (dlMatcher.find() && totMatcher.find()) {
                                  val currentDlBytes = parseByteUnits(dlMatcher.group(1) ?: "")
                                  val currentTotBytes = parseByteUnits(totMatcher.group(1) ?: "")
                                  if (currentDlBytes > 0 && currentTotBytes > 0) {
                                      if (streamIndex <= 1) {
                                          stream1TotalBytes = currentTotBytes
                                          lastSizeInfo = "${formatBytes(currentDlBytes)} / ${formatBytes(currentTotBytes)}"
                                      } else {
                                          val overallDl = stream1TotalBytes + currentDlBytes
                                          val overallTot = stream1TotalBytes + currentTotBytes
                                          lastSizeInfo = "${formatBytes(overallDl)} / ${formatBytes(overallTot)}"
                                      }
                                      currentSizeInfo = lastSizeInfo
                                  }
                              } else if (totMatcher.find() && streamRawPct > 0f) {
                                  val currentTotBytes = parseByteUnits(totMatcher.group(1) ?: "")
                                  if (currentTotBytes > 0) {
                                      val currentDlBytes = (currentTotBytes * (streamRawPct / 100.0)).toLong()
                                      if (streamIndex <= 1) {
                                          stream1TotalBytes = currentTotBytes
                                          lastSizeInfo = "${formatBytes(currentDlBytes)} / ${formatBytes(currentTotBytes)}"
                                      } else {
                                          val overallDl = stream1TotalBytes + currentDlBytes
                                          val overallTot = stream1TotalBytes + currentTotBytes
                                          lastSizeInfo = "${formatBytes(overallDl)} / ${formatBytes(overallTot)}"
                                      }
                                      currentSizeInfo = lastSizeInfo
                                  }
                              } else if (singleSizeMatcher.find()) {
                                  val b = parseByteUnits(singleSizeMatcher.group(1) ?: "")
                                  if (b > 0) {
                                      lastSizeInfo = formatBytes(b)
                                      currentSizeInfo = lastSizeInfo
                                  }
                              }

                              // 5. Download phase status message
                              val statusText = when {
                                  rawLine.contains("[ExtractAudio]") ->
                                      "Extracting audio stream..."
                                  rawLine.contains("[Metadata]") ->
                                      "Embedding ID3 tags & artist info..."
                                  rawLine.contains("[EmbedThumbnail]") || rawLine.contains("[ThumbnailsConvertor]") ->
                                      "Embedding album artwork..."
                                  rawLine.contains("[Merger]") || rawLine.contains("Merging formats") || rawLine.contains("[ffmpeg]") ->
                                      "Merging formats with FFmpeg..."
                                  isProcessingPhase ->
                                      "Processing media with FFmpeg..."
                                  !isAudio && streamIndex >= 2 ->
                                      "Downloading audio track... $monotonicPercent%"
                                  monotonicPercent > 0 ->
                                      "Downloading stream... $monotonicPercent%"
                                  else ->
                                      "Connecting to stream..."
                              }
                              currentStatus = statusText

                              postEvent(DownloadEvent.Progress(monotonicPercent, lastSpeed, lastSizeInfo, lastEta, statusText))
                              updateNotification(currentTitle, monotonicPercent, lastSpeed, lastSizeInfo, lastEta, statusText, isPausedState = false)
                          }

                          val downloadedFiles = targetDir.listFiles()?.toList() ?: emptyList()
                          val newlyAdded = downloadedFiles.filter { it !in latestFilesBefore }
                          val finishedFile = newlyAdded.maxByOrNull { it.lastModified() }
                              ?: downloadedFiles.maxByOrNull { it.lastModified() }

                          var resInfo = ""
                          if (!isAudio && finishedFile != null) {
                              try {
                                  val retriever = MediaMetadataRetriever()
                                  retriever.setDataSource(finishedFile.absolutePath)
                                  val width = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)
                                  val height = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)
                                  if (!width.isNullOrEmpty() && !height.isNullOrEmpty()) {
                                      resInfo = " • ${width}x${height} HD"
                                  }
                                  retriever.release()
                              } catch (e: Exception) {}
                          }

                          var finalFile: File? = null
                          if (finishedFile != null) {
                              if (isCustomLocation && customTreeUri != null) {
                                  currentStatus = "Saving to custom folder..."
                                  postEvent(DownloadEvent.Progress(99, "--", "--", "--", currentStatus))
                                  val destinationUri = StorageHelper.copyToDocumentTree(applicationContext, finishedFile, customTreeUri)
                                  if (destinationUri != null) {
                                      Log.d(TAG, "File successfully transferred to custom SAF folder: $destinationUri")
                                      finalFile = finishedFile
                                  } else {
                                      Log.w(TAG, "SAF transfer failed; keeping file in default directory as safe fallback")
                                      val fallbackFile = StorageHelper.getUniqueDestinationFile(StorageHelper.getDefaultDownloadDir(), finishedFile.name)
                                      if (finishedFile.exists()) {
                                          if (finishedFile.renameTo(fallbackFile)) {
                                              finalFile = fallbackFile
                                          } else {
                                              finishedFile.copyTo(fallbackFile, overwrite = true)
                                              finishedFile.delete()
                                              finalFile = fallbackFile
                                          }
                                      }
                                  }
                              } else {
                                  val defaultDir = StorageHelper.getDefaultDownloadDir()
                                  val destinationFile = StorageHelper.getUniqueDestinationFile(defaultDir, finishedFile.name)
                                  if (finishedFile.exists()) {
                                      if (finishedFile.renameTo(destinationFile)) {
                                          finalFile = destinationFile
                                          Log.d(TAG, "Moved download to default folder: ${destinationFile.absolutePath}")
                                      } else {
                                          try {
                                              finishedFile.copyTo(destinationFile, overwrite = true)
                                              finishedFile.delete()
                                              finalFile = destinationFile
                                          } catch (e: Exception) {
                                              Log.w(TAG, "Copy to destination failed: ${e.message}")
                                              finalFile = finishedFile
                                          }
                                      }
                                  }
                              }
                          }

                          finalFile?.let { file ->
                              MediaScannerConnection.scanFile(
                                  applicationContext,
                                  arrayOf(file.absolutePath),
                                  arrayOf(if (isAudio) "audio/mpeg" else "video/mp4"),
                                  null
                              )

                              if (!isAudio) {
                                  try {
                                      val mmr = MediaMetadataRetriever()
                                      mmr.setDataSource(file.absolutePath)
                                      val w = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)
                                      val h = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)
                                      mmr.release()
                                      Log.i(TAG, "OUTPUT_RESOLUTION_VERIFIED: file='${file.name}', resolution=${w}x${h}, requestedQuality='$quality'")
                                  } catch (e: Exception) {
                                      Log.w(TAG, "Could not verify output resolution: ${e.message}")
                                  }
                              }
                          }

                          val completedTaskId = activeTaskId
                          activeTaskId = null

                          if (finishedFile != null) {
                              if (completedTaskId != null) {
                                  QueueManager.markCompleted(applicationContext, completedTaskId, finalFile ?: finishedFile)
                              }
                              postEvent(DownloadEvent.Completed(finishedFile, resInfo))
                              showCompletionNotification(finishedFile.name, resInfo)
                          } else {
                              val errMsg = "Download completed, but target file was not found."
                              lastError = errMsg
                              if (completedTaskId != null) {
                                  QueueManager.markFailed(applicationContext, completedTaskId, errMsg)
                              }
                              postEvent(DownloadEvent.Error(errMsg))
                          }

                          // Sequential Queue: Check for next eligible queued item
                          val nextItem = QueueManager.getNextEligibleItem(applicationContext)
                          if (nextItem != null) {
                              Log.d(TAG, "Sequential Queue: Starting next queued item: ${nextItem.title} (${nextItem.id})")
                              nextItem.status = QueueStatus.DOWNLOADING
                              QueueManager.saveQueue(applicationContext)
                              startDownloadTask(nextItem.id, nextItem.url, nextItem.title, nextItem.isAudio, nextItem.quality)
                          } else {
                              isDownloading = false
                              currentProgress = 100
                              currentSpeed = "--"
                              currentSizeInfo = "--"
                              currentEta = "--"
                              currentStatus = "All downloads complete"
                              lastError = null
                              stopForeground(true)
                              stopSelf()
                          }

                      } catch (e: Exception) {
                          val wasPaused = isPaused || (pausedTaskId != null && pausedTaskId == taskId)
                          val wasCancelled = (activeTaskId == null && !wasPaused)
                          val failedTaskId = activeTaskId ?: pausedTaskId
                          activeTaskId = null
                          currentSpeed = "--"
                          currentSizeInfo = "--"
                          currentEta = "--"

                          if (wasPaused) {
                              Log.d(TAG, "Real Pause: Download thread stopped for task $taskId, reason: $currentPauseReason. Partial files strictly preserved.")
                              isDownloading = false
                              val statusMsg = if (currentPauseReason == PauseReason.WAITING_WIFI) "Waiting for Wi-Fi" else "Download paused"
                              currentStatus = statusMsg
                              updateNotification(currentTitle, currentProgress, "--", currentSizeInfo, "--", statusMsg, isPausedState = true, pauseReason = currentPauseReason)
                              postEvent(DownloadEvent.Paused(currentProgress, currentSizeInfo, currentPauseReason))
                              return@thread
                          }

                          if (wasCancelled) {
                              cleanupPartialFiles(targetDir)
                              if (failedTaskId != null) {
                                  QueueManager.markCancelled(applicationContext, failedTaskId)
                              }
                              postEvent(DownloadEvent.Cancelled)
                          } else {
                              val rawMsg = e.message ?: "Unknown error"
                              Log.e(TAG, "Download error during execution: $rawMsg", e)
                              val userFriendlyMsg = extractUserFriendlyError(rawMsg)
                              lastError = userFriendlyMsg
                              cleanupPartialFiles(targetDir)
                              if (failedTaskId != null) {
                                  QueueManager.markFailed(applicationContext, failedTaskId, userFriendlyMsg)
                              }
                              postEvent(DownloadEvent.Error(userFriendlyMsg))
                              showFailureNotification(title, userFriendlyMsg)
                          }

                          // Sequential Queue: Move to next item ONLY after error or cancellation (never after pause)
                          val nextItem = QueueManager.getNextEligibleItem(applicationContext)
                          if (nextItem != null) {
                              Log.d(TAG, "Sequential Queue: Moving to next item after error/cancellation: ${nextItem.title} (${nextItem.id})")
                              nextItem.status = QueueStatus.DOWNLOADING
                              QueueManager.saveQueue(applicationContext)
                              startDownloadTask(nextItem.id, nextItem.url, nextItem.title, nextItem.isAudio, nextItem.quality)
                          } else {
                              isDownloading = false
                              stopForeground(true)
                              stopSelf()
                          }
                      }
                  }
              }

              private fun cancelDownloadTask(specificTaskId: String? = null) {
                  val taskIdToCancel = specificTaskId ?: activeTaskId ?: pausedTaskId ?: QueueManager.getPausedItem(applicationContext)?.id
                  val wasActive = (activeTaskId != null && activeTaskId == taskIdToCancel)

                  Log.d(TAG, "Real Cancel: Cancelling task $taskIdToCancel, deleting temporary files and advancing queue.")
                  activeTaskId = null
                  pausedTaskId = null
                  isPaused = false
                  currentPauseReason = PauseReason.NONE
                  isDownloading = false
                  currentProgress = 0
                  currentSpeed = "--"
                  currentSizeInfo = "--"
                  currentEta = "--"
                  currentStatus = "Cancelled"
                  lastError = null

                  if (taskIdToCancel != null) {
                      QueueManager.markCancelled(applicationContext, taskIdToCancel)
                      if (wasActive) {
                          thread {
                              try {
                                  YoutubeDL.getInstance().destroyProcessById(taskIdToCancel)
                              } catch (e: Exception) {
                                  Log.w(TAG, "Error destroying task $taskIdToCancel: ${e.message}")
                              }
                          }
                      }
                  }
                  val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                  val targetDir = File(publicDownloads, "FlowRip")
                  cleanupPartialFiles(targetDir)

                  notificationManager?.cancel(NOTIFICATION_ID)
                  postEvent(DownloadEvent.Cancelled)

                  val nextItem = QueueManager.getNextEligibleItem(applicationContext)
                  if (nextItem != null) {
                      Log.d(TAG, "Sequential Queue: Cancelled active, advancing to next: ${nextItem.title}")
                      nextItem.status = QueueStatus.DOWNLOADING
                      QueueManager.saveQueue(applicationContext)
                      startDownloadTask(nextItem.id, nextItem.url, nextItem.title, nextItem.isAudio, nextItem.quality)
                  } else {
                      stopForeground(true)
                      stopSelf()
                  }
              }

              private fun cleanupPartialFiles(targetDir: File?) {
                  try {
                      targetDir?.listFiles()?.forEach { file ->
                          if (file.name.endsWith(".part") || file.name.endsWith(".ytdl") || file.name.endsWith(".temp")) {
                              file.delete()
                          }
                      }
                      StorageHelper.getStagingDir(applicationContext).listFiles()?.forEach { file ->
                          if (file.name.endsWith(".part") || file.name.endsWith(".ytdl") || file.name.endsWith(".temp")) {
                              file.delete()
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun buildNotification(
                  title: String,
                  percent: Int,
                  speed: String,
                  sizeInfo: String,
                  eta: String,
                  statusText: String,
                  isPausedState: Boolean = false,
                  pauseReason: PauseReason = PauseReason.NONE
              ): Notification {
                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val openAppPendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openAppIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )

                  val cancelIntent = Intent(this, DownloadService::class.java).apply {
                      action = ACTION_CANCEL
                  }
                  val cancelPendingIntent = PendingIntent.getService(
                      this,
                      1,
                      cancelIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )

                  val pauseResumeIntent = Intent(this, DownloadService::class.java).apply {
                      action = if (isPausedState) ACTION_RESUME else ACTION_PAUSE
                  }
                  val pauseResumePendingIntent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && isPausedState) {
                      PendingIntent.getForegroundService(
                          this,
                          2,
                          pauseResumeIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                      )
                  } else {
                      PendingIntent.getService(
                          this,
                          2,
                          pauseResumeIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                      )
                  }

                  val contentLine = if (isPausedState) {
                      val prefix = if (pauseReason == PauseReason.WAITING_WIFI) "Waiting for Wi-Fi" else "Paused"
                      if (sizeInfo != "--") "$prefix ($percent%) • $sizeInfo" else "$prefix ($percent%)"
                  } else {
                      val contentSubText = buildString {
                          if (speed != "--") append(speed)
                          if (sizeInfo != "--") {
                              if (isNotEmpty()) append(" • ")
                              append(sizeInfo)
                          }
                          if (eta != "--") {
                              if (isNotEmpty()) append(" • ")
                              append(eta)
                          }
                      }
                      if (contentSubText.isNotEmpty()) "$percent% • $contentSubText" else statusText
                  }

                  val isIndeterminate = percent <= 0 && !isPausedState

                  val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle(title)
                      .setContentText(contentLine)
                      .setSmallIcon(R.drawable.ic_launcher_emblem)
                      .setContentIntent(openAppPendingIntent)
                      .setOngoing(!isPausedState)
                      .setOnlyAlertOnce(true)
                      .setProgress(100, percent.coerceIn(0, 100), isIndeterminate)

                  if (isPausedState) {
                      builder.addAction(android.R.drawable.ic_media_play, "Resume", pauseResumePendingIntent)
                  } else {
                      builder.addAction(android.R.drawable.ic_media_pause, "Pause", pauseResumePendingIntent)
                  }
                  builder.addAction(android.R.drawable.ic_menu_close_clear_cancel, "Cancel", cancelPendingIntent)

                  return builder.build()
              }

              private fun updateNotification(
                  title: String,
                  percent: Int,
                  speed: String,
                  sizeInfo: String,
                  eta: String,
                  statusText: String,
                  isPausedState: Boolean = false,
                  pauseReason: PauseReason = PauseReason.NONE
              ) {
                  val notification = buildNotification(title, percent, speed, sizeInfo, eta, statusText, isPausedState, pauseReason)
                  notificationManager?.notify(NOTIFICATION_ID, notification)
              }

              private fun showCompletionNotification(fileName: String, resInfo: String) {
                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val openAppPendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openAppIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )

                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Download Complete!")
                      .setContentText("$fileName$resInfo")
                      .setSmallIcon(R.drawable.ic_launcher_emblem)
                      .setContentIntent(openAppPendingIntent)
                      .setAutoCancel(true)
                      .setOngoing(false)
                      .build()

                  notificationManager?.notify(NOTIFICATION_ID + 1, notification)
              }

              private fun showFailureNotification(title: String, reason: String) {
                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val openAppPendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openAppIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )

                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Download Failed")
                      .setContentText("$title: $reason")
                      .setSmallIcon(R.drawable.ic_launcher_emblem)
                      .setContentIntent(openAppPendingIntent)
                      .setAutoCancel(true)
                      .setOngoing(false)
                      .build()

                  notificationManager?.notify(NOTIFICATION_ID + 2, notification)
              }

              private fun parseByteUnits(str: String): Long {
                  val clean = str.trim()
                  val matcher = Pattern.compile("([0-9.]+)\\s*([a-zA-Z]+)").matcher(clean)
                  if (!matcher.find()) return 0L
                  val num = matcher.group(1)?.toDoubleOrNull() ?: return 0L
                  val unit = matcher.group(2)?.lowercase(Locale.US) ?: ""
                  val mult = when (unit) {
                      "b" -> 1.0
                      "kib" -> 1024.0
                      "kb" -> 1000.0
                      "mib" -> 1024.0 * 1024.0
                      "mb" -> 1000.0 * 1000.0
                      "gib" -> 1024.0 * 1024.0 * 1024.0
                      "gb" -> 1000.0 * 1000.0 * 1000.0
                      else -> 1024.0 * 1024.0
                  }
                  return (num * mult).toLong()
              }

              private fun formatBytes(bytes: Long): String {
                  if (bytes < 1024) return "$bytes B"
                  val kb = bytes / 1024.0
                  if (kb < 1024) return String.format(Locale.US, "%.1f KB", kb)
                  val mb = kb / 1024.0
                  if (mb < 1024) return String.format(Locale.US, "%.1f MB", mb)
                  val gb = mb / 1024.0
                  return String.format(Locale.US, "%.2f GB", gb)
              }

              private fun extractUserFriendlyError(rawMessage: String?): String {
                  if (rawMessage.isNullOrBlank()) return "Download interrupted. Please check your network connection."
                  val lower = rawMessage.lowercase(Locale.US)
                  return when {
                      lower.contains("unknownhostexception") || lower.contains("timed out") ||
                      lower.contains("connection refused") || lower.contains("no route to host") ||
                      lower.contains("network is unreachable") || lower.contains("connection reset") ->
                          "Network error. Please check your internet connection."
                      lower.contains("video unavailable") || lower.contains("private video") ||
                      lower.contains("deleted video") || lower.contains("this video is unavailable") ->
                          "This video is unavailable or has been removed."
                      lower.contains("sign in to confirm") || lower.contains("bot") || lower.contains("confirm you're not a bot") ->
                          "YouTube bot verification requested for this video. Please try again later."
                      lower.contains("enospc") || lower.contains("no space left") ->
                          "Storage error: No free space left on device."
                      lower.contains("permission denied") ->
                          "Storage access denied. Please grant file permissions in Settings."
                      lower.contains("http error 403") || lower.contains("403: forbidden") ->
                          "Stream token expired or forbidden. Please retry to refresh stream."
                      lower.contains("requested format is not available") ->
                          "Requested format/quality is not available for this stream."
                      else ->
                          "Download failed. Please check your connection and tap Retry."
                  }
              }

              override fun onDestroy() {
                  unregisterNetworkMonitoring()
                  isDownloading = false
                  isPaused = false
                  currentPauseReason = PauseReason.NONE
                  activeTaskId = null
                  pausedTaskId = null
                  currentSpeed = "--"
                  currentSizeInfo = "--"
                  currentEta = "--"
                  super.onDestroy()
              }
          }
