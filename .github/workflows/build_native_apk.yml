          fun View.applyPressScaleEffect(scaleFactor: Float = 0.97f) {
              this.setOnTouchListener { v, event ->
                  try {
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              v.animate()
                                  .scaleX(scaleFactor)
                                  .scaleY(scaleFactor)
                                  .setDuration(100L)
                                  .setInterpolator(DecelerateInterpolator())
                                  .start()
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              v.animate()
                                  .scaleX(1.0f)
                                  .scaleY(1.0f)
                                  .setDuration(120L)
                                  .setInterpolator(DecelerateInterpolator())
                                  .start()
                          }
                      }
                  } catch (e: Exception) {}
                  false
              }
          }
          
          
