          # 12. MainActivity.kt (State Machine for 5 Screens)
          cat << 'EOF' > app/src/main/java/com/soundrip/app/MainActivity.kt
          package com.soundrip.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.BitmapFactory
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.startapp.sdk.adsbase.Ad
          import com.startapp.sdk.adsbase.StartAppAd
          import com.startapp.sdk.adsbase.StartAppSDK
          import com.startapp.sdk.adsbase.adlisteners.AdDisplayListener
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener
          import com.startapp.sdk.ads.banner.Banner
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import com.yausername.ffmpeg.FFmpeg
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.regex.Pattern
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private var isAudio = true
              private val audioQualities = arrayOf("320 kbps (HQ Audio)", "256 kbps", "192 kbps (Standard)", "128 kbps (Fast)")
              private val videoQualities = arrayOf("Best Available", "1080p (Full HD)", "720p (HD)", "480p", "360p")
              private var currentVideoId: String? = null
              private var startAppAd: StartAppAd? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  try {
                      StartAppSDK.init(this, "208492019", false)
                      StartAppSDK.setTestAdsEnabled(true)
                      StartAppAd.disableSplash()

                      startAppAd = StartAppAd(this)
                      startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC, object : AdEventListener {
                          override fun onReceiveAd(ad: Ad) {}
                          override fun onFailedToReceiveAd(ad: Ad?) {}
                      })

                      val bannerContainer = findViewById<FrameLayout>(R.id.bannerContainer)
                      val banner = Banner(this)
                      bannerContainer.addView(banner)
                  } catch (_: Exception) {}

                  val splashOverlay = findViewById<View>(R.id.splashOverlay)
                  splashOverlay.postDelayed({
                      splashOverlay.animate()
                          .alpha(0f)
                          .setDuration(450)
                          .withEndAction {
                              splashOverlay.visibility = View.GONE
                              checkAndPromptStoragePermission()
                          }
                  }, 1400)

                  val viewHome = findViewById<View>(R.id.viewHome)
                  val viewPreview = findViewById<View>(R.id.viewPreview)
                  val viewDownloading = findViewById<View>(R.id.viewDownloading)
                  val viewComplete = findViewById<View>(R.id.viewComplete)

                  val urlInput = findViewById<EditText>(R.id.urlInput)
                  val btnClear = findViewById<TextView>(R.id.btnClear)
                  val btnActionDownload = findViewById<Button>(R.id.btnActionDownload)
                  val btnStartDownload = findViewById<Button>(R.id.btnStartDownload)

                  val previewThumbnail = findViewById<ImageView>(R.id.previewThumbnail)
                  val previewTitle = findViewById<TextView>(R.id.previewTitle)
                  val previewDetails = findViewById<TextView>(R.id.previewDetails)
                  val cardMp3 = findViewById<View>(R.id.cardMp3)
                  val cardMp4 = findViewById<View>(R.id.cardMp4)
                  val radioDotMp3 = findViewById<TextView>(R.id.radioDotMp3)
                  val radioDotMp4 = findViewById<TextView>(R.id.radioDotMp4)
                  val qualityLabel = findViewById<TextView>(R.id.qualityLabel)
                  val qualitySpinner = findViewById<Spinner>(R.id.qualitySpinner)

                  val downloadingThumb = findViewById<ImageView>(R.id.downloadingThumb)
                  val downloadingTitle = findViewById<TextView>(R.id.downloadingTitle)
                  val downloadingFormat = findViewById<TextView>(R.id.downloadingFormat)
                  val circularProgressBar = findViewById<ProgressBar>(R.id.circularProgressBar)
                  val txtCircularPercent = findViewById<TextView>(R.id.txtCircularPercent)
                  val linearProgressBar = findViewById<ProgressBar>(R.id.linearProgressBar)
                  val txtDownloadStats = findViewById<TextView>(R.id.txtDownloadStats)
                  val btnCancel = findViewById<Button>(R.id.btnCancel)

                  val completedFileName = findViewById<TextView>(R.id.completedFileName)
                  val btnDownloadAgain = findViewById<Button>(R.id.btnDownloadAgain)
                  val btnGoBack = findViewById<TextView>(R.id.btnGoBack)
                  val btnShareApp = findViewById<TextView>(R.id.btnShareApp)

                  fun showState(state: Int) {
                      viewHome.visibility = if (state == 0) View.VISIBLE else View.GONE
                      viewPreview.visibility = if (state == 1) View.VISIBLE else View.GONE
                      viewDownloading.visibility = if (state == 2) View.VISIBLE else View.GONE
                      viewComplete.visibility = if (state == 3) View.VISIBLE else View.GONE
                  }

                  fun updateSpinner() {
                      val options = if (isAudio) audioQualities else videoQualities
                      qualityLabel.text = if (isAudio) "Bitrate:" else "Resolution:"
                      val adapter = ArrayAdapter(this, R.layout.item_spinner_selected, options)
                      adapter.setDropDownViewResource(R.layout.item_spinner_dropdown)
                      qualitySpinner.adapter = adapter
                  }
                  updateSpinner()

                  fun selectMp3() {
                      isAudio = true
                      cardMp3.setBackgroundResource(R.drawable.bg_card_selected)
                      cardMp4.setBackgroundResource(R.drawable.bg_card_unselected)
                      radioDotMp3.text = "●"
                      radioDotMp3.setTextColor(android.graphics.Color.parseColor("#4F46E5"))
                      radioDotMp4.text = "○"
                      radioDotMp4.setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                      updateSpinner()
                  }

                  fun selectMp4() {
                      isAudio = false
                      cardMp4.setBackgroundResource(R.drawable.bg_card_selected)
                      cardMp3.setBackgroundResource(R.drawable.bg_card_unselected)
                      radioDotMp4.text = "●"
                      radioDotMp4.setTextColor(android.graphics.Color.parseColor("#4F46E5"))
                      radioDotMp3.text = "○"
                      radioDotMp3.setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                      updateSpinner()
                  }

                  cardMp3.setOnClickListener { selectMp3() }
                  cardMp4.setOnClickListener { selectMp4() }

                  fun fetchThumbnailAndTitle(url: String) {
                      val regex = "(?:v=|youtu\\.be/|shorts/|embed/)([a-zA-Z0-9_-]{11})"
                      val matcher = Pattern.compile(regex).matcher(url)
                      if (matcher.find()) {
                          val videoId = matcher.group(1) ?: return
                          if (videoId == currentVideoId) return
                          currentVideoId = videoId

                          btnClear.visibility = View.VISIBLE
                          showState(1)
                          previewTitle.text = "Loading media info..."
                          previewDetails.text = "Fetching details..."

                          thread {
                              try {
                                  val thumbUrl = "https://img.youtube.com/vi/$videoId/hqdefault.jpg"
                                  val conn = URL(thumbUrl).openConnection() as HttpURLConnection
                                  conn.doInput = true
                                  conn.connect()
                                  val bitmap = BitmapFactory.decodeStream(conn.inputStream)
                                  runOnUiThread {
                                      previewThumbnail.setImageBitmap(bitmap)
                                      downloadingThumb.setImageBitmap(bitmap)
                                  }
                              } catch (_: Exception) {}
                          }

                          thread {
                              try {
                                  val oembedUrl = "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$videoId&format=json"
                                  val conn = URL(oembedUrl).openConnection() as HttpURLConnection
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                                  val reader = BufferedReader(InputStreamReader(conn.inputStream))
                                  val resp = reader.readText()
                                  reader.close()

                                  val json = JSONObject(resp)
                                  val title = json.optString("title", "YouTube Media")
                                  val author = json.optString("author_name", "YouTube Creator")

                                  runOnUiThread {
                                      previewTitle.text = title
                                      previewDetails.text = "$author • YouTube Stream"
                                      downloadingTitle.text = title
                                  }
                              } catch (_: Exception) {
                                  runOnUiThread {
                                      previewTitle.text = "YouTube Media"
                                      previewDetails.text = "Ready to download"
                                  }
                              }
                          }
                      }
                  }

                  urlInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {
                          val text = s?.toString()?.trim() ?: ""
                          if (text.isNotEmpty()) {
                              btnClear.visibility = View.VISIBLE
                              if (text.contains("youtu")) fetchThumbnailAndTitle(text)
                          } else {
                              btnClear.visibility = View.GONE
                              showState(0)
                          }
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })

                  btnClear.setOnClickListener {
                      urlInput.setText("")
                      currentVideoId = null
                      showState(0)
                  }

                  btnActionDownload.setOnClickListener {
                      val text = urlInput.text.toString().trim()
                      if (text.isEmpty()) {
                          val clipboard = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          val item = clipboard.primaryClip?.getItemAt(0)
                          item?.text?.let {
                              urlInput.setText(it)
                              fetchThumbnailAndTitle(it.toString())
                          } ?: Toast.makeText(this, "Paste a YouTube link first", Toast.LENGTH_SHORT).show()
                      } else {
                          fetchThumbnailAndTitle(text)
                      }
                  }

                  fun executeDownload() {
                      val url = urlInput.text.toString().trim()
                      val selectedQuality = qualitySpinner.selectedItem.toString()

                      showState(2)
                      downloadingFormat.text = if (isAudio) "MP3 • $selectedQuality" else "MP4 • $selectedQuality"
                      circularProgressBar.progress = 5
                      txtCircularPercent.text = "5%"
                      linearProgressBar.progress = 5
                      txtDownloadStats.text = "Connecting to high-speed stream..."

                      thread {
                          try {
                              val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              val targetDir = File(publicDownloads, "FlowRip")
                              if (!targetDir.exists()) targetDir.mkdirs()

                              val request = YoutubeDLRequest(url)
                              request.addOption("--extractor-args", "youtube:player_client=android,web")
                              request.addOption("--no-check-certificates")
                              request.addOption("--no-update")

                              if (isAudio) {
                                  val bitrate = selectedQuality.split(" ")[0]
                                  request.addOption("-x")
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", bitrate)
                              } else {
                                  when {
                                      selectedQuality.contains("1080p") -> request.addOption("-f", "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]")
                                      selectedQuality.contains("720p") -> request.addOption("-f", "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]")
                                      selectedQuality.contains("480p") -> request.addOption("-f", "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]")
                                      selectedQuality.contains("360p") -> request.addOption("-f", "bestvideo[height<=360][ext=mp4]+bestaudio[ext=m4a]/best[height<=360]")
                                      else -> request.addOption("-f", "best[ext=mp4]/best")
                                  }
                              }
                              request.addOption("-o", "${targetDir.absolutePath}/%(title)s.%(ext)s")

                              YoutubeDL.getInstance().execute(request) { progress, _, _ ->
                                  runOnUiThread {
                                      val p = progress.toInt().coerceIn(1, 100)
                                      circularProgressBar.progress = p
                                      txtCircularPercent.text = "$p%"
                                      linearProgressBar.progress = p
                                      txtDownloadStats.text = "Downloading stream... $p%"
                                  }
                              }

                              val downloadedFiles = targetDir.listFiles()
                              val latestFile = downloadedFiles?.maxByOrNull { it.lastModified() }
                              latestFile?.let { file ->
                                  MediaScannerConnection.scanFile(
                                      applicationContext,
                                      arrayOf(file.absolutePath),
                                      arrayOf(if (isAudio) "audio/mpeg" else "video/mp4"),
                                      null
                                  )
                              }

                              runOnUiThread {
                                  completedFileName.text = latestFile?.name ?: "Media File"
                                  showState(3)
                                  Toast.makeText(this@MainActivity, "Download Complete!", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  Toast.makeText(this@MainActivity, "Download Error: ${e.message}", Toast.LENGTH_LONG).show()
                                  showState(1)
                              }
                          }
                      }
                  }

                  btnStartDownload.setOnClickListener {
                      val url = urlInput.text.toString().trim()
                      if (url.isEmpty()) return@setOnClickListener

                      var adShown = false
                      try {
                          adShown = startAppAd?.showAd(object : AdDisplayListener {
                              override fun adHidden(ad: Ad?) {
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                              override fun adDisplayed(ad: Ad?) {}
                              override fun adClicked(ad: Ad?) {}
                              override fun adNotDisplayed(ad: Ad?) {
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                          }) ?: false
                      } catch (_: Exception) {}

                      if (!adShown) {
                          executeDownload()
                          startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                      }
                  }

                  btnCancel.setOnClickListener { showState(1) }
                  btnDownloadAgain.setOnClickListener { urlInput.setText(""); currentVideoId = null; showState(0) }
                  btnGoBack.setOnClickListener { urlInput.setText(""); currentVideoId = null; showState(0) }

                  btnShareApp.setOnClickListener {
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_SUBJECT, "Check out FlowRip!")
                          putExtra(Intent.EXTRA_TEXT, "Download any YouTube song or video easily with FlowRip! Get it here: https://github.com/${packageName}/releases")
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share FlowRip via"))
                  }

                  thread {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          try {
                              YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)
                          } catch (_: Exception) {}
                      } catch (_: Exception) {}
                  }
              }

              private fun checkAndPromptStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this)
                              .setTitle("⚡ Storage Permission")
                              .setMessage("FlowRip needs storage access to save your downloaded MP3s and MP4s directly into your phone's Downloads folder.")
                              .setPositiveButton("Grant Access") { _, _ ->
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                          data = Uri.parse("package:$packageName")
                                      }
                                      startActivity(intent)
                                  } catch (e: Exception) {
                                      val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                      startActivity(intent)
                                  }
                              }
                              .setNegativeButton("Later", null)
                              .show()
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE),
                              101
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Native APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowRip-FullProUI-APK
          path: app/build/outputs/apk/**/*.apk
