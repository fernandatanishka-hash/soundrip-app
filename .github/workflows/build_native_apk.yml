                      iconTabHistory.setColorFilter(android.graphics.Color.parseColor(if (index == 1) "#4F46E5" else "#64748B"))
                      iconTabSettings.setColorFilter(android.graphics.Color.parseColor(if (index == 2) "#4F46E5" else "#64748B"))

                      if (index == 1) refreshHistory()
