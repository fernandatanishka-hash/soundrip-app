                          setPadding(dpToPx(24), dpToPx(60), dpToPx(24), dpToPx(40))
                      }
                      val icon = TextView(this).apply {
                          text = "🔍"
                          textSize = 34f
                          gravity = android.view.Gravity.CENTER
                      }
                      val title = TextView(this).apply {
                          text = "No matching downloads"
                          textSize = 16f
                          setTypeface(null, android.graphics.Typeface.BOLD)
                          setTextColor(if (isDarkMode) android.graphics.Color.WHITE else android.graphics.Color.parseColor("#0F172A"))
                          gravity = android.view.Gravity.CENTER
                          val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          lp.topMargin = dpToPx(12)
                          layoutParams = lp
                      }
                      val subtitle = TextView(this).apply {
                          text = "No files match your current search or filter.\nTry clearing the search or selecting 'All Files'."
                          textSize = 13f
                          setTextColor(if (isDarkMode) android.graphics.Color.parseColor("#64748B") else android.graphics.Color.parseColor("#475569"))
                          gravity = android.view.Gravity.CENTER
                          val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          lp.topMargin = dpToPx(6)
