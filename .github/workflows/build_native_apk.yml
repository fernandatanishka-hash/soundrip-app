                                      android:textSize="12sp"
                                      android:textStyle="bold"
                                      android:layout_marginTop="16dp" />

                                  <LinearLayout
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:layout_marginTop="8dp">

                                      <!-- MP3 Card -->
                                      <LinearLayout
                                          android:id="@+id/cardMp3"
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1"
                                          android:background="@drawable/bg_card_selected"
                                          android:orientation="vertical"
                                          android:padding="12dp">

                                          <LinearLayout
                                              android:layout_width="match_parent"
                                              android:layout_height="wrap_content"
                                              android:orientation="horizontal"
                                              android:gravity="center_vertical">

                                              <TextView
                                                  android:id="@+id/radioDotMp3"
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="●"
                                                  android:textColor="#4F46E5"
                                                  android:textSize="14sp" />

                                              <TextView
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="  MP3 Audio"
                                                  android:textColor="#0F172A"
                                                  android:textSize="13sp"
                                                  android:textStyle="bold" />
                                          </LinearLayout>

                                          <TextView
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="Music &amp; Podcasts"
                                              android:textColor="#64748B"
                                              android:textSize="11sp"
                                              android:layout_marginTop="4dp" />
                                      </LinearLayout>

                                      <View
                                          android:layout_width="12dp"
                                          android:layout_height="1dp" />

                                      <!-- MP4 Card -->
                                      <LinearLayout
                                          android:id="@+id/cardMp4"
                                          android:layout_width="0dp"
                                          android:layout_height="wrap_content"
                                          android:layout_weight="1"
                                          android:background="@drawable/bg_card_unselected"
                                          android:orientation="vertical"
                                          android:padding="12dp">

                                          <LinearLayout
                                              android:layout_width="match_parent"
                                              android:layout_height="wrap_content"
                                              android:orientation="horizontal"
                                              android:gravity="center_vertical">

                                              <TextView
                                                  android:id="@+id/radioDotMp4"
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="○"
                                                  android:textColor="#94A3B8"
                                                  android:textSize="14sp" />

                                              <TextView
                                                  android:layout_width="wrap_content"
                                                  android:layout_height="wrap_content"
                                                  android:text="  MP4 Video"
                                                  android:textColor="#0F172A"
                                                  android:textSize="13sp"
                                                  android:textStyle="bold" />
                                          </LinearLayout>

                                          <TextView
                                              android:layout_width="wrap_content"
                                              android:layout_height="wrap_content"
                                              android:text="Up to 1080p Full HD"
