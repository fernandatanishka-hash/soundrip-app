                  fun showDownloaderState(state: Int) {
                      viewHomeHero.visibility = if (state == 0) View.VISIBLE else View.GONE
                      viewHomeFeatures.visibility = if (state == 0) View.VISIBLE else View.GONE
                      btnMainAction.visibility = if (state == 0) View.VISIBLE else View.GONE
                      viewPreviewCard.visibility = if (state == 1) View.VISIBLE else View.GONE
                      viewDownloadingCard.visibility = if (state == 2) View.VISIBLE else View.GONE
                      viewCompleteSection.visibility = if (state == 3) View.VISIBLE else View.GONE
                  }

                  fun updateSpinner() {
                      val options = if (isAudio) audioQualities else videoQualities
                      qualityLabel.text = if (isAudio) "Bitrate:" else "Resolution:"
                      val adapter = ArrayAdapter(this, R.layout.item_spinner_selected, options)
                      adapter.setDropDownViewResource(R.layout.item_spinner_dropdown)
                      qualitySpinner.adapter = adapter
                  }
                  updateSpinner()

                  cardMp3.setOnClickListener {
                      isAudio = true
                      cardMp3.setBackgroundResource(R.drawable.bg_card_selected)
                      cardMp4.setBackgroundResource(R.drawable.bg_card_unselected)
                      radioDotMp3.text = "●"
                      radioDotMp3.setTextColor(android.graphics.Color.parseColor("#4F46E5"))
                      radioDotMp4.text = "○"
                      radioDotMp4.setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                      updateSpinner()
                  }

                  cardMp4.setOnClickListener {
                      isAudio = false
                      cardMp4.setBackgroundResource(R.drawable.bg_card_selected)
                      cardMp3.setBackgroundResource(R.drawable.bg_card_unselected)
                      radioDotMp4.text = "●"
                      radioDotMp4.setTextColor(android.graphics.Color.parseColor("#4F46E5"))
                      radioDotMp3.text = "○"
                      radioDotMp3.setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                      updateSpinner()
                  }

                  fun extractYouTubeId(rawUrl: String): String? {
                      val trimmed = rawUrl.trim()
                      val patterns = arrayOf(
                          "(?:v=|v%3D|/v/|youtu\\.be/|/embed/|/shorts/|/live/|/e/|watch\\?feature=[^&]*&v=)([a-zA-Z0-9_-]{11})",
                          "(?:[\\?&]v=)([a-zA-Z0-9_-]{11})",
                          "([a-zA-Z0-9_-]{11})"
                      )
                      for (p in patterns) {
                          val matcher = Pattern.compile(p, Pattern.CASE_INSENSITIVE).matcher(trimmed)
                          if (matcher.find()) {
                              return matcher.group(1)
                          }
                      }
                      return null
                  }

                  fun fetchThumbnailAndTitle(input: String) {
                      val videoId = extractYouTubeId(input)
                      if (videoId == null) {
                          return
                      }

                      btnClear.visibility = View.VISIBLE
                      showDownloaderState(1)

                      if (videoId == currentVideoId) {
                          return
                      }
                      currentVideoId = videoId

                      previewTitle.text = "Loading media..."
                      previewDetails.text = "Fetching details from YouTube..."

                      thread {
                          try {
                              val thumbUrl = "https://img.youtube.com/vi/$videoId/hqdefault.jpg"
                              val conn = URL(thumbUrl).openConnection() as HttpURLConnection
                              conn.doInput = true
                              conn.connect()
                              val bitmap = BitmapFactory.decodeStream(conn.inputStream)
                              if (bitmap != null) {
                                  runOnUiThread {
                                      previewThumbnail.setImageBitmap(bitmap)
                                      downloadingThumb.setImageBitmap(bitmap)
                                  }
                              }
                          } catch (e: Exception) {}
                      }

                      thread {
                          try {
                              val oembedUrl = "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$videoId&format=json"
                              val conn = URL(oembedUrl).openConnection() as HttpURLConnection
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val resp = reader.readText()
                              reader.close()

                              val json = JSONObject(resp)
                              val title = json.optString("title", "YouTube Video")
                              val author = json.optString("author_name", "YouTube Creator")

                              runOnUiThread {
                                  previewTitle.text = title
                                  previewDetails.text = "$author • YouTube Stream"
                                  downloadingTitle.text = title
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  previewTitle.text = "YouTube Video ($videoId)"
                                  previewDetails.text = "Ready to download in True HD"
                                  downloadingTitle.text = "YouTube Video ($videoId)"
                              }
                          }
                      }
                  }

                  urlInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {
                          val text = s?.toString()?.trim() ?: ""
                          if (text.isNotEmpty()) {
                              btnMainAction.text = "📥 DOWNLOAD"
                              btnClear.visibility = View.VISIBLE
                              val detectedId = extractYouTubeId(text)
                              if (detectedId != null) {
                                  fetchThumbnailAndTitle(text)
                              }
                          } else {
                              btnMainAction.text = "📋 PASTE LINK"
                              btnClear.visibility = View.GONE
                              currentVideoId = null
                              showDownloaderState(0)
                          }
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })

                  btnClear.setOnClickListener {
                      urlInput.setText("")
                      currentVideoId = null
                      showDownloaderState(0)
                  }

                  btnMainAction.setOnClickListener {
                      val currentText = urlInput.text.toString().trim()
                      if (currentText.isEmpty()) {
                          val clipboard = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          val clip = clipboard.primaryClip?.getItemAt(0)?.text?.toString()?.trim()
                          if (!clip.isNullOrEmpty()) {
                              urlInput.setText(clip)
                              val detectedId = extractYouTubeId(clip)
                              if (detectedId != null) {
                                  fetchThumbnailAndTitle(clip)
                              } else {
                                  Toast.makeText(this, "Link in clipboard is not a recognized YouTube URL", Toast.LENGTH_SHORT).show()
                              }
                          } else {
                              Toast.makeText(this, "Clipboard is empty. Copy a YouTube link first!", Toast.LENGTH_SHORT).show()
                          }
                      } else {
                          val detectedId = extractYouTubeId(currentText)
                          if (detectedId != null) {
                              fetchThumbnailAndTitle(currentText)
                          } else {
                              Toast.makeText(this, "Please paste a valid YouTube video link", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  // 1080p, 720p, 480p High-Definition Video Extraction (Shorts + Normal Videos)
                  fun executeDownload() {
                      val rawInput = urlInput.text.toString().trim()
                      val cleanId = currentVideoId ?: extractYouTubeId(rawInput)
                      val url = if (cleanId != null) "https://www.youtube.com/watch?v=$cleanId" else rawInput
                      val selectedQuality = qualitySpinner.selectedItem.toString()

                      showDownloaderState(2)
                      downloadingFormat.text = if (isAudio) "MP3 • $selectedQuality" else "MP4 • $selectedQuality"
                      circularProgressBar.progress = 0
                      txtCircularPercent.text = "0%"
                      linearProgressBar.progress = 0
                      txtDownloadStats.text = "Connecting to high-speed stream..."

                      thread {
                          try {
                              try {
                                  YoutubeDL.getInstance().init(applicationContext)
                                  FFmpeg.getInstance().init(applicationContext)
                              } catch (e: Exception) {}

                              val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              val targetDir = File(publicDownloads, "FlowRip")
                              if (!targetDir.exists()) targetDir.mkdirs()

                              val request = YoutubeDLRequest(url)
                              request.addOption("--no-check-certificates")
                              request.addOption("--no-update")

                              if (isAudio) {
                                  val bitrate = selectedQuality.split(" ")[0]
                                  request.addOption("-x")
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", bitrate)
                              } else {
                                  // TRUE HD FIX FOR SHORTS (1080x1920) AND REGULAR VIDEOS (1920x1080)
                                  // Uses native MP4 video + M4A (AAC) audio for lossless FFmpeg merge
                                  when {
                                      selectedQuality.contains("1080p") || selectedQuality.contains("Best") -> {
                                          request.addOption("-f", "bv*[height<=1920][width<=1920][ext=mp4]+ba[ext=m4a]/bv*[height<=1920][width<=1920]+ba/bv*[ext=mp4]+ba[ext=m4a]/bv*+ba/b")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      selectedQuality.contains("720p") -> {
                                          request.addOption("-f", "bv*[height<=1280][width<=1280][ext=mp4]+ba[ext=m4a]/bv*[height<=1280][width<=1280]+ba/bv*+ba/b")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      selectedQuality.contains("480p") -> {
                                          request.addOption("-f", "bv*[height<=854][width<=854][ext=mp4]+ba[ext=m4a]/bv*[height<=854][width<=854]+ba/bv*+ba/b")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      selectedQuality.contains("360p") -> {
                                          request.addOption("-f", "bv*[height<=640][width<=640][ext=mp4]+ba[ext=m4a]/bv*[height<=640][width<=640]+ba/bv*+ba/b")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      else -> {
                                          request.addOption("-f", "bv*[ext=mp4]+ba[ext=m4a]/bv*+ba/b")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                  }
                              }
                              request.addOption("-o", "${targetDir.absolutePath}/%(title)s.%(ext)s")

                              YoutubeDL.getInstance().execute(request) { progress, _, _ ->
                                  runOnUiThread {
                                      val p = progress.toInt().coerceIn(1, 100)
                                      circularProgressBar.progress = p
                                      txtCircularPercent.text = "$p%"
                                      linearProgressBar.progress = p
                                      txtDownloadStats.text = "Downloading stream... $p%"
                                  }
                              }

                              val downloadedFiles = targetDir.listFiles()
                              val latestFile = downloadedFiles?.maxByOrNull { it.lastModified() }
                              lastDownloadedFile = latestFile

                              latestFile?.let { file ->
                                  MediaScannerConnection.scanFile(
                                      applicationContext,
                                      arrayOf(file.absolutePath),
                                      arrayOf(if (isAudio) "audio/mpeg" else "video/mp4"),
                                      null
                                  )
                              }

                              var resInfo = ""
                              if (!isAudio && latestFile != null) {
                                  try {
                                      val retriever = android.media.MediaMetadataRetriever()
                                      retriever.setDataSource(latestFile.absolutePath)
                                      val width = retriever.extractMetadata(android.media.MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)
                                      val height = retriever.extractMetadata(android.media.MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)
                                      if (!width.isNullOrEmpty() && !height.isNullOrEmpty()) {
                                          resInfo = " • ${width}x${height} HD"
                                      }
                                      retriever.release()
                                  } catch (e: Exception) {}
                              }

                              runOnUiThread {
                                  completedFileName.text = (latestFile?.name ?: "Media File") + resInfo
                                  showDownloaderState(3)
                                  Toast.makeText(this@MainActivity, "Download Complete!", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  Toast.makeText(this@MainActivity, "Download Error: ${e.message}", Toast.LENGTH_LONG).show()
                                  showDownloaderState(1)
                              }
                          }
                      }
                  }

                  btnStartDownload.setOnClickListener {
                      val rawInput = urlInput.text.toString().trim()
                      val cleanId = currentVideoId ?: extractYouTubeId(rawInput)
                      val url = if (cleanId != null) "https://www.youtube.com/watch?v=$cleanId" else rawInput
                      if (url.isEmpty()) return@setOnClickListener

                      var adShown = false
                      try {
                          adShown = startAppAd?.showAd(object : AdDisplayListener {
                              override fun adHidden(ad: Ad?) {
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                              override fun adDisplayed(ad: Ad?) {}
                              override fun adClicked(ad: Ad?) {}
                              override fun adNotDisplayed(ad: Ad?) {
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                          }) ?: false
                      } catch (e: Exception) {}

                      if (!adShown) {
                          executeDownload()
                          startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                      }
                  }

                  btnPlayFile.setOnClickListener {
                      lastDownloadedFile?.let { playFile(it) } ?: Toast.makeText(this, "No file to play", Toast.LENGTH_SHORT).show()
                  }

                  btnSaveFile.setOnClickListener {
                      lastDownloadedFile?.let { shareFile(it) } ?: Toast.makeText(this, "File is saved in /Downloads/FlowRip", Toast.LENGTH_LONG).show()
                  }

                  btnCancel.setOnClickListener { showDownloaderState(1) }
                  btnDownloadAnother.setOnClickListener { urlInput.setText(""); currentVideoId = null; showDownloaderState(0) }
                  btnMenu.setOnClickListener { switchTab(2) }

                  findViewById<View>(R.id.settingRowQuality).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Preferred Download Quality")
                          .setItems(arrayOf("Best Available", "320 kbps (HQ) / 1080p", "192 kbps / 720p", "128 kbps / 480p")) { _, which ->
                              findViewById<TextView>(R.id.txtDefaultQuality).text = arrayOf("Best Available", "320 kbps (HQ) / 1080p", "192 kbps / 720p", "128 kbps / 480p")[which]
                          }.show()
                  }

                  findViewById<View>(R.id.settingRowFormat).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Default Format")
                          .setItems(arrayOf("MP3 (Audio Only)", "MP4 (Video)")) { _, which ->
                              findViewById<TextView>(R.id.txtDefaultFormat).text = if (which == 0) "MP3 (Audio)" else "MP4 (Video)"
                          }.show()
                  }

                  findViewById<View>(R.id.settingRowAbout).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("About FlowRip Studio")
                          .setMessage("FlowRip Studio v1.0.0\nHigh-Performance Native YouTube Downloader.\nPowered by yt-dlp & FFmpeg.")
                          .setPositiveButton("OK", null)
                          .show()
                  }

                  thread {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          try {
                              YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)
                          } catch (e: Exception) {}
                      } catch (e: Exception) {}
                  }
              }

              private fun playFile(file: File) {
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.provider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, if (file.name.endsWith(".mp3")) "audio/*" else "video/*")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(intent, "Play media with"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "File located at: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun shareFile(file: File) {
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.provider", file)
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = if (file.name.endsWith(".mp3")) "audio/*" else "video/*"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share media via"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "File located at: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun checkAndPromptStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this)
                              .setTitle("⚡ Storage Permission")
                              .setMessage("FlowRip needs storage access to save your downloaded MP3s and MP4s directly into your phone's Downloads folder.")
                              .setPositiveButton("Grant Access") { _, _ ->
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                          data = Uri.parse("package:$packageName")
                                      }
                                      startActivity(intent)
                                  } catch (e: Exception) {
                                      val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                      startActivity(intent)
                                  }
                              }
                              .setNegativeButton("Later", null)
                              .show()
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE),
                              101
                          )
                      }
                  }
              }
          }
