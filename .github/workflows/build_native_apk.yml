          cat << 'EOF' > app/src/main/java/com/soundrip/app/StorageHelper.kt
          package com.soundrip.app

          import android.content.Context
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Environment
          import android.os.StatFs
          import android.provider.DocumentsContract
          import android.util.Log
          import androidx.documentfile.provider.DocumentFile
          import java.io.File
          import java.io.FileInputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object StorageHelper {
              private const val TAG = "StorageHelper"
              const val PREFS_NAME = "flowrip_prefs"
              const val KEY_DOWNLOAD_TREE_URI = "download_tree_uri"
              const val KEY_HISTORY_SORT_ORDER = "history_sort_order"

              enum class HistorySortOrder(val id: String, val label: String) {
                  NEWEST("NEWEST", "Newest first"),
                  OLDEST("OLDEST", "Oldest first"),
                  SIZE_DESC("SIZE_DESC", "Largest file"),
                  SIZE_ASC("SIZE_ASC", "Smallest file"),
                  NAME_ASC("NAME_ASC", "Name A–Z"),
                  NAME_DESC("NAME_DESC", "Name Z–A");

                  companion object {
                      fun fromId(id: String?): HistorySortOrder {
                          return values().find { it.id == id } ?: NEWEST
                      }
                  }
              }

              data class HistoryItem(
                  val id: String,
                  val name: String,
                  val isAudio: Boolean,
                  val sizeBytes: Long,
                  val lastModified: Long,
                  val file: File? = null,
                  val uri: Uri? = null,
                  var resolution: String? = null,
                  var durationMs: Long = 0L,
                  var locationName: String = "FlowRip"
              ) {
                  val formattedSize: String
                      get() = formatFileSize(sizeBytes)

                  val formattedDuration: String
                      get() = formatDuration(durationMs)

                  val formattedDate: String
                      get() = SimpleDateFormat("MMM dd, yyyy • HH:mm", Locale.getDefault()).format(Date(lastModified))
              }

              fun getHistorySortOrder(context: Context): HistorySortOrder {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val id = prefs.getString(KEY_HISTORY_SORT_ORDER, HistorySortOrder.NEWEST.id)
                  return HistorySortOrder.fromId(id)
              }

              fun setHistorySortOrder(context: Context, order: HistorySortOrder) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putString(KEY_HISTORY_SORT_ORDER, order.id).apply()
              }

              fun formatFileSize(bytes: Long): String {
                  if (bytes <= 0L) return "0 B"
                  val kb = bytes / 1024.0
                  if (kb < 1024.0) return String.format(Locale.US, "%.1f KB", kb)
                  val mb = kb / 1024.0
                  if (mb < 1024.0) return String.format(Locale.US, "%.1f MB", mb)
                  val gb = mb / 1024.0
                  return String.format(Locale.US, "%.2f GB", gb)
              }

              fun formatDuration(durationMs: Long): String {
                  if (durationMs <= 0L) return "—"
                  val totalSecs = durationMs / 1000
                  val secs = totalSecs % 60
                  val mins = (totalSecs / 60) % 60
                  val hours = totalSecs / 3600
                  return if (hours > 0) {
                      String.format(Locale.US, "%d:%02d:%02d", hours, mins, secs)
                  } else {
                      String.format(Locale.US, "%02d:%02d", mins, secs)
                  }
              }

              fun populateMetadata(context: Context, item: HistoryItem) {
                  val retriever = MediaMetadataRetriever()
                  try {
                      var dataSourceSet = false
                      if (item.file != null && item.file.exists()) {
                          try {
                              FileInputStream(item.file).use { fis ->
                                  retriever.setDataSource(fis.fd)
                                  dataSourceSet = true
                              }
                          } catch (e: Exception) {
                              Log.d(TAG, "FileInputStream fd failed in populateMetadata, trying path: ${e.message}")
                          }
                          if (!dataSourceSet) {
                              try {
                                  retriever.setDataSource(item.file.absolutePath)
                                  dataSourceSet = true
                              } catch (e: Exception) {
                                  Log.w(TAG, "setDataSource(path) failed in populateMetadata: ${e.message}")
                              }
                          }
                      } else if (item.uri != null) {
                          try {
                              context.contentResolver.openFileDescriptor(item.uri, "r")?.use { pfd ->
                                  retriever.setDataSource(pfd.fileDescriptor)
                                  dataSourceSet = true
                              }
                          } catch (e: Exception) {
                              Log.d(TAG, "openFileDescriptor failed in populateMetadata: ${e.message}")
                          }
                          if (!dataSourceSet) {
                              try {
                                  retriever.setDataSource(context, item.uri)
                                  dataSourceSet = true
                              } catch (e: Exception) {
                                  Log.w(TAG, "setDataSource(uri) failed in populateMetadata: ${e.message}")
                              }
                          }
                      }

                      if (!dataSourceSet) return

                      val durStr = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)
                      if (!durStr.isNullOrEmpty()) {
                          item.durationMs = durStr.toLongOrNull() ?: 0L
                      }

                      if (!item.isAudio) {
                          val width = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)
                          val height = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)
                          if (!height.isNullOrEmpty()) {
                              val h = height.toIntOrNull() ?: 0
                              item.resolution = when {
                                  h >= 2160 -> "2160p 4K"
                                  h >= 1440 -> "1440p 2K"
                                  h >= 1080 -> "1080p FHD"
                                  h >= 720 -> "720p HD"
                                  h >= 480 -> "480p"
                                  h >= 360 -> "360p"
                                  h > 0 -> "${h}p"
                                  else -> if (!width.isNullOrEmpty()) "${width}x${height}" else null
                              }
                          }
                      }
                  } catch (e: Exception) {
                      Log.d(TAG, "Metadata extraction skipped for ${item.name}: ${e.message}")
                  } finally {
                      try {
                          retriever.release()
                      } catch (e: Exception) {}
                  }
              }

              fun isCustomTreeDefaultDir(context: Context): Boolean {
                  val treeUri = getCustomTreeUri(context) ?: return false
                  return try {
                      val docId = DocumentsContract.getTreeDocumentId(treeUri)
                      docId.equals("primary:Download/FlowRip", ignoreCase = true) ||
                      docId.equals("primary:Download/FlowRip/", ignoreCase = true)
                  } catch (e: Exception) {
                      false
                  }
              }

              fun getUniqueDestinationFile(targetDir: File, originalName: String): File {
                  if (!targetDir.exists()) targetDir.mkdirs()
                  var targetFile = File(targetDir, originalName)
                  if (!targetFile.exists()) return targetFile

                  val baseName = originalName.substringBeforeLast(".")
                  val extension = originalName.substringAfterLast(".", "")
                  var counter = 1

                  while (targetFile.exists()) {
                      val newName = if (extension.isNotEmpty()) "$baseName ($counter).$extension" else "$baseName ($counter)"
                      targetFile = File(targetDir, newName)
                      counter++
                  }
                  return targetFile
              }

              fun getCustomTreeUri(context: Context): Uri? {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val uriStr = prefs.getString(KEY_DOWNLOAD_TREE_URI, null) ?: return null
                  val uri = try {
                      Uri.parse(uriStr)
                  } catch (e: Exception) {
                      setCustomTreeUri(context, null)
                      return null
                  }

                  val hasPermission = try {
                      val permissions = context.contentResolver.persistedUriPermissions
                      permissions.any { it.uri == uri && it.isWritePermission }
                  } catch (e: Exception) {
                      false
                  }

                  if (!hasPermission) {
                      Log.w(TAG, "Custom tree URI permission was revoked or expired: $uri")
                      setCustomTreeUri(context, null)
                      return null
                  }

                  val docFile = try {
                      DocumentFile.fromTreeUri(context, uri)
                  } catch (e: Exception) {
                      null
                  }

                  if (docFile == null || !docFile.exists() || !docFile.canWrite()) {
                      Log.w(TAG, "Custom tree URI is not writable or no longer exists: $uri")
                      setCustomTreeUri(context, null)
                      return null
                  }

                  return uri
              }

              fun setCustomTreeUri(context: Context, uri: Uri?) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  if (uri == null) {
                      prefs.edit().remove(KEY_DOWNLOAD_TREE_URI).apply()
                  } else {
                      prefs.edit().putString(KEY_DOWNLOAD_TREE_URI, uri.toString()).apply()
                  }
              }

              fun getDefaultDownloadDir(): File {
                  val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                  val targetDir = File(publicDownloads, "FlowRip")
                  if (!targetDir.exists()) {
                      targetDir.mkdirs()
                  }
                  return targetDir
              }

              fun getStagingDir(context: Context): File {
                  val stagingDir = File(context.getExternalFilesDir("staging") ?: File(context.cacheDir, "staging"), "")
                  if (!stagingDir.exists()) {
                      stagingDir.mkdirs()
                  }
                  return stagingDir
              }

              fun getHumanReadableLocation(context: Context): String {
                  val treeUri = getCustomTreeUri(context)
                  if (treeUri == null) {
                      return "FlowRip\nInternal storage / Download / FlowRip"
                  }

                  try {
                      val docId = DocumentsContract.getTreeDocumentId(treeUri)
                      val parts = docId.split(":")
                      if (parts.size >= 2) {
                          val volume = parts[0]
                          val path = parts[1].replace("/", " / ")
                          val folderName = path.substringAfterLast(" / ").ifEmpty { volume }
                          val displayVolume = if (volume.equals("primary", ignoreCase = true)) "Internal storage" else "SD Card ($volume)"
                          return "$folderName\n$displayVolume / $path"
                      }
                  } catch (e: Exception) {
                      Log.w(TAG, "Could not decode docId from $treeUri: ${e.message}")
                  }

                  val doc = DocumentFile.fromTreeUri(context, treeUri)
                  val name = doc?.name ?: "Custom Folder"
                  return "$name\n$name (Storage Access Framework)"
              }

              fun getAvailableBytes(context: Context): Long {
                  return try {
                      val defaultDir = getDefaultDownloadDir()
                      val stat = StatFs(defaultDir.absolutePath)
                      stat.availableBytes
                  } catch (e: Exception) {
                      Log.w(TAG, "Error checking StatFs: ${e.message}")
                      try {
                          val stat = StatFs(context.filesDir.absolutePath)
                          stat.availableBytes
                      } catch (e2: Exception) {
                          Long.MAX_VALUE
                      }
                  }
              }

              fun checkStorageAvailability(context: Context, isAudio: Boolean): Boolean {
                  val minRequiredBytes = if (isAudio) 50L * 1024 * 1024 else 150L * 1024 * 1024
                  val availableBytes = getAvailableBytes(context)
                  return availableBytes >= minRequiredBytes
              }

              fun copyToDocumentTree(context: Context, sourceFile: File, treeUri: Uri): Uri? {
                  val treeDoc = DocumentFile.fromTreeUri(context, treeUri) ?: return null
                  if (!treeDoc.canWrite()) return null

                  val originalName = sourceFile.name
                  val isAudio = originalName.endsWith(".mp3", ignoreCase = true)
                  val mimeType = if (isAudio) "audio/mpeg" else "video/mp4"

                  var targetName = originalName
                  var counter = 1
                  val baseName = originalName.substringBeforeLast(".")
                  val extension = originalName.substringAfterLast(".", "")

                  while (treeDoc.findFile(targetName) != null) {
                      targetName = if (extension.isNotEmpty()) "$baseName ($counter).$extension" else "$baseName ($counter)"
                      counter++
                  }

                  val newDoc = treeDoc.createFile(mimeType, targetName) ?: return null

                  var copySuccess = false
                  try {
                      context.contentResolver.openOutputStream(newDoc.uri)?.use { out ->
                          sourceFile.inputStream().use { input ->
                              input.copyTo(out)
                          }
                      }
                      val targetLen = newDoc.length()
                      if (targetLen > 0 && targetLen == sourceFile.length()) {
                          copySuccess = true
                      } else if (sourceFile.length() == 0L && targetLen == 0L) {
                          copySuccess = true
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "Failed to stream file to SAF destination: ${e.message}", e)
                      copySuccess = false
                  }

                  if (copySuccess) {
                      sourceFile.delete()
                      return newDoc.uri
                  } else {
                      try {
                          newDoc.delete()
                      } catch (e: Exception) {}
                      return null
                  }
              }

              fun scanAllHistoryItems(context: Context): List<HistoryItem> {
                  val result = mutableListOf<HistoryItem>()
                  val seenIdentities = mutableSetOf<String>()

                  val isCustomFolderSameAsDefault = isCustomTreeDefaultDir(context)
                  val defaultFileNames = mutableSetOf<String>()

                  // 1. Scan default Downloads/FlowRip folder
                  val defaultDir = getDefaultDownloadDir()
                  defaultDir.listFiles()?.forEach { file ->
                      val name = file.name
                      if (!name.startsWith(".") && !name.endsWith(".part", ignoreCase = true) &&
                          !name.endsWith(".ytdl", ignoreCase = true) && !name.endsWith(".temp", ignoreCase = true)) {
                          val isMp3 = name.endsWith(".mp3", ignoreCase = true) || name.endsWith(".m4a", ignoreCase = true)
                          val isVideo = name.endsWith(".mp4", ignoreCase = true) || name.endsWith(".mkv", ignoreCase = true) || name.endsWith(".webm", ignoreCase = true)
                          if (isMp3 || isVideo) {
                              val canonical = try { file.canonicalPath } catch (e: Exception) { file.absolutePath }
                              Log.d(TAG, "HISTORY_SCAN_FILE: name='$name', path='$canonical', size=${file.length()}")
                              Log.d(TAG, "HISTORY_DUPLICATE_CHECK: id='$canonical'")
                              if (seenIdentities.add(canonical)) {
                                  defaultFileNames.add(name.lowercase())
                                  val item = HistoryItem(
                                      id = canonical,
                                      name = name,
                                      isAudio = isMp3,
                                      sizeBytes = file.length(),
                                      lastModified = file.lastModified(),
                                      file = file,
                                      uri = null,
                                      locationName = "Downloads/FlowRip"
                                  )
                                  populateMetadata(context, item)
                                  result.add(item)
                                  Log.d(TAG, "HISTORY_ITEM_ADDED: name='$name', id='$canonical', res='${item.resolution}', size=${item.sizeBytes}")
                              } else {
                                  Log.d(TAG, "HISTORY_DUPLICATE_REJECTED: id='$canonical', name='$name'")
                              }
                          }
                      }
                  }

                  // 2. Scan custom SAF folder if configured
                  val customUri = getCustomTreeUri(context)
                  if (customUri != null) {
                      try {
                          val treeDoc = DocumentFile.fromTreeUri(context, customUri)
                          val customFolderName = treeDoc?.name ?: "Custom Folder"
                          treeDoc?.listFiles()?.forEach { doc ->
                              val name = doc.name ?: ""
                              if (!name.startsWith(".") && !name.endsWith(".part", ignoreCase = true) &&
                                  !name.endsWith(".ytdl", ignoreCase = true) && !name.endsWith(".temp", ignoreCase = true)) {
                                  val isMp3 = name.endsWith(".mp3", ignoreCase = true) || name.endsWith(".m4a", ignoreCase = true)
                                  val isVideo = name.endsWith(".mp4", ignoreCase = true) || name.endsWith(".mkv", ignoreCase = true) || name.endsWith(".webm", ignoreCase = true)
                                  if (isMp3 || isVideo) {
                                      val uriStr = doc.uri.toString()
                                      val isSamePhysicalAsDefault = isCustomFolderSameAsDefault && defaultFileNames.contains(name.lowercase())
                                      Log.d(TAG, "HISTORY_SCAN_FILE: (SAF) name='$name', uri='$uriStr', size=${doc.length()}")
                                      Log.d(TAG, "HISTORY_DUPLICATE_CHECK: (SAF) uri='$uriStr', isSamePhysical=$isSamePhysicalAsDefault")
                                      if (!seenIdentities.contains(uriStr) && !isSamePhysicalAsDefault) {
                                          seenIdentities.add(uriStr)
                                          val item = HistoryItem(
                                              id = uriStr,
                                              name = name,
                                              isAudio = isMp3,
                                              sizeBytes = doc.length(),
                                              lastModified = doc.lastModified(),
                                              file = null,
                                              uri = doc.uri,
                                              locationName = "$customFolderName (SAF)"
                                          )
                                          populateMetadata(context, item)
                                          result.add(item)
                                          Log.d(TAG, "HISTORY_ITEM_ADDED: (SAF) name='$name', uri='$uriStr', res='${item.resolution}', size=${item.sizeBytes}")
                                      } else {
                                          Log.d(TAG, "HISTORY_DUPLICATE_REJECTED: (SAF) uri='$uriStr', name='$name', reason=${if (seenIdentities.contains(uriStr)) "already_seen_uri" else "same_physical_as_default"}")
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          Log.w(TAG, "Error listing files from custom tree URI: ${e.message}")
                      }
                  }

                  return result
              }
              fun filterAndSortHistory(
                  items: List<HistoryItem>,
                  filter: String,
                  query: String,
                  sortOrder: HistorySortOrder
              ): List<HistoryItem> {
                  val cleanQuery = query.trim().lowercase()

                  val filtered = items.filter { item ->
                      val typeMatches = when (filter) {
                          "AUDIO" -> item.isAudio
                          "VIDEO" -> !item.isAudio
                          else -> true
                      }
                      val queryMatches = cleanQuery.isEmpty() || item.name.lowercase().contains(cleanQuery)
                      typeMatches && queryMatches
                  }

                  return when (sortOrder) {
                      HistorySortOrder.NEWEST -> filtered.sortedByDescending { it.lastModified }
                      HistorySortOrder.OLDEST -> filtered.sortedBy { it.lastModified }
                      HistorySortOrder.SIZE_DESC -> filtered.sortedByDescending { it.sizeBytes }
                      HistorySortOrder.SIZE_ASC -> filtered.sortedBy { it.sizeBytes }
                      HistorySortOrder.NAME_ASC -> filtered.sortedBy { it.name.lowercase() }
                      HistorySortOrder.NAME_DESC -> filtered.sortedByDescending { it.name.lowercase() }
                  }
              }
          }
