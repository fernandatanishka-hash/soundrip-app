              private fun updateHeaderBranding(isDark: Boolean) {
                  try {
                      val titleView = findViewById<TextView>(R.id.txtAppTitleHeader) ?: return
                      val subView = findViewById<TextView>(R.id.txtAppSubtitleHeader) ?: return
          
                      val flowColor = if (isDark) android.graphics.Color.WHITE else android.graphics.Color.parseColor("#0F172A")
                      val ripColor = if (isDark) android.graphics.Color.parseColor("#38BDF8") else android.graphics.Color.parseColor("#0284C7")
                      val subColor = if (isDark) android.graphics.Color.parseColor("#CBD5E1") else android.graphics.Color.parseColor("#475569")
          
                      val spannable = android.text.SpannableStringBuilder("FlowRip")
                      spannable.setSpan(android.text.style.ForegroundColorSpan(flowColor), 0, 4, android.text.Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                      spannable.setSpan(android.text.style.ForegroundColorSpan(ripColor), 4, 7, android.text.Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                      titleView.text = spannable
                      subView.setTextColor(subColor)
                  } catch (e: Exception) {
