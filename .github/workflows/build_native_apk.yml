                                          android:text="Ready to play"
                                          android:textColor="#10B981"
                                          android:textSize="11sp" />
                                  </LinearLayout>
                              </LinearLayout>
                          </androidx.cardview.widget.CardView>

                          <Button
                              android:id="@+id/btnPlayFile"
                              android:layout_width="match_parent"
                              android:layout_height="52dp"
                              android:text="▶ Play"
                              android:textColor="#FFFFFF"
                              android:textSize="15sp"
                              android:textStyle="bold"
                              android:backgroundTint="#4F46E5"
                              app:cornerRadius="26dp"
                              android:layout_marginBottom="10dp" />

                          <Button
                              android:id="@+id/btnSaveFile"
                              android:layout_width="match_parent"
                              android:layout_height="50dp"
                              android:text="📥 Save / Share"
                              android:textColor="#4F46E5"
                              android:textSize="14sp"
                              android:textStyle="bold"
                              android:backgroundTint="#FFFFFF"
                              app:strokeColor="#E2E8F0"
                              app:strokeWidth="1dp"
                              app:cornerRadius="25dp"
                              android:layout_marginBottom="16dp" />

                          <TextView
                              android:id="@+id/btnDownloadAnother"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="🔄 Download Another"
                              android:textColor="#64748B"
                              android:textSize="13sp"
                              android:padding="8dp" />
                      </LinearLayout>

                      </LinearLayout>
