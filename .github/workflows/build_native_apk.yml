              private fun updateFormatUI() {
                  if (isAudio) {
                      cardMp3.setBackgroundResource(R.drawable.bg_card_selected)
                      cardMp4.setBackgroundResource(R.drawable.bg_card_unselected)
                      radioDotMp3.text = "●"
                      radioDotMp3.setTextColor(android.graphics.Color.parseColor("#38BDF8"))
                      radioDotMp4.text = "○"
                      radioDotMp4.setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                  } else {
                      cardMp4.setBackgroundResource(R.drawable.bg_card_selected)
                      cardMp3.setBackgroundResource(R.drawable.bg_card_unselected)
                      radioDotMp4.text = "●"
                      radioDotMp4.setTextColor(android.graphics.Color.parseColor("#38BDF8"))
                      radioDotMp3.text = "○"
                      radioDotMp3.setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                  }
                  applyFormatCardTextColors()
              }
          
              private fun applyFormatCardTextColors() {
                  try {
                      val titleColor = android.graphics.Color.WHITE
                      val subtitleColor = android.graphics.Color.parseColor("#94A3B8")
          
                      fun tintCard(view: View) {
                          if (view is TextView && view.id != R.id.radioDotMp3 && view.id != R.id.radioDotMp4) {
                              val textValue = view.text?.toString() ?: ""
                              if (textValue.contains("MP3 Audio") || textValue.contains("MP4 Video")) {
                                  view.setTextColor(titleColor)
                              } else if (textValue.contains("Music") || textValue.contains("Podcast") || textValue.contains("Up to") || view.id == R.id.txtMp4Subtitle) {
                                  view.setTextColor(subtitleColor)
                              }
                          }
                          if (view is ViewGroup) {
                              for (i in 0 until view.childCount) tintCard(view.getChildAt(i))
                          }
                      }
          
