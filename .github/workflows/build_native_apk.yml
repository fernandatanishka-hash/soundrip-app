              private fun getThumbnailCacheKey(item: StorageHelper.HistoryItem): String {
                  return "${item.id}_${item.lastModified}_${item.sizeBytes}"
              }

              private fun getDiskThumbnailFile(context: Context, cacheKey: String): File {
                  val dir = File(context.cacheDir, "thumbnails")
                  if (!dir.exists()) dir.mkdirs()
                  val safeName = "thumb_" + java.lang.Integer.toHexString(cacheKey.hashCode()) + ".jpg"
                  return File(dir, safeName)
              }

              private fun scaleDownIfNeeded(bmp: Bitmap, maxDimension: Int): Bitmap {
                  if (bmp.width <= maxDimension && bmp.height <= maxDimension) {
                      return bmp
                  }
                  val maxDim = maxOf(bmp.width, bmp.height)
                  val scale = maxDimension.toFloat() / maxDim
                  val w = (bmp.width * scale).toInt().coerceAtLeast(1)
                  val h = (bmp.height * scale).toInt().coerceAtLeast(1)
                  return Bitmap.createScaledBitmap(bmp, w, h, true)
              }

              private fun extractMediaThumbnail(context: Context, item: StorageHelper.HistoryItem): Bitmap? {
                  val cacheKey = getThumbnailCacheKey(item)
                  val diskFile = getDiskThumbnailFile(context, cacheKey)

                  // Check persistent disk cache first
                  if (diskFile.exists() && diskFile.length() > 0L) {
                      try {
                          val diskBmp = BitmapFactory.decodeFile(diskFile.absolutePath)
                          if (diskBmp != null) {
                              Log.d("MainActivity", "THUMBNAIL_DISK_CACHE_HIT for ${item.name} (${diskBmp.width}x${diskBmp.height})")
                              return diskBmp
                          }
                      } catch (e: Exception) {}
                  }

                  val mimeType = if (item.isAudio) "audio/mpeg" else "video/mp4"
                  Log.d("MainActivity", "THUMBNAIL_START: id=${item.id}, path/uri=${item.file?.absolutePath ?: item.uri}, size=${item.sizeBytes}, lastModified=${item.lastModified}, mime=$mimeType")

                  if (item.file != null && (!item.file.exists() || item.file.length() <= 0L)) {
                      Log.w("MainActivity", "THUMBNAIL_ABORT: File missing or empty (${item.file.absolutePath})")
                      return null
                  }

                  if (item.isAudio) {
                      val retriever = MediaMetadataRetriever()
                      try {
                          var dsSet = false
                          if (item.file != null && item.file.exists()) {
                              try {
                                  FileInputStream(item.file).use { fis ->
                                      retriever.setDataSource(fis.fd, 0L, item.file.length())
                                      dsSet = true
                                  }
                              } catch (e: Exception) {}
                              if (!dsSet) {
                                  try {
                                      retriever.setDataSource(item.file.absolutePath)
                                      dsSet = true
                                  } catch (e: Exception) {}
                              }
                          } else if (item.uri != null) {
                              try {
                                  context.contentResolver.openFileDescriptor(item.uri, "r")?.use { pfd ->
                                      retriever.setDataSource(pfd.fileDescriptor, 0L, pfd.statSize)
                                      dsSet = true
                                  }
                              } catch (e: Exception) {}
                              if (!dsSet) {
                                  try {
                                      retriever.setDataSource(context, item.uri)
                                      dsSet = true
                                  } catch (e: Exception) {}
                              }
                          }

                          if (!dsSet) return null

                          val art = retriever.embeddedPicture
                          if (art != null) {
                              val opts = BitmapFactory.Options().apply { inSampleSize = 2 }
                              val decoded = BitmapFactory.decodeByteArray(art, 0, art.size, opts)
                              if (decoded != null) {
                                  val scaled = scaleDownIfNeeded(decoded, 160)
                                  try {
                                      FileOutputStream(diskFile).use { out ->
                                          scaled.compress(Bitmap.CompressFormat.JPEG, 85, out)
                                      }
                                  } catch (e: Exception) {}
                                  return scaled
                              }
                          }
                      } catch (e: Exception) {
                          Log.d("MainActivity", "Audio art extraction failed for ${item.name}: ${e.message}")
                      } finally {
                          try { retriever.release() } catch (e: Exception) {}
                      }
                      return null
                  }

                  // --- Video Thumbnail Extraction Pipeline ---
                  var extractedBmp: Bitmap? = null

                  // Strategy 1: ContentResolver.loadThumbnail for SAF URIs (API 29+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && item.uri != null) {
                      try {
                          val bmp = context.contentResolver.loadThumbnail(item.uri, Size(160, 160), null)
                          if (bmp != null) {
                              Log.d("MainActivity", "THUMBNAIL_LOADTHUMBNAIL_SUCCESS for ${item.name}")
                              extractedBmp = bmp
                          } else {
                              Log.d("MainActivity", "THUMBNAIL_LOADTHUMBNAIL_FAILED (returned null) for ${item.name}")
                          }
                      } catch (e: Exception) {
                          Log.d("MainActivity", "THUMBNAIL_LOADTHUMBNAIL_FAILED (${e.message}) for ${item.name}")
                      }
                  }

                  // Strategy 2: Native ThumbnailUtils for normal filesystem videos
                  if (extractedBmp == null && item.file != null && item.file.exists()) {
                      try {
                          val bmp = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ThumbnailUtils.createVideoThumbnail(item.file, Size(160, 160), null)
                          } else {
                              @Suppress("DEPRECATION")
                              ThumbnailUtils.createVideoThumbnail(item.file.absolutePath, MediaStore.Video.Thumbnails.MINI_KIND)
                          }
                          if (bmp != null) {
                              Log.d("MainActivity", "THUMBNAIL_UTILS_SUCCESS for ${item.name}")
                              extractedBmp = bmp
                          } else {
                              Log.d("MainActivity", "THUMBNAIL_UTILS_FAILED (returned null) for ${item.name}")
                          }
                      } catch (e: Exception) {
                          Log.d("MainActivity", "THUMBNAIL_UTILS_FAILED (${e.message}) for ${item.name}")
                      }
                  }

                  // Strategy 3: MediaMetadataRetriever (Filesystem & SAF fallback)
                  if (extractedBmp == null) {
                      val retriever = MediaMetadataRetriever()
                      try {
                          var dsSet = false
                          if (item.file != null && item.file.exists()) {
                              try {
                                  FileInputStream(item.file).use { fis ->
                                      retriever.setDataSource(fis.fd, 0L, item.file.length())
                                      dsSet = true
                                  }
                              } catch (e: Exception) {}
                              if (!dsSet) {
                                  try {
                                      retriever.setDataSource(item.file.absolutePath)
                                      dsSet = true
                                  } catch (e: Exception) {}
                              }
                          } else if (item.uri != null) {
                              try {
                                  context.contentResolver.openFileDescriptor(item.uri, "r")?.use { pfd ->
                                      retriever.setDataSource(pfd.fileDescriptor, 0L, pfd.statSize)
                                      dsSet = true
                                  }
                              } catch (e: Exception) {}
                              if (!dsSet) {
                                  try {
                                      retriever.setDataSource(context, item.uri)
                                      dsSet = true
                                  } catch (e: Exception) {}
                              }
                          }

                          if (dsSet) {
                              var frame: Bitmap? = null
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                                  frame = try { retriever.getScaledFrameAtTime(1000000L, MediaMetadataRetriever.OPTION_CLOSEST, 160, 160) } catch (e: Exception) { null }
                                  if (frame == null) {
                                      frame = try { retriever.getScaledFrameAtTime(0L, MediaMetadataRetriever.OPTION_CLOSEST, 160, 160) } catch (e: Exception) { null }
                                  }
                                  if (frame == null) {
                                      frame = try { retriever.getScaledFrameAtTime(-1L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC, 160, 160) } catch (e: Exception) { null }
                                  }
                              }
                              if (frame == null) {
                                  frame = try { retriever.getFrameAtTime(1000000L, MediaMetadataRetriever.OPTION_CLOSEST) } catch (e: Exception) { null }
                              }
                              if (frame == null) {
                                  frame = try { retriever.getFrameAtTime(0L, MediaMetadataRetriever.OPTION_CLOSEST) } catch (e: Exception) { null }
                              }
                              if (frame == null) {
                                  frame = try { retriever.getFrameAtTime(1000000L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC) } catch (e: Exception) { null }
                              }
                              if (frame == null) {
                                  frame = try { retriever.getFrameAtTime(0L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC) } catch (e: Exception) { null }
                              }
                              if (frame == null) {
                                  frame = try { retriever.getFrameAtTime(-1L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC) } catch (e: Exception) { null }
                              }
                              if (frame == null) {
                                  frame = try { retriever.frameAtTime } catch (e: Exception) { null }
                              }

                              if (frame != null) {
                                  Log.d("MainActivity", "THUMBNAIL_RETRIEVER_SUCCESS for ${item.name}")
                                  extractedBmp = frame
                              } else {
                                  Log.d("MainActivity", "THUMBNAIL_RETRIEVER_FAILED (all frames null) for ${item.name}")
                              }
                          } else {
                              Log.d("MainActivity", "THUMBNAIL_RETRIEVER_FAILED (dataSource failed) for ${item.name}")
                          }
                      } catch (e: Exception) {
                          Log.d("MainActivity", "THUMBNAIL_RETRIEVER_FAILED (${e.message}) for ${item.name}")
                      } finally {
                          try { retriever.release() } catch (e: Exception) {}
                      }
                  }

                  if (extractedBmp != null) {
                      val scaled = scaleDownIfNeeded(extractedBmp, 160)
                      Log.d("MainActivity", "THUMBNAIL_BITMAP_SIZE: ${scaled.width}x${scaled.height}, bytes=${scaled.byteCount} for ${item.name}")
                      // Persist to disk cache for instantaneous future reloads
                      try {
                          FileOutputStream(diskFile).use { out ->
                              scaled.compress(Bitmap.CompressFormat.JPEG, 85, out)
                          }
                      } catch (e: Exception) {}
                      return scaled
                  }

                  return null
              }

              private fun loadThumbnail(item: StorageHelper.HistoryItem, thumbImg: ImageView, placeholderText: TextView) {
                  val cacheKey = getThumbnailCacheKey(item)
                  thumbImg.tag = cacheKey

                  // Check Memory Cache
                  val cached = thumbnailCache.get(cacheKey)
                  if (cached != null && !cached.isRecycled) {
                      Log.d("MainActivity", "THUMBNAIL_CACHE_HIT for ${item.name}")
                      thumbImg.setImageBitmap(cached)
                      thumbImg.visibility = View.VISIBLE
                      placeholderText.visibility = View.GONE
                      Log.d("MainActivity", "THUMBNAIL_IMAGEVIEW_APPLIED for ${item.name} (${cached.width}x${cached.height})")
                      return
                  }

                  Log.d("MainActivity", "THUMBNAIL_CACHE_MISS for ${item.name}")

                  // Clear previous bitmap and ensure placeholder is visible immediately
                  thumbImg.setImageBitmap(null)
                  thumbImg.visibility = View.GONE
                  placeholderText.visibility = View.VISIBLE

                  thread(name = "FlowRipThumb_${item.id.hashCode()}") {
                      val bmp = extractMediaThumbnail(this@MainActivity, item)

                      runOnUiThread {
                          if (thumbImg.tag == cacheKey) {
                              if (bmp != null && !bmp.isRecycled) {
                                  thumbnailCache.put(cacheKey, bmp)
                                  thumbImg.setImageBitmap(bmp)
                                  thumbImg.visibility = View.VISIBLE
                                  placeholderText.visibility = View.GONE
                                  Log.d("MainActivity", "THUMBNAIL_IMAGEVIEW_APPLIED for ${item.name} (${bmp.width}x${bmp.height})")
                              } else {
                                  thumbImg.setImageBitmap(null)
                                  thumbImg.visibility = View.GONE
                                  placeholderText.visibility = View.VISIBLE
                                  Log.d("MainActivity", "THUMBNAIL_FAILED_PLACEHOLDER_VISIBLE for ${item.name}")
                              }
                          } else {
                              Log.d("MainActivity", "THUMBNAIL_IMAGEVIEW_SKIPPED_TAG_MISMATCH for ${item.name}")
                          }
                      }
                  }
              }

              private fun showFileDetailsDialog(item: StorageHelper.HistoryItem) {
                  val typeStr = if (item.isAudio) "MP3 Audio" else "MP4 Video"
                  val resStr = item.resolution ?: if (item.isAudio) "320 kbps (Audio)" else "Standard"
                  val durStr = item.formattedDuration

                  val detailsMsg = buildString {
                      append("• File: ").append(item.name).append("\n\n")
                      append("• Format: ").append(typeStr).append("\n")
                      append("• Resolution: ").append(resStr).append("\n")
                      append("• Duration: ").append(durStr).append("\n")
                      append("• Size: ").append(item.formattedSize).append("\n")
                      append("• Location: ").append(item.locationName).append("\n")
                      append("• Downloaded: ").append(item.formattedDate)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Media Details")
                      .setMessage(detailsMsg)
                      .setPositiveButton("▶ Play") { _, _ ->
                          playItem(item)
                      }
                      .setNeutralButton("↗ Share") { _, _ ->
                          shareItem(item)
                      }
                      .setNegativeButton("🗑 Delete") { _, _ ->
                          confirmAndDeleteItem(item)
                      }
                      .show()
              }

              private fun playItem(item: StorageHelper.HistoryItem) {
                  try {
                      val uri = if (item.file != null) {
                          FileProvider.getUriForFile(this, "$packageName.provider", item.file)
                      } else {
                          item.uri ?: return
                      }
                      val mimeType = if (item.isAudio) "audio/*" else "video/*"
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, mimeType)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(intent, "Play media with"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "No compatible app found to open this file.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun shareItem(item: StorageHelper.HistoryItem) {
                  try {
                      val uri = if (item.file != null) {
                          FileProvider.getUriForFile(this, "$packageName.provider", item.file)
                      } else {
                          item.uri ?: return
                      }
                      val mimeType = if (item.isAudio) "audio/*" else "video/*"
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = mimeType
                          putExtra(Intent.EXTRA_STREAM, uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share media via"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "Could not share file: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun confirmAndDeleteItem(item: StorageHelper.HistoryItem) {
                  AlertDialog.Builder(this)
                      .setTitle("Delete this file?")
                      .setMessage("\"${item.name}\"\n\nThis will permanently delete this file from your device.")
                      .setPositiveButton("Delete") { _, _ ->
                          thread(name = "FlowRipDeleteThread") {
                              var deleted = false
                              try {
                                  if (item.file != null) {
                                      deleted = item.file.delete()
                                      if (deleted) {
                                          MediaScannerConnection.scanFile(
                                              applicationContext,
                                              arrayOf(item.file.absolutePath),
                                              null,
                                              null
                                          )
                                      }
                                  } else if (item.uri != null) {
                                      deleted = try {
                                          DocumentsContract.deleteDocument(contentResolver, item.uri)
                                      } catch (e: Exception) {
                                          DocumentFile.fromSingleUri(this@MainActivity, item.uri)?.delete() ?: false
                                      }
                                  }
                              } catch (e: Exception) {
                                  Log.w("MainActivity", "Error deleting file: ${e.message}")
                                  deleted = false
                              }

                              runOnUiThread {
                                  if (deleted) {
                                      thumbnailCache.remove(item.id)
                                      thumbnailCache.remove(getThumbnailCacheKey(item))
                                      try {
                                          val diskFile = getDiskThumbnailFile(this@MainActivity, getThumbnailCacheKey(item))
                                          if (diskFile.exists()) diskFile.delete()
                                      } catch (e: Exception) {}
                                      cachedHistoryItems = cachedHistoryItems.filter { it.id != item.id }
                                      renderHistoryUI()
                                      Toast.makeText(this@MainActivity, "File deleted", Toast.LENGTH_SHORT).show()
                                  } else {
                                      Toast.makeText(this@MainActivity, "Could not delete file", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun attachDownloadListener() {
                  DownloadService.setListener { event ->
                      runOnUiThread {
                          when (event) {
                              is DownloadService.DownloadEvent.Progress -> {
                                  showDownloaderState(2)
                                  updatePauseResumeButton(isPaused = false)
                                  downloadingTitle.text = DownloadService.currentTitle
                                  downloadingFormat.text = DownloadService.currentFormat
                                  val p = maxOf(circularProgressBar.progress, event.progress)
                                  circularProgressBar.progress = p
                                  txtCircularPercent.text = "$p%"
                                  linearProgressBar.progress = p
                                  txtDownloadSpeed.text = event.speed
                                  txtDownloadSize.text = event.sizeInfo
                                  txtDownloadEta.text = event.eta
                                  txtDownloadStats.text = event.stats
                                  refreshQueueUI()
                              }
                              is DownloadService.DownloadEvent.Paused -> {
                                  showDownloaderState(2)
                                  updatePauseResumeButton(isPaused = true)
                                  downloadingTitle.text = DownloadService.currentTitle
                                  downloadingFormat.text = DownloadService.currentFormat
                                  circularProgressBar.progress = event.progress
                                  txtCircularPercent.text = "${event.progress}%"
                                  linearProgressBar.progress = event.progress
                                  txtDownloadSpeed.text = "--"
                                  txtDownloadEta.text = "--"
                                  txtDownloadSize.text = event.sizeInfo
                                  val statusMsg = if (event.reason == PauseReason.WAITING_WIFI) "Waiting for Wi-Fi" else "Download paused"
                                  txtDownloadStats.text = statusMsg
                                  refreshQueueUI()
                              }
                              is DownloadService.DownloadEvent.Resumed -> {
                                  showDownloaderState(2)
                                  updatePauseResumeButton(isPaused = false)
                                  txtDownloadStats.text = "Resuming download..."
                                  refreshQueueUI()
                              }
                              is DownloadService.DownloadEvent.Completed -> {
                                  lastDownloadedFile = event.file
                                  updatePauseResumeButton(isPaused = false)
                                  completedFileName.text = event.file.name + event.resolutionInfo
                                  refreshHistory()
                                  refreshQueueUI()
                                  val nextItem = QueueManager.getActiveItem(this@MainActivity)
                                      ?: QueueManager.getNextEligibleItem(this@MainActivity)
                                  if (nextItem != null) {
                                      downloadingTitle.text = nextItem.title
                                      downloadingFormat.text = "${nextItem.format} • ${nextItem.quality}"
                                      circularProgressBar.progress = 0
                                      txtCircularPercent.text = "0%"
                                      linearProgressBar.progress = 0
                                      txtDownloadSpeed.text = "--"
                                      txtDownloadSize.text = "--"
                                      txtDownloadEta.text = "--"
                                      txtDownloadStats.text = "Starting next download..."
                                      showDownloaderState(2)
                                  } else {
                                      circularProgressBar.progress = 100
                                      linearProgressBar.progress = 100
                                      txtCircularPercent.text = "100%"
                                      txtDownloadSpeed.text = "--"
                                      txtDownloadSize.text = "--"
                                      txtDownloadEta.text = "--"
                                      showDownloaderState(3)
                                  }
                                  Toast.makeText(this@MainActivity, "Download Complete!${event.resolutionInfo}", Toast.LENGTH_LONG).show()
                              }
                              is DownloadService.DownloadEvent.Error -> {
                                  updatePauseResumeButton(isPaused = false)
                                  txtDownloadSpeed.text = "--"
                                  txtDownloadSize.text = "--"
                                  txtDownloadEta.text = "--"
                                  refreshQueueUI()
                                  val nextItem = QueueManager.getActiveItem(this@MainActivity)
                                      ?: QueueManager.getNextEligibleItem(this@MainActivity)
                                  if (nextItem != null) {
                                      downloadingTitle.text = nextItem.title
                                      downloadingFormat.text = "${nextItem.format} • ${nextItem.quality}"
                                      circularProgressBar.progress = 0
                                      txtCircularPercent.text = "0%"
                                      linearProgressBar.progress = 0
                                      txtDownloadStats.text = "Starting next download..."
                                      showDownloaderState(2)
                                  } else {
                                      showErrorState(event.message)
                                  }
                              }
                              is DownloadService.DownloadEvent.Cancelled -> {
                                  updatePauseResumeButton(isPaused = false)
                                  circularProgressBar.progress = 0
                                  linearProgressBar.progress = 0
                                  txtCircularPercent.text = "0%"
                                  txtDownloadSpeed.text = "--"
                                  txtDownloadSize.text = "--"
                                  txtDownloadEta.text = "--"
                                  refreshQueueUI()
                                  val nextItem = QueueManager.getActiveItem(this@MainActivity)
                                      ?: QueueManager.getNextEligibleItem(this@MainActivity)
                                  if (nextItem != null) {
                                      downloadingTitle.text = nextItem.title
                                      downloadingFormat.text = "${nextItem.format} • ${nextItem.quality}"
                                      circularProgressBar.progress = 0
                                      txtDownloadStats.text = "Starting next download..."
                                      showDownloaderState(2)
                                  } else {
                                      showDownloaderState(1)
                                      Toast.makeText(this@MainActivity, "Download cancelled", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                  }
              }

              private fun startDownloadFlow() {
                  if (isLoadingFormats) {
                      Toast.makeText(this, "Please wait, detecting available stream qualities...", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val rawInput = urlInput.text.toString().trim()
                  val cleanId = currentVideoId ?: extractYouTubeId(rawInput)
                  val url = if (cleanId != null) "https://www.youtube.com/watch?v=$cleanId" else rawInput
                  if (url.isEmpty()) return

                  val selectedQuality = qualitySpinner.selectedItem?.toString() ?: "Best"
                  if (selectedQuality.contains("No audio") || selectedQuality.contains("No video")) {
                      Toast.makeText(this, "Selected format is not available for this media", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val resolvedTitle = if (previewTitle.text.toString().isNotEmpty() && previewTitle.text != "Loading media..." && previewTitle.text != "Inspecting stream...") {
                      previewTitle.text.toString()
                  } else {
                      downloadingTitle.text.toString().takeIf { it.isNotEmpty() && it != "Downloading media..." } ?: "Media File"
                  }

                  urlInput.text?.clear()
                  currentVideoId = null
                  lastFormatDetectionUrl = null
                  lastFormatErrorUrl = null

                  executeDownloadTask(url, resolvedTitle, isAudio, selectedQuality)
              }

              private fun executeDownloadTask(url: String, title: String, isAudioSelection: Boolean, selectedQuality: String) {
                  val item = QueueItem(
                      url = url,
                      title = title,
                      format = if (isAudioSelection) "MP3" else "MP4",
                      quality = selectedQuality,
                      isAudio = isAudioSelection
                  )
                  val startedNow = QueueManager.enqueue(this@MainActivity, item)
                  if (startedNow) {
                      showDownloaderState(2)
                      downloadingTitle.text = item.title
                      downloadingFormat.text = "${item.format} • ${item.quality}"
                      circularProgressBar.progress = 0
                      txtCircularPercent.text = "0%"
                      linearProgressBar.progress = 0
                      txtDownloadSpeed.text = "--"
                      txtDownloadSize.text = "--"
                      txtDownloadEta.text = "--"
                      txtDownloadStats.text = "Starting background download service..."
                  } else {
                      val wifiOnly = NetworkHelper.isWifiOnlyEnabled(this@MainActivity)
                      val wifiConnected = NetworkHelper.isWifiConnected(this@MainActivity)
                      if (wifiOnly && !wifiConnected) {
                          Toast.makeText(this@MainActivity, "Added to queue: Waiting for Wi-Fi", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this@MainActivity, "Added to download queue: ${item.title}", Toast.LENGTH_SHORT).show()
                      }
                      if (DownloadService.isDownloading || DownloadService.isPaused || QueueManager.getPausedItem(this@MainActivity) != null) {
                          showDownloaderState(2)
                      } else {
                          showDownloaderState(0)
                      }
                  }
                  refreshQueueUI()
              }

