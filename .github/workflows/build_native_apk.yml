                          QueueStatus.PAUSED -> {
                              val isWaitingWifi = (item.pauseReason == PauseReason.WAITING_WIFI)
                              val miniProgress = ProgressBar(
                                  this,
                                  null,
                                  android.R.attr.progressBarStyleHorizontal
                              ).apply {
                                  val lp = LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.MATCH_PARENT,
                                      dpToPx(4)
                                  )
                                  lp.topMargin = dpToPx(8)
                                  layoutParams = lp
                                  max = 100
                                  progress = item.progress
                                  val tint = if (isWaitingWifi) "#D97706" else "#F59E0B"
                                  progressTintList = android.content.res.ColorStateList.valueOf(
                                      android.graphics.Color.parseColor(tint)
                                  )
                              }
                              val label = if (isWaitingWifi) "Waiting for Wi-Fi" else "Paused"
                              val metricsView = TextView(this).apply {
                                  text = "${item.progress}% • $label • ${item.sizeInfo}"
                                  textSize = 11f
                                  setTextColor(android.graphics.Color.parseColor("#64748B"))
                                  val lp = LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.MATCH_PARENT,
                                      LinearLayout.LayoutParams.WRAP_CONTENT
                                  )
                                  lp.topMargin = dpToPx(4)
                                  layoutParams = lp
                              }
                              cardInner.addView(miniProgress)
                              cardInner.addView(metricsView)
                          }
                          QueueStatus.FAILED -> {
                              val errorView = TextView(this).apply {
                                  text = item.error ?: "Download failed"
                                  textSize = 11f
                                  setTextColor(android.graphics.Color.parseColor("#DC2626"))
                                  maxLines = 2
                                  ellipsize = android.text.TextUtils.TruncateAt.END
                                  val lp = LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.MATCH_PARENT,
                                      LinearLayout.LayoutParams.WRAP_CONTENT
                                  )
                                  lp.topMargin = dpToPx(4)
                                  layoutParams = lp
                              }
                              cardInner.addView(errorView)
                          }
                          QueueStatus.QUEUED -> {
                              val wifiOnly = NetworkHelper.isWifiOnlyEnabled(this@MainActivity)
                              val wifiConnected = NetworkHelper.isWifiConnected(this@MainActivity)
                              val waitMsg = if (wifiOnly && !wifiConnected) "Waiting for Wi-Fi connection..." else "Waiting in queue..."
                              val waitView = TextView(this).apply {
                                  text = waitMsg
                                  textSize = 11f
                                  setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                                  val lp = LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.MATCH_PARENT,
                                      LinearLayout.LayoutParams.WRAP_CONTENT
                                  )
                                  lp.topMargin = dpToPx(4)
                                  layoutParams = lp
                              }
                              cardInner.addView(waitView)
                          }
                          else -> {}
                      }

                      itemCard.addView(cardInner)
                      queueListContainer.addView(itemCard)
                  }
              }

              private fun playFile(file: File) {
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.provider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, if (file.name.endsWith(".mp3")) "audio/*" else "video/*")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(intent, "Play media with"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "File located at: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun shareFile(file: File) {
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.provider", file)
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = if (file.name.endsWith(".mp3")) "audio/*" else "video/*"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share media via"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "File located at: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun checkAndPromptStoragePermission() {
                  try {
                      StorageHelper.getDefaultDownloadDir()
                  } catch (e: Exception) {
                      Log.w("MainActivity", "Error creating default download dir: ${e.message}")
                  }

                  val neededPermissions = mutableListOf<String>()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          neededPermissions.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          neededPermissions.add(Manifest.permission.READ_MEDIA_AUDIO)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          neededPermissions.add(Manifest.permission.READ_MEDIA_VIDEO)
                      }
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          neededPermissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          neededPermissions.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          neededPermissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }

                  if (neededPermissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, neededPermissions.toTypedArray(), 101)
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101) {
                      try {
                          StorageHelper.getDefaultDownloadDir()
                      } catch (e: Exception) {}
                      refreshHistory()
                  }
              }
          }
