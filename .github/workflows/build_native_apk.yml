                  loadQueue(context)
                  val item = queueItems.find { it.id == taskId }
                  if (item != null) {
                      item.status = QueueStatus.CANCELLED
                      item.pauseReason = PauseReason.NONE
                      item.speed = "--"
                      item.eta = "--"
                      saveQueue(context)
                      notifyListeners()
                  }
              }

              @Synchronized
              fun removeItem(context: Context, id: String): Boolean {
                  loadQueue(context)
                  val index = queueItems.indexOfFirst { it.id == id }
                  if (index != -1) {
                      val item = queueItems[index]
                      val wasActive = (item.status == QueueStatus.DOWNLOADING)
                      val wasPaused = (item.status == QueueStatus.PAUSED)
                      queueItems.removeAt(index)
                      saveQueue(context)
                      notifyListeners()

                      if (wasActive || wasPaused) {
                          val cancelIntent = Intent(context, DownloadService::class.java).apply {
                              action = DownloadService.ACTION_CANCEL
                              putExtra(DownloadService.EXTRA_TASK_ID, id)
                          }
                          context.startService(cancelIntent)
                      }
                      return true
                  }
                  return false
              }

              @Synchronized
              fun retryItem(context: Context, id: String): QueueItem? {
                  loadQueue(context)
                  val oldIndex = queueItems.indexOfFirst { it.id == id }
                  if (oldIndex != -1) {
                      val oldItem = queueItems[oldIndex]
                      val freshItem = QueueItem(
                          id = UUID.randomUUID().toString(),
                          url = oldItem.url,
                          title = oldItem.title,
                          format = oldItem.format,
                          quality = oldItem.quality,
                          isAudio = oldItem.isAudio,
                          status = QueueStatus.QUEUED,
                          pauseReason = PauseReason.NONE,
                          progress = 0,
                          speed = "--",
                          eta = "--",
                          sizeInfo = "--",
                          error = null
                      )
                      queueItems[oldIndex] = freshItem
                      saveQueue(context)
                      notifyListeners()

                      if (!DownloadService.isDownloading && !DownloadService.isPaused && !queueItems.any { it.status == QueueStatus.PAUSED }) {
                          startNext(context)
                      }
                      return freshItem
                  }
                  return null
              }

              @Synchronized
              fun clearFinished(context: Context) {
                  loadQueue(context)
                  queueItems.removeAll { it.status == QueueStatus.COMPLETED || it.status == QueueStatus.CANCELLED }
                  saveQueue(context)
                  notifyListeners()
              }
