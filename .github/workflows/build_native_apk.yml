name: Build FlowRip Studio Pro UI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate FlowRip Studio Project
        run: |
          mkdir -p app/src/main/java/com/soundrip/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. Vector Logos and Clean Navigation Icons
          cat << 'EOF' > app/src/main/res/drawable/ic_play_gradient.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6366F1"
                  android:pathData="M38,28 C35.2,26.5 31,28.5 31,31.7 L31,76.3 C31,79.5 35.2,81.5 38,80.0 L76,57.7 C78.7,56.1 78.7,52.2 76,50.6 Z"/>
              <path
                  android:fillColor="#00D2FF"
                  android:pathData="M38,28 C35.2,26.5 31,28.5 31,31.7 L31,54 L55,54 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_home.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#4F46E5"
                  android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_history.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M13,3a9,9 0 0,0 -9,9H1l3.89,3.89.07.14L9,12H6c0,-3.87 3.13,-7 7,-7s7,3.13 7,7 -3.13,7 -7,7c-1.93,0 -3.68,-0.79 -4.94,-2.06l-1.42,1.42A8.954,8.954 0 0,0 13,21a9,9 0 0,0 0,-18zm-1,5v5l4.28,2.54.72,-1.21 -3.5,-2.08V8H12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6 3.6,1.62 3.6,3.6 -1.62,3.6 -3.6,3.6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0A0D1A"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6366F1"
                  android:pathData="M38,28 C35.2,26.5 31,28.5 31,31.7 L31,76.3 C31,79.5 35.2,81.5 38,80.0 L76,57.7 C78.7,56.1 78.7,52.2 76,50.6 Z"/>
              <path
                  android:fillColor="#00D2FF"
                  android:pathData="M38,28 C35.2,26.5 31,28.5 31,31.7 L31,54 L55,54 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # 2. Drawables (Badges, Cards, Circular Progress)
          cat << 'EOF' > app/src/main/res/drawable/bg_badge.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F1F5F9"/>
              <stroke android:width="1dp" android:color="#E2E8F0"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_selected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#EEF2FF"/>
              <stroke android:width="1.8dp" android:color="#4F46E5"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_unselected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <stroke android:width="1dp" android:color="#E2E8F0"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/circular_progress_drawable.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape
                      android:innerRadiusRatio="2.4"
                      android:shape="ring"
                      android:thickness="6dp"
                      android:useLevel="false">
                      <solid android:color="#E2E8F0" />
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <rotate
                      android:fromDegrees="270"
                      android:toDegrees="270">
                      <shape
                          android:innerRadiusRatio="2.4"
                          android:shape="ring"
                          android:thickness="6dp"
                          android:useLevel="true">
                          <solid android:color="#4F46E5" />
                      </shape>
                  </rotate>
              </item>
          </layer-list>
          EOF

          cat << 'EOF' > app/src/main/res/xml/provider_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="."/>
          </paths>
          EOF

          # 3. Colors & Modern Light Theme (Clean Light Status Bar)
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="flowrip_bg">#F8FAFC</color>
              <color name="flowrip_primary">#4F46E5</color>
              <color name="flowrip_dark">#0F172A</color>
              <color name="flowrip_muted">#64748B</color>
              <color name="flowrip_success">#10B981</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.FlowRip" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="android:windowBackground">#F8FAFC</item>
                  <item name="android:statusBarColor">#F8FAFC</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="colorPrimary">@color/flowrip_primary</item>
              </style>
          </resources>
          EOF

          # 4. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 5. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "FlowRip"
          include ':app'
          EOF

          # 6. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 7. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.soundrip.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.soundrip.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 10
                  versionName "10.0"

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.cardview:cardview:1.0.0'

              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

              implementation 'com.startapp:inapp-sdk:5.1.0'
          }
          EOF

          # 8. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">FlowRip</string>
          </resources>
          EOF

          # 9. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/Theme.FlowRip"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/provider_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 10. High-Contrast Spinner Layouts
          cat << 'EOF' > app/src/main/res/layout/item_spinner_selected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="8dp"
              android:textColor="#0F172A"
              android:textSize="14sp"
              android:textStyle="bold" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_spinner_dropdown.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="14dp"
              android:background="#FFFFFF"
              android:textColor="#0F172A"
              android:textSize="14sp"
              android:textStyle="bold" />
          EOF

          # 11. Complete activity_main.xml (Updated with Paste Button & Clean Settings)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F8FAFC">

              <!-- App Pages Container -->
              <FrameLayout
                  android:id="@+id/containerPages"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/bottomSection">

                  <!-- PAGE 1: HOME (Downloader) -->
                  <ScrollView
                      android:id="@+id/pageHome"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:fillViewport="true"
                      android:visibility="visible">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="20dp">

                          <!-- Top Header Bar -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:layout_marginTop="4dp"
                              android:layout_marginBottom="24dp">

                              <ImageView
                                  android:layout_width="30dp"
                                  android:layout_height="30dp"
                                  android:src="@drawable/ic_play_gradient" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Flow"
                                  android:textColor="#0F172A"
                                  android:textSize="22sp"
                                  android:textStyle="bold"
                                  android:layout_marginStart="8dp" />

                              <TextView
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:text="rip"
                                  android:textColor="#6366F1"
                                  android:textSize="22sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/btnMenu"
                                  android:layout_width="36dp"
                                  android:layout_height="36dp"
                                  android:text="☰"
                                  android:textColor="#0F172A"
                                  android:textSize="20sp"
                                  android:gravity="center" />
                          </LinearLayout>

                          <!-- URL Input Pill Card -->
                          <androidx.cardview.widget.CardView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              app:cardBackgroundColor="#FFFFFF"
                              app:cardCornerRadius="28dp"
                              app:cardElevation="3dp"
                              android:layout_marginBottom="20dp">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:padding="6dp">

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="🔗"
                                      android:textSize="16sp"
                                      android:layout_marginStart="12dp"
                                      android:layout_marginEnd="6dp" />

                                  <EditText
                                      android:id="@+id/urlInput"
                                      android:layout_width="0dp"
                                      android:layout_height="48dp"
                                      android:layout_weight="1"
                                      android:hint="Paste YouTube link here..."
                                      android:textColorHint="#94A3B8"
                                      android:textColor="#0F172A"
                                      android:background="@null"
                                      android:textSize="14sp"
                                      android:inputType="textUri" />

                                  <TextView
                                      android:id="@+id/btnClear"
                                      android:layout_width="32dp"
                                      android:layout_height="32dp"
                                      android:text="✕"
                                      android:textColor="#94A3B8"
                                      android:gravity="center"
                                      android:textSize="15sp"
                                      android:visibility="gone"
                                      android:layout_marginEnd="6dp" />

                                  <!-- DYNAMIC BUTTON: SAYS "📋 PASTE" WHEN EMPTY, "📥 DOWNLOAD" WHEN FILLED -->
                                  <Button
                                      android:id="@+id/btnActionDynamic"
                                      android:layout_width="wrap_content"
                                      android:layout_height="44dp"
                                      android:text="📋 PASTE"
                                      android:textColor="#FFFFFF"
                                      android:textStyle="bold"
                                      android:textSize="13sp"
                                      android:backgroundTint="#4F46E5"
                                      app:cornerRadius="22dp" />
                              </LinearLayout>
                          </androidx.cardview.widget.CardView>

                          <!-- STATE A: HERO + 3 FEATURES -->
                          <LinearLayout
                              android:id="@+id/viewHomeHero"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:gravity="center_horizontal"
                              android:visibility="visible">

                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:layout_marginTop="28dp">

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="YouTube to "
                                      android:textColor="#0F172A"
                                      android:textSize="26sp"
                                      android:textStyle="bold" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="MP3 &amp; MP4"
                                      android:textColor="#4F46E5"
                                      android:textSize="26sp"
                                      android:textStyle="bold" />
                              </LinearLayout>

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Download your favorite videos &amp; music in HD, easily."
                                  android:textColor="#64748B"
                                  android:textSize="14sp"
                                  android:layout_marginTop="6dp"
                                  android:layout_marginBottom="40dp" />

                              <!-- 3 Feature Badges -->
                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal">

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:gravity="center"
                                      android:orientation="vertical">

                                      <TextView
                                          android:layout_width="44dp"
                                          android:layout_height="44dp"
                                          android:text="⚡"
                                          android:textSize="20sp"
                                          android:gravity="center"
                                          android:background="@drawable/bg_badge" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Fast"
                                          android:textColor="#0F172A"
                                          android:textSize="13sp"
                                          android:textStyle="bold"
                                          android:layout_marginTop="8dp" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="High-speed\nconversions"
                                          android:textColor="#94A3B8"
                                          android:textSize="11sp"
                                          android:gravity="center"
                                          android:layout_marginTop="2dp" />
                                  </LinearLayout>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:gravity="center"
                                      android:orientation="vertical">

                                      <TextView
                                          android:layout_width="44dp"
                                          android:layout_height="44dp"
                                          android:text="🛡️"
                                          android:textSize="20sp"
                                          android:gravity="center"
                                          android:background="@drawable/bg_badge" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Free"
                                          android:textColor="#0F172A"
                                          android:textSize="13sp"
                                          android:textStyle="bold"
                                          android:layout_marginTop="8dp" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="No hidden fees,\n100% free"
                                          android:textColor="#94A3B8"
                                          android:textSize="11sp"
                                          android:gravity="center"
                                          android:layout_marginTop="2dp" />
                                  </LinearLayout>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:gravity="center"
                                      android:orientation="vertical">

                                      <TextView
                                          android:layout_width="44dp"
                                          android:layout_height="44dp"
                                          android:text="📱"
                                          android:textSize="20sp"
                                          android:gravity="center"
                                          android:background="@drawable/bg_badge" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Everywhere"
                                          android:textColor="#0F172A"
                                          android:textSize="13sp"
                                          android:textStyle="bold"
                                          android:layout_marginTop="8dp" />

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="Saved right to\nyour phone"
                                          android:textColor="#94A3B8"
                                          android:textSize="11sp"
                                          android:gravity="center"
                                          android:layout_marginTop="2dp" />
                                  </LinearLayout>
                              </LinearLayout>
                          </LinearLayout>

                          <!-- STATE B: PREVIEW -->
                          <androidx.cardview.widget.CardView
                              android:id="@+id/viewPreviewCard"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              app:cardBackgroundColor="#FFFFFF"
                              app:cardCornerRadius="16dp"
                              app:cardElevation="2dp"
                              android:visibility="gone"
                              android:layout_marginBottom="16dp">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical"
                                  android:padding="16dp">

                                  <LinearLayout
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:layout_marginBottom="16dp">

                                      <FrameLayout
                                          android:layout_width="120dp"
                                          android:layout_height="72dp">

                                          <androidx.cardview.widget.CardView
                                              android:layout_width="match_parent"
                                              android:layout_height="match_parent"
                                              app:cardCornerRadius="10dp"
                                              app:cardElevation="0dp">

                                              <ImageView
