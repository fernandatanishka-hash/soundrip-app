              fun markFailed(context: Context, taskId: String, error: String) {
                  loadQueue(context)
                  val item = queueItems.find { it.id == taskId }
                  if (item != null) {
                      item.status = QueueStatus.FAILED
                      item.pauseReason = PauseReason.NONE
                      item.error = error
                      item.speed = "--"
                      item.eta = "--"
                      saveQueue(context)
                      notifyListeners()
                  }
              }

