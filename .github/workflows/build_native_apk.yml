                                      android:textSize="12sp"
                                      android:layout_marginTop="8dp" />

                                  <Button
                                      android:id="@+id/btnCancel"
                                      android:layout_width="wrap_content"
                                      android:layout_height="38dp"
                                      android:layout_marginTop="16dp"
                                      android:text="✕ Cancel"
                                      android:textColor="#EF4444"
                                      android:textSize="12sp"
                                      android:backgroundTint="#FEE2E2"
                                      app:cornerRadius="19dp" />
                              </LinearLayout>
                          </androidx.cardview.widget.CardView>

                          <!-- DOWNLOAD COMPLETE SECTION -->
                          <androidx.cardview.widget.CardView
                              android:id="@+id/viewCompleteSection"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="20dp"
                              android:visibility="gone"
                              app:cardCornerRadius="20dp"
                              app:cardElevation="4dp"
                              app:cardBackgroundColor="#FFFFFF">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="vertical"
                                  android:gravity="center_horizontal"
                                  android:padding="24dp">

                                  <TextView
                                      android:layout_width="64dp"
                                      android:layout_height="64dp"
                                      android:background="@drawable/bg_badge"
                                      android:text="✓"
                                      android:textColor="#10B981"
                                      android:textSize="32sp"
                                      android:textStyle="bold"
                                      android:gravity="center" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Ready in Downloads!"
                                      android:textColor="#0F172A"
                                      android:textSize="18sp"
                                      android:textStyle="bold"
                                      android:layout_marginTop="14dp" />

                                  <TextView
                                      android:id="@+id/completedFileName"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="TrackName.mp3"
                                      android:textColor="#64748B"
                                      android:textSize="12sp"
                                      android:layout_marginTop="4dp"
                                      android:maxLines="1"
                                      android:ellipsize="end" />

                                  <!-- Play & Share Buttons -->
                                  <LinearLayout
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:layout_marginTop="20dp">

                                      <Button
                                          android:id="@+id/btnPlayFile"
                                          android:layout_width="0dp"
                                          android:layout_height="50dp"
                                          android:layout_weight="1"
                                          android:text="▶ Play Media"
                                          android:textColor="#FFFFFF"
                                          android:textSize="13sp"
                                          android:textStyle="bold"
                                          android:backgroundTint="#4F46E5"
                                          app:cornerRadius="25dp" />

                                      <View
                                          android:layout_width="12dp"
                                          android:layout_height="1dp" />

                                      <Button
                                          android:id="@+id/btnSaveFile"
                                          android:layout_width="0dp"
                                          android:layout_height="50dp"
                                          android:layout_weight="1"
                                          android:text="↗ Share / Save"
                                          android:textColor="#4F46E5"
                                          android:textSize="13sp"
                                          android:textStyle="bold"
                                          android:backgroundTint="#EEF2FF"
                                          app:cornerRadius="25dp" />
                                  </LinearLayout>

                                  <TextView
                                      android:id="@+id/btnDownloadAnother"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Download Another Link"
                                      android:textColor="#64748B"
                                      android:textSize="12sp"
                                      android:layout_marginTop="16dp"
                                      android:padding="6dp" />
                              </LinearLayout>
                          </androidx.cardview.widget.CardView>
                      </LinearLayout>
                  </ScrollView>

