                      isFillViewport = true
                  }
                  val listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
          
                  AppLocalization.Lang.values().forEach { lang ->
                      val isSelected = (lang.code == currentLangCode)
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dpToPx(48)).apply {
                              bottomMargin = dpToPx(4)
                          }
                          setBackgroundResource(if (isSelected) R.drawable.bg_lang_selected else R.drawable.bg_lang_unselected)
                          isClickable = true
                          isFocusable = true
                          setPadding(dpToPx(12), 0, dpToPx(12), 0)
          
                          setOnClickListener {
                              dialog.dismiss()
                              if (lang.code != currentLangCode) {
                                  prefs.edit().putString(AppLocalization.KEY_LANGUAGE, lang.code).apply()
                                  applyCurrentLanguage(lang.code)
                                  val confirmMsg = "${AppLocalization.getString("lang_set_to", lang.code)} ${lang.displayName.split(" ")[0]}"
                                  showAppToast(confirmMsg)
                              }
                          }
                      }
          
                      val nameView = TextView(this).apply {
                          text = lang.displayName
                          setTextColor(if (isSelected) android.graphics.Color.parseColor("#38BDF8") else android.graphics.Color.parseColor("#E2E8F0"))
                          textSize = 14f
                          if (isSelected) typeface = android.graphics.Typeface.DEFAULT_BOLD
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      row.addView(nameView)
          
                      val radioIndicator = TextView(this).apply {
                          text = if (isSelected) "●" else "○"
                          setTextColor(if (isSelected) android.graphics.Color.parseColor("#38BDF8") else android.graphics.Color.parseColor("#64748B"))
                          textSize = 18f
                      }
                      row.addView(radioIndicator)
          
                      listContainer.addView(row)
                  }
                  scroll.addView(listContainer)
                  root.addView(scroll)
          
                  val btnCancel = Button(this).apply {
                      text = AppLocalization.getString("cancel", currentLangCode)
                      setTextColor(android.graphics.Color.parseColor("#94A3B8"))
                      background = null
                      isAllCaps = false
                      textSize = 14f
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dpToPx(40)).apply {
                          gravity = Gravity.END
                          topMargin = dpToPx(8)
                      }
                      setOnClickListener { dialog.dismiss() }
                  }
                  root.addView(btnCancel)
          
                  dialog.setContentView(root)
                  dialog.show()
              }
          
