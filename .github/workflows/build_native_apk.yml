name: Build Native yt-dlp Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Native Android Project
        run: |
          mkdir -p app/src/main/java/com/soundrip/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "SoundRip"
          include ':app'
          EOF

          # 3. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.soundrip.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.soundrip.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          EOF

          # 5. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">SoundRip Studio</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. UI Layout with Quality Spinner (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B0D11"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="⚡ SOUNDRIP STUDIO"
                  android:textColor="#00F076"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginTop="20dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Native yt-dlp Mobile Engine"
                  android:textColor="#8E9AA8"
                  android:textSize="13sp"
                  android:layout_marginBottom="24dp" />

              <EditText
                  android:id="@+id/urlInput"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:hint="Paste YouTube Link..."
                  android:textColorHint="#606B7A"
                  android:textColor="#FFFFFF"
                  android:background="#1D222D"
                  android:padding="12dp"
                  android:textSize="14sp"
                  android:inputType="textUri" />

              <Button
                  android:id="@+id/pasteBtn"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="📋 Paste"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#2A3345"
                  android:layout_marginTop="8dp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginTop="16dp">

                  <Button
                      android:id="@+id/btnAudio"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="🎵 MP3 Audio"
                      android:textColor="#000000"
                      android:backgroundTint="#00F076"
                      android:layout_marginEnd="6dp" />

                  <Button
                      android:id="@+id/btnVideo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="🎬 MP4 Video"
                      android:textColor="#FFFFFF"
                      android:backgroundTint="#1D222D"
                      android:layout_marginStart="6dp" />
              </LinearLayout>

              <!-- Quality Selector Card -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:background="#14171F"
                  android:padding="12dp"
                  android:gravity="center_vertical"
                  android:layout_marginTop="14dp">

                  <TextView
                      android:id="@+id/qualityLabel"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Audio Bitrate:"
                      android:textColor="#8E9AA8"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:layout_marginEnd="10dp" />

                  <Spinner
                      android:id="@+id/qualitySpinner"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:backgroundTint="#00F076" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="8dp"
                  android:layout_marginTop="20dp"
                  android:visibility="gone"
                  android:progressBackgroundTint="#1D222D"
                  android:progressTint="#00F076" />

              <Button
                  android:id="@+id/downloadBtn"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="⚡ START INSTANT DOWNLOAD"
                  android:textColor="#000000"
                  android:textStyle="bold"
                  android:backgroundTint="#00F076"
                  android:layout_marginTop="16dp" />

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Initializing yt-dlp mobile engine..."
                  android:textColor="#00F076"
                  android:textSize="12sp"
                  android:layout_marginTop="16dp" />
          </LinearLayout>
          EOF

          # 8. Kotlin Code with dynamic Quality selections (MainActivity.kt)
          cat << 'EOF' > app/src/main/java/com/soundrip/app/MainActivity.kt
          package com.soundrip.app

          import android.media.MediaScannerConnection
          import android.os.Bundle
          import android.os.Environment
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import com.yausername.ffmpeg.FFmpeg
          import java.io.File
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private var isAudio = true
              private val audioQualities = arrayOf("320 kbps (HQ)", "256 kbps", "192 kbps (Standard)", "128 kbps (Fast)")
              private val videoQualities = arrayOf("Best Available", "1080p (Full HD)", "720p (HD)", "480p", "360p")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val statusText = findViewById<TextView>(R.id.statusText)
                  val urlInput = findViewById<EditText>(R.id.urlInput)
                  val pasteBtn = findViewById<Button>(R.id.pasteBtn)
                  val btnAudio = findViewById<Button>(R.id.btnAudio)
                  val btnVideo = findViewById<Button>(R.id.btnVideo)
                  val downloadBtn = findViewById<Button>(R.id.downloadBtn)
                  val progressBar = findViewById<ProgressBar>(R.id.progressBar)
                  val qualityLabel = findViewById<TextView>(R.id.qualityLabel)
                  val qualitySpinner = findViewById<Spinner>(R.id.qualitySpinner)

                  fun updateSpinner() {
                      val options = if (isAudio) audioQualities else videoQualities
                      qualityLabel.text = if (isAudio) "Audio Bitrate:" else "Resolution:"
                      val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, options)
                      qualitySpinner.adapter = adapter
                  }
                  updateSpinner()

                  thread {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          runOnUiThread { statusText.text = "Checking engine updates..." }
                          try {
                              YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)
                          } catch (_: Exception) {}

                          runOnUiThread {
                              statusText.text = "⚡ Engine Ready. Genuine yt-dlp active!"
                          }
                      } catch (e: Exception) {
                          runOnUiThread { statusText.text = "Engine ready" }
                      }
                  }

                  pasteBtn.setOnClickListener {
                      val clipboard = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                      val item = clipboard.primaryClip?.getItemAt(0)
                      item?.text?.let { urlInput.setText(it) }
                  }

                  btnAudio.setOnClickListener {
                      isAudio = true
                      btnAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#00F076"))
                      btnAudio.setTextColor(android.graphics.Color.BLACK)
                      btnVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#1D222D"))
                      btnVideo.setTextColor(android.graphics.Color.WHITE)
                      updateSpinner()
                  }

                  btnVideo.setOnClickListener {
                      isAudio = false
                      btnVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#3B82F6"))
                      btnVideo.setTextColor(android.graphics.Color.WHITE)
                      btnAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#1D222D"))
                      btnAudio.setTextColor(android.graphics.Color.WHITE)
                      updateSpinner()
                  }

                  downloadBtn.setOnClickListener {
                      val url = urlInput.text.toString().trim()
                      if (url.isEmpty()) {
                          Toast.makeText(this, "Please paste a YouTube link", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      val selectedQuality = qualitySpinner.selectedItem.toString()
                      downloadBtn.isEnabled = false
                      downloadBtn.text = "DOWNLOADING STREAM..."
                      progressBar.visibility = View.VISIBLE
                      statusText.text = "yt-dlp is downloading stream..."

                      thread {
                          try {
                              val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              val targetDir = File(publicDownloads, "SoundRip")
                              if (!targetDir.exists()) targetDir.mkdirs()

                              val request = YoutubeDLRequest(url)
                              request.addOption("--extractor-args", "youtube:player_client=android,web")
                              request.addOption("--no-check-certificates")
                              request.addOption("--no-update")

                              if (isAudio) {
                                  val bitrate = selectedQuality.split(" ")[0] // extracts e.g. "320"
                                  request.addOption("-x")
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", bitrate)
                              } else {
                                  when {
                                      selectedQuality.contains("1080p") -> request.addOption("-f", "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]")
                                      selectedQuality.contains("720p") -> request.addOption("-f", "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]")
                                      selectedQuality.contains("480p") -> request.addOption("-f", "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]")
                                      selectedQuality.contains("360p") -> request.addOption("-f", "bestvideo[height<=360][ext=mp4]+bestaudio[ext=m4a]/best[height<=360]")
                                      else -> request.addOption("-f", "best[ext=mp4]/best")
                                  }
                              }
                              request.addOption("-o", "${targetDir.absolutePath}/%(title)s.%(ext)s")

                              YoutubeDL.getInstance().execute(request) { progress, _, _ ->
                                  runOnUiThread {
                                      progressBar.progress = progress.toInt()
                                      statusText.text = "Downloading: ${progress.toInt()}%"
                                  }
                              }

                              val downloadedFiles = targetDir.listFiles()
                              val latestFile = downloadedFiles?.maxByOrNull { it.lastModified() }
                              latestFile?.let { file ->
                                  MediaScannerConnection.scanFile(
                                      applicationContext,
                                      arrayOf(file.absolutePath),
                                      arrayOf(if (isAudio) "audio/mpeg" else "video/mp4"),
                                      null
                                  )
                              }

                              runOnUiThread {
                                  downloadBtn.isEnabled = true
                                  downloadBtn.text = "⚡ START INSTANT DOWNLOAD"
                                  progressBar.visibility = View.GONE
                                  statusText.text = "✅ Saved to Downloads/SoundRip folder!"
                                  Toast.makeText(this@MainActivity, "Download Complete!", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  downloadBtn.isEnabled = true
                                  downloadBtn.text = "⚡ START INSTANT DOWNLOAD"
                                  progressBar.visibility = View.GONE
                                  statusText.text = "Error: ${e.message}"
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Native APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundRip-Native-APK
          path: app/build/outputs/apk/**/*.apk
