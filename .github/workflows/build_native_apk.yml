              private fun selectBestMatchingQuality(options: List<String>, isAudio: Boolean, savedPreference: String): Int {
                  if (options.isEmpty()) return -1
                  if (savedPreference == "Best Available" || options.size == 1) return 0
          
                  if (isAudio) {
                      val targetBitrate = when {
                          savedPreference.contains("320") -> 320
                          savedPreference.contains("256") -> 256
                          savedPreference.contains("192") -> 192
                          savedPreference.contains("128") -> 128
                          else -> 320
                      }
                      for ((idx, opt) in options.withIndex()) {
                          val optBitrate = opt.filter { it.isDigit() }.take(3).toIntOrNull() ?: 0
                          if (optBitrate <= targetBitrate && optBitrate > 0) {
                              return idx
                          }
                      }
                      return 0
                  } else {
                      val targetRes = when {
                          savedPreference.contains("2160") || savedPreference.contains("4K") -> 2160
                          savedPreference.contains("1440") || savedPreference.contains("2K") -> 1440
                          savedPreference.contains("1080") -> 1080
                          savedPreference.contains("720") -> 720
                          savedPreference.contains("480") -> 480
                          savedPreference.contains("360") -> 360
                          savedPreference.contains("240") -> 240
                          savedPreference.contains("144") -> 144
                          else -> 1080
                      }
                      for ((idx, opt) in options.withIndex()) {
                          val optRes = when {
                              opt.contains("2160") -> 2160
                              opt.contains("1440") -> 1440
                              opt.contains("1080") -> 1080
                              opt.contains("720") -> 720
                              opt.contains("480") -> 480
                              opt.contains("360") -> 360
                              opt.contains("240") -> 240
                              opt.contains("144") -> 144
                              else -> 0
                          }
                          if (optRes <= targetRes && optRes > 0) {
                              return idx
                          }
                      }
                      return 0
                  }
              }
          
              private fun updateSpinner() {
                  if (isLoadingFormats) {
                      showQualityLoading()
                      return
                  }
          
                  if (isAudio && !hasAudioTrack) {
                      qualityLabel.text = "Bitrate:"
                      qualitySpinner.adapter = ArrayAdapter(this, R.layout.item_spinner_selected, arrayOf("No audio track in this media"))
                      btnStartDownload.isEnabled = false
                      btnStartDownload.text = "⚠️ NO AUDIO STREAM"
                      btnStartDownload.setTextColor(android.graphics.Color.WHITE)
                      btnStartDownload.alpha = 0.5f
                      return
                  }
          
                  if (!isAudio && !hasVideoTrack) {
                      qualityLabel.text = "Resolution:"
                      qualitySpinner.adapter = ArrayAdapter(this, R.layout.item_spinner_selected, arrayOf("No video track in this media"))
                      btnStartDownload.isEnabled = false
                      btnStartDownload.text = "⚠️ NO VIDEO STREAM"
                      btnStartDownload.setTextColor(android.graphics.Color.WHITE)
                      btnStartDownload.alpha = 0.5f
                      return
                  }
          
                  val options = if (isAudio) detectedAudioQualities else detectedVideoQualities
                  qualityLabel.text = if (isAudio) "Bitrate:" else "Resolution:"
          
                  if (options.isEmpty()) {
                      val emptyMsg = if (isAudio) "No audio formats available" else "No video formats available"
                      val adapter = ArrayAdapter(this, R.layout.item_spinner_selected, arrayOf(emptyMsg))
                      qualitySpinner.adapter = adapter
                      btnStartDownload.isEnabled = false
                      btnStartDownload.alpha = 0.5f
                      return
                  }
          
                  btnStartDownload.isEnabled = true
                  btnStartDownload.alpha = 1.0f
                  btnStartDownload.text = "⬇ START DOWNLOAD"
                  btnStartDownload.setTextColor(android.graphics.Color.WHITE)
          
                  val adapter = object : ArrayAdapter<String>(this, R.layout.item_spinner_selected, options) {
                      override fun getDropDownView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val v = super.getDropDownView(position, convertView, parent)
                          if (v is TextView) {
                              v.setTextColor(android.graphics.Color.WHITE)
                              v.setBackgroundResource(R.drawable.bg_spinner_item_selector)
                          }
                          return v
                      }
          
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val v = super.getView(position, convertView, parent)
                          if (v is TextView) {
                              v.setTextColor(android.graphics.Color.WHITE)
                          }
                          return v
                      }
                  }
                  adapter.setDropDownViewResource(R.layout.item_spinner_dropdown)
                  qualitySpinner.adapter = adapter
          
                  // Match with user's saved quality preference
                  val savedQuality = prefs.getString(KEY_PREFERRED_QUALITY, "Best Available") ?: "Best Available"
                  val targetIndex = selectBestMatchingQuality(options, isAudio, savedQuality)
                  if (targetIndex in options.indices) {
                      qualitySpinner.setSelection(targetIndex)
                  }
              }
          
