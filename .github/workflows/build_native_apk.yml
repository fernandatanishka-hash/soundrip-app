                          val clipboard = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          val clip = clipboard.primaryClip?.getItemAt(0)?.text?.toString()?.trim()
                          if (!clip.isNullOrEmpty()) {
                              urlInput.setText(clip)
                              fetchThumbnailAndTitle(clip)
                          } else {
                              Toast.makeText(this, "Clipboard is empty. Copy a YouTube link first!", Toast.LENGTH_SHORT).show()
                          }
                      } else {
                          fetchThumbnailAndTitle(currentText)
                      }
                  }

                  // 1080p, 720p, 480p High-Definition Video Extraction
                  fun executeDownload() {
                      val url = urlInput.text.toString().trim()
                      val selectedQuality = qualitySpinner.selectedItem.toString()

                      showDownloaderState(2)
                      downloadingFormat.text = if (isAudio) "MP3 • $selectedQuality" else "MP4 • $selectedQuality"
                      circularProgressBar.progress = 0
                      txtCircularPercent.text = "0%"
                      linearProgressBar.progress = 0
                      txtDownloadStats.text = "Connecting to high-speed stream..."

                      thread {
                          try {
                              val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              val targetDir = File(publicDownloads, "FlowRip")
                              if (!targetDir.exists()) targetDir.mkdirs()

                              val request = YoutubeDLRequest(url)
                              request.addOption("--extractor-args", "youtube:player_client=android,web")
                              request.addOption("--no-check-certificates")
                              request.addOption("--no-update")

                              if (isAudio) {
                                  val bitrate = selectedQuality.split(" ")[0]
                                  request.addOption("-x")
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", bitrate)
                              } else {
                                  // CRITICAL FIX FOR 1080p / 720p BLURRINESS:
                                  // Download separate HD video track + audio track and merge with FFmpeg!
                                  when {
                                      selectedQuality.contains("1080p") -> {
                                          request.addOption("-f", "bestvideo[height<=1080]+bestaudio/bestvideo+bestaudio/best[height<=1080]/best")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      selectedQuality.contains("720p") -> {
                                          request.addOption("-f", "bestvideo[height<=720]+bestaudio/bestvideo+bestaudio/best[height<=720]/best")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      selectedQuality.contains("480p") -> {
                                          request.addOption("-f", "bestvideo[height<=480]+bestaudio/bestvideo+bestaudio/best[height<=480]/best")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      selectedQuality.contains("360p") -> {
                                          request.addOption("-f", "bestvideo[height<=360]+bestaudio/bestvideo+bestaudio/best[height<=360]/best")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                      else -> { // Best Available
                                          request.addOption("-f", "bestvideo+bestaudio/best")
                                          request.addOption("--merge-output-format", "mp4")
                                      }
                                  }
                              }
                              request.addOption("-o", "${targetDir.absolutePath}/%(title)s.%(ext)s")

                              YoutubeDL.getInstance().execute(request) { progress, _, _ ->
                                  runOnUiThread {
                                      val p = progress.toInt().coerceIn(1, 100)
                                      circularProgressBar.progress = p
                                      txtCircularPercent.text = "$p%"
                                      linearProgressBar.progress = p
                                      txtDownloadStats.text = "Downloading stream... $p%"
                                  }
                              }

                              val downloadedFiles = targetDir.listFiles()
                              val latestFile = downloadedFiles?.maxByOrNull { it.lastModified() }
                              lastDownloadedFile = latestFile

                              latestFile?.let { file ->
                                  MediaScannerConnection.scanFile(
                                      applicationContext,
                                      arrayOf(file.absolutePath),
                                      arrayOf(if (isAudio) "audio/mpeg" else "video/mp4"),
                                      null
                                  )
                              }

                              runOnUiThread {
                                  completedFileName.text = latestFile?.name ?: "Media File"
                                  showDownloaderState(3)
                                  Toast.makeText(this@MainActivity, "Download Complete!", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  Toast.makeText(this@MainActivity, "Download Error: ${e.message}", Toast.LENGTH_LONG).show()
                                  showDownloaderState(1)
                              }
                          }
                      }
                  }

                  btnStartDownload.setOnClickListener {
                      val url = urlInput.text.toString().trim()
                      if (url.isEmpty()) return@setOnClickListener

                      var adShown = false
                      try {
                          adShown = startAppAd?.showAd(object : AdDisplayListener {
                              override fun adHidden(ad: Ad?) {
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                              override fun adDisplayed(ad: Ad?) {}
                              override fun adClicked(ad: Ad?) {}
                              override fun adNotDisplayed(ad: Ad?) {
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                          }) ?: false
                      } catch (_: Exception) {}

                      if (!adShown) {
                          executeDownload()
                          startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                      }
                  }

                  btnPlayFile.setOnClickListener {
                      lastDownloadedFile?.let { playFile(it) } ?: Toast.makeText(this, "No file to play", Toast.LENGTH_SHORT).show()
                  }

                  btnSaveFile.setOnClickListener {
                      lastDownloadedFile?.let { shareFile(it) } ?: Toast.makeText(this, "File is saved in /Downloads/FlowRip", Toast.LENGTH_LONG).show()
                  }

                  btnCancel.setOnClickListener { showDownloaderState(1) }
                  btnDownloadAnother.setOnClickListener { urlInput.setText(""); currentVideoId = null; showDownloaderState(0) }
                  btnMenu.setOnClickListener { switchTab(2) }

                  findViewById<View>(R.id.settingRowQuality).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Preferred Download Quality")
                          .setItems(arrayOf("Best Available", "320 kbps (HQ) / 1080p", "192 kbps / 720p", "128 kbps / 480p")) { _, which ->
                              findViewById<TextView>(R.id.txtDefaultQuality).text = arrayOf("Best Available", "320 kbps (HQ) / 1080p", "192 kbps / 720p", "128 kbps / 480p")[which]
                          }.show()
                  }

                  findViewById<View>(R.id.settingRowFormat).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Default Format")
                          .setItems(arrayOf("MP3 (Audio Only)", "MP4 (Video)")) { _, which ->
                              findViewById<TextView>(R.id.txtDefaultFormat).text = if (which == 0) "MP3 (Audio)" else "MP4 (Video)"
                          }.show()
                  }

                  findViewById<View>(R.id.settingRowAbout).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("About FlowRip Studio")
                          .setMessage("FlowRip Studio v1.0.0\nHigh-Performance Native YouTube Downloader.\nPowered by yt-dlp & FFmpeg.")
                          .setPositiveButton("OK", null)
                          .show()
                  }

                  thread {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          try {
                              YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)
                          } catch (_: Exception) {}
                      } catch (_: Exception) {}
                  }
              }

              private fun playFile(file: File) {
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.provider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, if (file.name.endsWith(".mp3")) "audio/*" else "video/*")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(intent, "Play media with"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "File located at: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun shareFile(file: File) {
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.provider", file)
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = if (file.name.endsWith(".mp3")) "audio/*" else "video/*"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share media via"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "File located at: ${file.absolutePath}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun checkAndPromptStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this)
                              .setTitle("⚡ Storage Permission")
                              .setMessage("FlowRip needs storage access to save your downloaded MP3s and MP4s directly into your phone's Downloads folder.")
                              .setPositiveButton("Grant Access") { _, _ ->
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                          data = Uri.parse("package:$packageName")
                                      }
                                      startActivity(intent)
                                  } catch (e: Exception) {
                                      val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                      startActivity(intent)
                                  }
                              }
                              .setNegativeButton("Later", null)
                              .show()
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE),
                              101
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Native APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowRip-SamsungFixed-HD-v13-APK
          path: app/build/outputs/apk/**/*.apk
