name: Build FlowRip Studio Pro UI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate FlowRip Studio Project
        run: |
          mkdir -p app/src/main/java/com/soundrip/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 0. Official 3D FlowRip Logo & Launcher Icons
          python3 -c "import base64; open('app/src/main/res/drawable/ic_launcher_emblem.png', 'wb').write(base64.b64decode(''))"
          python3 -c "import base64; open('app/src/main/res/drawable/app_logo.png', 'wb').write(base64.b64decode(''))"

          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

