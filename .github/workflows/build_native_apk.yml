              private var toastHideRunnable: Runnable? = null
              private val toastHandler = Handler(Looper.getMainLooper())
          
              private fun showAppToast(message: String, isLong: Boolean = false) {
                  runOnUiThread {
                      try {
                          val container = findViewById<FrameLayout>(R.id.customToastContainer)
                          val textView = findViewById<TextView>(R.id.customToastText)
                          val iconView = findViewById<TextView>(R.id.customToastIcon)
                          if (container == null || textView == null) {
                              val t = Toast.makeText(this, message, if (isLong) Toast.LENGTH_LONG else Toast.LENGTH_SHORT)
                              val navHeight = findViewById<View>(R.id.bottomNavSection)?.height ?: dpToPx(130)
                              t.setGravity(Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL, 0, navHeight + dpToPx(24))
                              t.show()
                              return@runOnUiThread
                          }
          
                          toastHideRunnable?.let { toastHandler.removeCallbacks(it) }
          
                          textView.text = message
                          iconView?.text = when {
                              message.contains("❤️") || message.contains("Favorit") -> "❤️"
                              message.contains("Download", true) || message.contains("Descarg", true) -> "📥"
                              message.contains("Wi-Fi", true) || message.contains("WLAN", true) -> "📶"
                              message.contains("Language", true) || message.contains("Idioma", true) || message.contains("Sprache", true) -> "🌐"
                              message.contains("delete", true) || message.contains("elimina", true) || message.contains("lösch", true) -> "🗑️"
                              message.contains("Cannot", true) || message.contains("No ", true) || message.contains("Error", true) || message.contains("Failed", true) -> "⚠️"
                              else -> "✨"
                          }
          
                          container.visibility = View.VISIBLE
                          container.alpha = 0f
                          container.translationY = dpToPx(16).toFloat()
                          container.animate()
                              .alpha(1f)
                              .translationY(0f)
                              .setDuration(220L)
                              .setInterpolator(DecelerateInterpolator())
                              .start()
          
                          val durationMs = if (isLong) 3500L else 2200L
                          toastHideRunnable = Runnable {
                              container.animate()
                                  .alpha(0f)
                                  .translationY(dpToPx(12).toFloat())
                                  .setDuration(200L)
                                  .withEndAction { container.visibility = View.GONE }
                                  .start()
                          }
                          toastHandler.postDelayed(toastHideRunnable!!, durationMs)
                      } catch (e: Exception) {
                          val t = Toast.makeText(this, message, if (isLong) Toast.LENGTH_LONG else Toast.LENGTH_SHORT)
                          val navHeight = findViewById<View>(R.id.bottomNavSection)?.height ?: dpToPx(130)
                          t.setGravity(Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL, 0, navHeight + dpToPx(24))
                          t.show()
                      }
                  }
              }
          
