          package com.soundrip.app

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.os.Build
          import android.util.Log

          object NetworkHelper {
              private const val TAG = "NetworkHelper"
              private const val PREFS_NAME = "flowrip_prefs"
              const val KEY_WIFI_ONLY = "pref_wifi_only"

              fun isWifiOnlyEnabled(context: Context): Boolean {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  return prefs.getBoolean(KEY_WIFI_ONLY, false)
              }

              fun setWifiOnlyEnabled(context: Context, enabled: Boolean) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putBoolean(KEY_WIFI_ONLY, enabled).apply()
                  Log.d(TAG, "Wi-Fi Only setting persisted: $enabled")
              }

              fun isWifiConnected(context: Context): Boolean {
                  try {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager ?: return false
                      val activeNetwork = cm.activeNetwork ?: return false
                      val caps = cm.getNetworkCapabilities(activeNetwork) ?: return false

                      val hasInternet = caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      val isValidated = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
                      } else true
                      val isWifi = caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)

                      return hasInternet && isValidated && isWifi
                  } catch (e: Exception) {
                      Log.w(TAG, "Error checking Wi-Fi connectivity: ${e.message}")
                      return false
                  }
              }

              fun isInternetConnected(context: Context): Boolean {
                  try {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager ?: return false
                      val activeNetwork = cm.activeNetwork ?: return false
                      val caps = cm.getNetworkCapabilities(activeNetwork) ?: return false

                      val hasInternet = caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      val isValidated = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
                      } else true

                      return hasInternet && isValidated
                  } catch (e: Exception) {
                      Log.w(TAG, "Error checking internet connectivity: ${e.message}")
                      return false
                  }
              }

              fun isDownloadEligible(context: Context): Boolean {
                  return if (isWifiOnlyEnabled(context)) {
                      isWifiConnected(context)
                  } else {
                      isInternetConnected(context)
                  }
              }
          }
