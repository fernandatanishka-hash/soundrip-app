                      circularProgressBar.progress = p
                      txtCircularPercent.text = "$p%"
                      linearProgressBar.progress = p
                      txtDownloadSpeed.text = DownloadService.currentSpeed
                      txtDownloadSize.text = DownloadService.currentSizeInfo
                      txtDownloadEta.text = DownloadService.currentEta
                      txtDownloadStats.text = DownloadService.currentStatus
                  } else if (QueueManager.getPausedItem(this) != null) {
                      val paused = QueueManager.getPausedItem(this)!!
                      showDownloaderState(2)
                      updatePauseResumeButton(isPaused = true)
                      downloadingTitle.text = paused.title
                      downloadingFormat.text = "${paused.format} • ${paused.quality}"
                      circularProgressBar.progress = paused.progress
                      txtCircularPercent.text = "${paused.progress}%"
