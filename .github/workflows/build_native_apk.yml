name: Build FlowRip with Full Screen Ads & Downloads

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate FlowRip Android Project
        run: |
          mkdir -p app/src/main/java/com/soundrip/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. FlowRip Brand Vector Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#121212"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:strokeColor="#1ED760"
                  android:strokeWidth="2.8"
                  android:pathData="M54,18 A36,36 0 1,1 53.9,18 Z"/>
              <path
                  android:fillColor="#1ED760"
                  android:pathData="M34,46 L38,46 L38,62 L34,62 Z M42,38 L46,38 L46,70 L42,70 Z"/>
              <path
                  android:fillColor="#1ED760"
                  android:pathData="M50,34 L58,34 L58,58 L68,58 L54,76 L40,58 L50,58 Z"/>
              <path
                  android:fillColor="#1ED760"
                  android:pathData="M70,42 L74,42 L74,66 L70,66 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # 2. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 3. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "FlowRip"
          include ':app'
          EOF

          # 4. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 5. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.soundrip.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.soundrip.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName "4.0"

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.cardview:cardview:1.0.0'

              // yt-dlp & FFmpeg
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

              // Start.io Monetization SDK
              implementation 'com.startapp:inapp-sdk:5.1.0'
          }
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">FlowRip</string>
          </resources>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 8. High-Contrast Spinner Layouts
          cat << 'EOF' > app/src/main/res/layout/item_spinner_selected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="8dp"
              android:textColor="#FFFFFF"
              android:textSize="14sp"
              android:textStyle="bold" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_spinner_dropdown.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="14dp"
              android:background="#222222"
              android:textColor="#FFFFFF"
              android:textSize="14sp"
              android:textStyle="bold" />
          EOF

          # 9. activity_main.xml Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212">

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/bannerContainer"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:layout_marginTop="8dp"
                          android:layout_marginBottom="20dp">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="FlowRip"
                              android:textColor="#FFFFFF"
                              android:textSize="26sp"
                              android:textStyle="bold" />

                          <Button
                              android:id="@+id/btnShareApp"
                              android:layout_width="wrap_content"
                              android:layout_height="38dp"
                              android:text="🔗 Share"
                              android:textColor="#1ED760"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:backgroundTint="#1F2E23"
                              app:cornerRadius="10dp" />
                      </LinearLayout>

                      <androidx.cardview.widget.CardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardBackgroundColor="#181818"
                          app:cardCornerRadius="14dp"
                          app:cardElevation="0dp"
                          android:layout_marginBottom="14dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:padding="6dp">

                              <EditText
                                  android:id="@+id/urlInput"
                                  android:layout_width="0dp"
                                  android:layout_height="48dp"
                                  android:layout_weight="1"
                                  android:hint="Paste YouTube or Music link..."
                                  android:textColorHint="#686868"
                                  android:textColor="#FFFFFF"
                                  android:background="@null"
                                  android:paddingStart="12dp"
                                  android:paddingEnd="8dp"
                                  android:textSize="14sp"
                                  android:inputType="textUri" />

                              <Button
                                  android:id="@+id/pasteBtn"
                                  android:layout_width="wrap_content"
                                  android:layout_height="40dp"
                                  android:text="PASTE"
                                  android:textColor="#000000"
                                  android:textStyle="bold"
                                  android:textSize="12sp"
                                  android:backgroundTint="#1ED760"
                                  app:cornerRadius="10dp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <androidx.cardview.widget.CardView
                          android:id="@+id/previewCard"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardBackgroundColor="#181818"
                          app:cardCornerRadius="16dp"
                          app:cardElevation="0dp"
                          android:visibility="gone"
                          android:layout_marginBottom="16dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="12dp">

                              <androidx.cardview.widget.CardView
                                  android:layout_width="match_parent"
                                  android:layout_height="180dp"
                                  app:cardCornerRadius="12dp"
                                  app:cardElevation="0dp">

                                  <ImageView
                                      android:id="@+id/videoThumbnail"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:scaleType="centerCrop"
                                      android:background="#242424" />
                              </androidx.cardview.widget.CardView>

                              <TextView
                                  android:id="@+id/videoTitle"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="Loading title..."
                                  android:textColor="#FFFFFF"
                                  android:textSize="15sp"
                                  android:textStyle="bold"
                                  android:maxLines="2"
                                  android:ellipsize="end"
                                  android:layout_marginTop="10dp" />

                              <TextView
                                  android:id="@+id/videoAuthor"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="YouTube Artist"
                                  android:textColor="#1ED760"
                                  android:textSize="12sp"
                                  android:layout_marginTop="3dp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:layout_marginBottom="14dp">

                          <Button
                              android:id="@+id/btnAudio"
                              android:layout_width="0dp"
                              android:layout_height="48dp"
                              android:layout_weight="1"
                              android:text="🎵 MP3 AUDIO"
                              android:textStyle="bold"
                              android:textColor="#000000"
                              android:backgroundTint="#1ED760"
                              app:cornerRadius="12dp"
                              android:layout_marginEnd="6dp" />

                          <Button
                              android:id="@+id/btnVideo"
                              android:layout_width="0dp"
                              android:layout_height="48dp"
                              android:layout_weight="1"
                              android:text="🎬 MP4 VIDEO"
                              android:textStyle="bold"
                              android:textColor="#A7A7A7"
                              android:backgroundTint="#242424"
                              app:cornerRadius="12dp"
                              android:layout_marginStart="6dp" />
                      </LinearLayout>

                      <androidx.cardview.widget.CardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardBackgroundColor="#181818"
                          app:cardCornerRadius="14dp"
                          app:cardElevation="0dp"
                          android:layout_marginBottom="16dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:padding="12dp">

                              <TextView
                                  android:id="@+id/qualityLabel"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Quality:"
                                  android:textColor="#B3B3B3"
                                  android:textSize="13sp"
                                  android:textStyle="bold"
                                  android:layout_marginEnd="12dp" />

                              <Spinner
                                  android:id="@+id/qualitySpinner"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:popupBackground="#222222" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <ProgressBar
                          android:id="@+id/progressBar"
                          style="?android:attr/progressBarStyleHorizontal"
                          android:layout_width="match_parent"
                          android:layout_height="6dp"
                          android:layout_marginBottom="14dp"
                          android:visibility="gone"
                          android:progressBackgroundTint="#282828"
                          android:progressTint="#1ED760" />

                      <Button
                          android:id="@+id/downloadBtn"
                          android:layout_width="match_parent"
                          android:layout_height="56dp"
                          android:text="⚡ DOWNLOAD TO PHONE"
                          android:textColor="#000000"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          android:backgroundTint="#1ED760"
                          app:cornerRadius="28dp"
                          android:layout_marginBottom="14dp" />

                      <TextView
                          android:id="@+id/statusText"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="⚡ Ready to download"
                          android:textColor="#1ED760"
                          android:textSize="12sp"
                          android:gravity="center" />

                  </LinearLayout>
              </ScrollView>

              <FrameLayout
                  android:id="@+id/bannerContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:background="#121212" />

          </RelativeLayout>
          EOF

          # 10. MainActivity.kt with Pre-loaded Full-Screen Video / Interstitial Ad
          cat << 'EOF' > app/src/main/java/com/soundrip/app/MainActivity.kt
          package com.soundrip.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.BitmapFactory
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.startapp.sdk.adsbase.Ad
          import com.startapp.sdk.adsbase.StartAppAd
          import com.startapp.sdk.adsbase.StartAppSDK
          import com.startapp.sdk.adsbase.adlisteners.AdDisplayListener
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener
          import com.startapp.sdk.ads.banner.Banner
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import com.yausername.ffmpeg.FFmpeg
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.regex.Pattern
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private var isAudio = true
              private val audioQualities = arrayOf("320 kbps (HQ Audio)", "256 kbps", "192 kbps (Standard)", "128 kbps (Fast)")
              private val videoQualities = arrayOf("Best Available", "1080p (Full HD)", "720p (HD)", "480p", "360p")
              private var currentVideoId: String? = null
              private var startAppAd: StartAppAd? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  // 1. Initialize Start.io Ads Engine in Test Mode
                  try {
                      StartAppSDK.init(this, "208492019", false)
                      StartAppSDK.setTestAdsEnabled(true)
                      startAppAd = StartAppAd(this)

                      // PRE-LOAD the full-screen ad right now so it's instantly ready when user taps download!
                      startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC, object : AdEventListener {
                          override fun onReceiveAd(ad: Ad) {}
                          override fun onFailedToReceiveAd(ad: Ad?) {}
                      })

                      // Attach Bottom Banner
                      val bannerContainer = findViewById<FrameLayout>(R.id.bannerContainer)
                      val banner = Banner(this)
                      bannerContainer.addView(banner)
                  } catch (_: Exception) {}

                  checkAndPromptStoragePermission()

                  val statusText = findViewById<TextView>(R.id.statusText)
                  val urlInput = findViewById<EditText>(R.id.urlInput)
                  val pasteBtn = findViewById<Button>(R.id.pasteBtn)
                  val btnAudio = findViewById<Button>(R.id.btnAudio)
                  val btnVideo = findViewById<Button>(R.id.btnVideo)
                  val downloadBtn = findViewById<Button>(R.id.downloadBtn)
                  val progressBar = findViewById<ProgressBar>(R.id.progressBar)
                  val qualityLabel = findViewById<TextView>(R.id.qualityLabel)
                  val qualitySpinner = findViewById<Spinner>(R.id.qualitySpinner)
                  val previewCard = findViewById<View>(R.id.previewCard)
                  val videoThumbnail = findViewById<ImageView>(R.id.videoThumbnail)
                  val videoTitle = findViewById<TextView>(R.id.videoTitle)
                  val videoAuthor = findViewById<TextView>(R.id.videoAuthor)
                  val btnShareApp = findViewById<Button>(R.id.btnShareApp)

                  btnShareApp.setOnClickListener {
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_SUBJECT, "Check out FlowRip!")
                          putExtra(Intent.EXTRA_TEXT, "Download any YouTube song or video in 320kbps & 1080p with FlowRip! Get it free here: https://github.com/fernandatanishka-hash/soundrip-app/releases")
                      }
                      startActivity(Intent.createChooser(shareIntent, "Share FlowRip via"))
                  }

                  fun updateSpinner() {
                      val options = if (isAudio) audioQualities else videoQualities
                      qualityLabel.text = if (isAudio) "Audio Bitrate:" else "Video Quality:"
                      
                      val adapter = ArrayAdapter(this, R.layout.item_spinner_selected, options)
                      adapter.setDropDownViewResource(R.layout.item_spinner_dropdown)
                      qualitySpinner.adapter = adapter
                  }
                  updateSpinner()

                  fun fetchThumbnailAndTitle(url: String) {
                      val regex = "(?:v=|youtu\\.be/|shorts/|embed/)([a-zA-Z0-9_-]{11})"
                      val matcher = Pattern.compile(regex).matcher(url)
                      if (matcher.find()) {
                          val videoId = matcher.group(1) ?: return
                          if (videoId == currentVideoId) return
                          currentVideoId = videoId

                          previewCard.visibility = View.VISIBLE
                          videoTitle.text = "Loading title..."
                          videoAuthor.text = "Fetching details..."

                          thread {
                              try {
                                  val thumbUrl = "https://img.youtube.com/vi/$videoId/hqdefault.jpg"
                                  val connection = URL(thumbUrl).openConnection() as HttpURLConnection
                                  connection.doInput = true
                                  connection.connect()
                                  val input = connection.inputStream
                                  val bitmap = BitmapFactory.decodeStream(input)
                                  runOnUiThread {
                                      videoThumbnail.setImageBitmap(bitmap)
                                  }
                              } catch (_: Exception) {}
                          }

                          thread {
                              try {
                                  val oembedUrl = "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$videoId&format=json"
                                  val conn = URL(oembedUrl).openConnection() as HttpURLConnection
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                                  val reader = BufferedReader(InputStreamReader(conn.inputStream))
                                  val resp = reader.readText()
                                  reader.close()

                                  val json = JSONObject(resp)
                                  val title = json.optString("title", "YouTube Media")
                                  val author = json.optString("author_name", "YouTube Creator")

                                  runOnUiThread {
                                      videoTitle.text = title
                                      videoAuthor.text = author
                                  }
                              } catch (_: Exception) {
                                  runOnUiThread {
                                      videoTitle.text = "YouTube Media"
                                      videoAuthor.text = "Ready to download"
                                  }
                              }
                          }
                      }
                  }

                  urlInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {
                          val text = s?.toString()?.trim() ?: ""
                          if (text.contains("youtu")) {
                              fetchThumbnailAndTitle(text)
                          }
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })

                  pasteBtn.setOnClickListener {
                      val clipboard = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                      val item = clipboard.primaryClip?.getItemAt(0)
                      item?.text?.let {
                          urlInput.setText(it)
                          fetchThumbnailAndTitle(it.toString())
                      }
                  }

                  btnAudio.setOnClickListener {
                      isAudio = true
                      btnAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#1ED760"))
                      btnAudio.setTextColor(android.graphics.Color.BLACK)
                      btnVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#242424"))
                      btnVideo.setTextColor(android.graphics.Color.parseColor("#A7A7A7"))
                      updateSpinner()
                  }

                  btnVideo.setOnClickListener {
                      isAudio = false
                      btnVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#1ED760"))
                      btnVideo.setTextColor(android.graphics.Color.BLACK)
                      btnAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#242424"))
                      btnAudio.setTextColor(android.graphics.Color.parseColor("#A7A7A7"))
                      updateSpinner()
                  }

                  thread {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          try {
                              YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)
                          } catch (_: Exception) {}
                          runOnUiThread { statusText.text = "⚡ Engine Ready" }
                      } catch (_: Exception) {}
                  }

                  // Function to start the actual download process
                  fun executeDownload() {
                      val url = urlInput.text.toString().trim()
                      val selectedQuality = qualitySpinner.selectedItem.toString()

                      downloadBtn.isEnabled = false
                      downloadBtn.text = "DOWNLOADING..."
                      progressBar.visibility = View.VISIBLE
                      statusText.text = "FlowRip engine downloading stream..."

                      thread {
                          try {
                              val publicDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              val targetDir = File(publicDownloads, "FlowRip")
                              if (!targetDir.exists()) targetDir.mkdirs()

                              val request = YoutubeDLRequest(url)
                              request.addOption("--extractor-args", "youtube:player_client=android,web")
                              request.addOption("--no-check-certificates")
                              request.addOption("--no-update")

                              if (isAudio) {
                                  val bitrate = selectedQuality.split(" ")[0]
                                  request.addOption("-x")
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", bitrate)
                              } else {
                                  when {
                                      selectedQuality.contains("1080p") -> request.addOption("-f", "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]")
                                      selectedQuality.contains("720p") -> request.addOption("-f", "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]")
                                      selectedQuality.contains("480p") -> request.addOption("-f", "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]")
                                      selectedQuality.contains("360p") -> request.addOption("-f", "bestvideo[height<=360][ext=mp4]+bestaudio[ext=m4a]/best[height<=360]")
                                      else -> request.addOption("-f", "best[ext=mp4]/best")
                                  }
                              }
                              request.addOption("-o", "${targetDir.absolutePath}/%(title)s.%(ext)s")

                              YoutubeDL.getInstance().execute(request) { progress, _, _ ->
                                  runOnUiThread {
                                      progressBar.progress = progress.toInt()
                                      statusText.text = "Downloading: ${progress.toInt()}%"
                                  }
                              }

                              val downloadedFiles = targetDir.listFiles()
                              val latestFile = downloadedFiles?.maxByOrNull { it.lastModified() }
                              latestFile?.let { file ->
                                  MediaScannerConnection.scanFile(
                                      applicationContext,
                                      arrayOf(file.absolutePath),
                                      arrayOf(if (isAudio) "audio/mpeg" else "video/mp4"),
                                      null
                                  )
                              }

                              runOnUiThread {
                                  downloadBtn.isEnabled = true
                                  downloadBtn.text = "⚡ DOWNLOAD TO PHONE"
                                  progressBar.visibility = View.GONE
                                  statusText.text = "✅ Saved to Downloads/FlowRip folder!"
                                  Toast.makeText(this@MainActivity, "Download Complete!", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  downloadBtn.isEnabled = true
                                  downloadBtn.text = "⚡ DOWNLOAD TO PHONE"
                                  progressBar.visibility = View.GONE
                                  statusText.text = "Error: ${e.message}"
                              }
                          }
                      }
                  }

                  downloadBtn.setOnClickListener {
                      val url = urlInput.text.toString().trim()
                      if (url.isEmpty()) {
                          Toast.makeText(this, "Please paste a link first", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      // Show the pre-cached Full-Screen Ad!
                      var adShown = false
                      try {
                          adShown = startAppAd?.showAd(object : AdDisplayListener {
                              override fun adHidden(ad: Ad?) {
                                  // User closed the ad -> Start download!
                                  executeDownload()
                                  // Pre-load the next ad
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                              override fun adDisplayed(ad: Ad?) {}
                              override fun adClicked(ad: Ad?) {}
                              override fun adNotDisplayed(ad: Ad?) {
                                  // If ad failed to display, don't freeze the user -> Start download directly
                                  executeDownload()
                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                          }) ?: false
                      } catch (_: Exception) {}

                      // If ad was not ready yet, proceed to download directly and load next ad
                      if (!adShown) {
                          executeDownload()
                          startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                      }
                  }
              }

              private fun checkAndPromptStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this)
                              .setTitle("⚡ Storage Permission")
                              .setMessage("FlowRip needs storage access to save downloaded MP3s and MP4s directly into your phone's Downloads folder.")
                              .setPositiveButton("Grant Access") { _, _ ->
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                          data = Uri.parse("package:$packageName")
                                      }
                                      startActivity(intent)
                                  } catch (e: Exception) {
                                      val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                      startActivity(intent)
                                  }
                              }
                              .setNegativeButton("Later", null)
                              .show()
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE),
                              101
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Native APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowRip-FullMonetized-APK
          path: app/build/outputs/apk/**/*.apk
