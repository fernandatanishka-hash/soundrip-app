              private fun renderHistoryUI() {
                  if (!::historyListContainer.isInitialized) return
                  historyListContainer.removeAllViews()
          
                  val sortOrder = StorageHelper.getHistorySortOrder(this)
                  val searchQuery = historySearchInput.text.toString().trim()
                  val favSet = prefs.getStringSet("flowrip_favorites_set", emptySet()) ?: emptySet()
                  val filtered = if (historyFilter == "FAVORITES") {
                      val favItems = cachedHistoryItems.filter { item ->
                          val key = item.id.ifEmpty { item.name }
                          favSet.contains(key)
                      }
                      StorageHelper.filterAndSortHistory(favItems, "ALL", searchQuery, sortOrder)
                  } else {
                      StorageHelper.filterAndSortHistory(cachedHistoryItems, historyFilter, searchQuery, sortOrder)
                  }
          
                  if (::txtHistoryCount.isInitialized) {
                      txtHistoryCount.text = "${filtered.size} ${if (filtered.size == 1) "file" else "files"}"
