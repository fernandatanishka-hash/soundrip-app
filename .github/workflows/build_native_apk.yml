                                              android:textSize="11sp"
                                              android:layout_marginTop="4dp" />
                                      </LinearLayout>
                                  </LinearLayout>

                                  <!-- Quality Dropdown -->
                                  <TextView
                                      android:id="@+id/qualityLabel"
