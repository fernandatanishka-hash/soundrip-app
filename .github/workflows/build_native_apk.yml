                                  startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                              }
                          }) ?: false
                      } catch (e: Exception) {}

                      if (!adShown) {
                          startDownloadFlow()
                          startAppAd?.loadAd(StartAppAd.AdMode.AUTOMATIC)
                      }
                  }

                  btnPlayFile.setOnClickListener {
                      lastDownloadedFile?.let { playFile(it) } ?: Toast.makeText(this, "No file to play", Toast.LENGTH_SHORT).show()
                  }

                  btnSaveFile.setOnClickListener {
                      lastDownloadedFile?.let { shareFile(it) } ?: Toast.makeText(this, "File is saved in /Downloads/FlowRip", Toast.LENGTH_LONG).show()
                  }

                  btnPauseResume.setOnClickListener {
                      if (DownloadService.isDownloading) {
                          QueueManager.pauseActiveItem(this, PauseReason.MANUAL)
                      } else {
                          val paused = QueueManager.getPausedItem(this)
                          if (paused != null) {
                              if (NetworkHelper.isWifiOnlyEnabled(this) && !NetworkHelper.isWifiConnected(this)) {
                                  Toast.makeText(this, "Cannot resume download: Wi-Fi connection required (Wi-Fi Only is ON).", Toast.LENGTH_LONG).show()
                              } else {
                                  QueueManager.resumeItem(this, paused.id)
                              }
                          }
                      }
                  }

                  btnCancel.setOnClickListener {
                      val cancelIntent = Intent(this@MainActivity, DownloadService::class.java).apply {
                          action = DownloadService.ACTION_CANCEL
                      }
                      startService(cancelIntent)
                      showDownloaderState(1)
                  }

                  btnDownloadAnother.setOnClickListener {
                      urlInput.setText("")
                      currentVideoId = null
                      lastFormatDetectionUrl = null
                      lastFormatErrorUrl = null
                      activeDetectionUrl = null
                      activeDetectionJobId = System.currentTimeMillis()
                      hideQualityLoading()
                      showDownloaderState(0)
                  }

                  btnMenu.setOnClickListener { switchTab(2) }

                  // Retry & Dismiss actions
                  btnRetryDownload.setOnClickListener {
                      if (lastFormatErrorUrl != null && !DownloadService.isDownloading) {
                          inspectUrlAndDetectFormats(lastFormatErrorUrl!!, forceRefresh = true)
                          return@setOnClickListener
                      }
                      val retryUrl = DownloadService.lastFailedUrl.ifEmpty { urlInput.text.toString().trim() }
                      val retryTitle = DownloadService.lastFailedTitle.ifEmpty { downloadingTitle.text.toString() }
                      val retryIsAudio = DownloadService.lastFailedIsAudio
                      val retryQuality = DownloadService.lastFailedQuality.ifEmpty { qualitySpinner.selectedItem?.toString() ?: "Best" }

                      if (retryUrl.isNotEmpty() && !DownloadService.isDownloading) {
                          executeDownloadTask(retryUrl, retryTitle, retryIsAudio, retryQuality)
                      }
                  }

                  btnDismissError.setOnClickListener {
                      lastFormatErrorUrl = null
                      showDownloaderState(if (urlInput.text.isNotEmpty()) 1 else 0)
                  }

                  // Persistent Settings Dialogs
                  findViewById<View>(R.id.settingRowQuality).setOnClickListener {
                      val qualityOptions = arrayOf("Best Available", "320 kbps (HQ) / 1080p", "192 kbps / 720p", "128 kbps / 480p")
                      AlertDialog.Builder(this)
                          .setTitle("Preferred Download Quality")
                          .setItems(qualityOptions) { _, which ->
                              val chosen = qualityOptions[which]
                              txtDefaultQuality.text = chosen
                              prefs.edit().putString(KEY_PREFERRED_QUALITY, chosen).apply()
                              updateSpinner()
                              Toast.makeText(this, "Default quality set to $chosen", Toast.LENGTH_SHORT).show()
                          }.show()
                  }

                  findViewById<View>(R.id.settingRowFormat).setOnClickListener {
                      val formatOptions = arrayOf("MP3 (Audio Only)", "MP4 (Video)")
                      AlertDialog.Builder(this)
                          .setTitle("Default Format")
                          .setItems(formatOptions) { _, which ->
                              val isMp3 = (which == 0)
                              val chosenFormat = if (isMp3) "MP3" else "MP4"
                              txtDefaultFormat.text = formatOptions[which]
                              prefs.edit().putString(KEY_DEFAULT_FORMAT, chosenFormat).apply()
                              setFormatSelection(isMp3)
                              Toast.makeText(this, "Default format set to ${formatOptions[which]}", Toast.LENGTH_SHORT).show()
                          }.show()
                  }

                  findViewById<View>(R.id.settingRowAbout).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("About FlowRip Studio")
                          .setMessage("FlowRip Studio v20.0 (Stage 2)\nHigh-Performance Native YouTube Downloader.\nPowered by yt-dlp & FFmpeg.")
                          .setPositiveButton("OK", null)
                          .show()
                  }

                  handleIncomingIntent(intent)

                  thread {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          try {
                              YoutubeDL.getInstance().updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)
                          } catch (e: Exception) {}
                      } catch (e: Exception) {}
                  }
              }

