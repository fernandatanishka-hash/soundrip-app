                      chipAll.setTextColor(android.graphics.Color.WHITE)
                      chipAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
                      chipAudio.setTextColor(android.graphics.Color.parseColor("#64748B"))
                      chipVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
                      chipVideo.setTextColor(android.graphics.Color.parseColor("#64748B"))
                      refreshHistory()
                  }

                  chipAudio.setOnClickListener {
                      historyFilter = "AUDIO"
                      chipAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#4F46E5"))
                      chipAudio.setTextColor(android.graphics.Color.WHITE)
                      chipAll.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
                      chipAll.setTextColor(android.graphics.Color.parseColor("#64748B"))
                      chipVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
                      chipVideo.setTextColor(android.graphics.Color.parseColor("#64748B"))
                      refreshHistory()
                  }

                  chipVideo.setOnClickListener {
                      historyFilter = "VIDEO"
                      chipVideo.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#4F46E5"))
                      chipVideo.setTextColor(android.graphics.Color.WHITE)
                      chipAll.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
                      chipAll.setTextColor(android.graphics.Color.parseColor("#64748B"))
                      chipAudio.backgroundTintList = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
