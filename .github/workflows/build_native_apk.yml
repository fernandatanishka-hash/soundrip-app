              private fun applyThemeToViewHierarchy(view: View, isDark: Boolean) {
                  val textPrimary = if (isDark) android.graphics.Color.WHITE else android.graphics.Color.parseColor("#0F172A")
                  val textSecondary = if (isDark) android.graphics.Color.parseColor("#94A3B8") else android.graphics.Color.parseColor("#475569")
                  val bgCard = if (isDark) android.graphics.Color.parseColor("#13192B") else android.graphics.Color.parseColor("#FFFFFF")
                  val dividerColor = if (isDark) android.graphics.Color.parseColor("#1E293B") else android.graphics.Color.parseColor("#E2E8F0")
          
                  if (view is android.widget.CompoundButton) return
                  if (view.tag == "keep_color") return
          
                  if (view.javaClass == View::class.java && (view.layoutParams?.height == 1 || view.layoutParams?.height == (view.resources.displayMetrics.density * 1).toInt())) {
                      view.setBackgroundColor(dividerColor)
                  }
          
                  when (view) {
                      is TextView -> {
                          val tag = view.tag as? String
                          val id = view.id
                          if (tag != "keep_color" && id != R.id.btnProCrown && id != R.id.btnMainAction &&
                              id != R.id.chipAll && id != R.id.chipVideo && id != R.id.chipAudio && id != R.id.chipFavorites && id != R.id.chipFavAll && id != R.id.chipFavVideos && id != R.id.chipFavAudio &&
                              id != R.id.txtAppTitleHeader && id != R.id.txtAppSubtitleHeader &&
                              id != R.id.btnChangeLocation && id != R.id.btnResetLocation &&
                              id != R.id.iconQuickSettings && id != R.id.btnPauseResume && id != R.id.btnCancel && id != R.id.btnSaveFile && id != R.id.btnStartDownload) {
                              val current = view.currentTextColor
                              if (current == android.graphics.Color.WHITE || current == android.graphics.Color.parseColor("#0F172A") || current == android.graphics.Color.parseColor("#F8FAFC")) {
                                  view.setTextColor(textPrimary)
                              } else if (current == android.graphics.Color.parseColor("#94A3B8") || current == android.graphics.Color.parseColor("#64748B") || current == android.graphics.Color.parseColor("#475569")) {
                                  view.setTextColor(textSecondary)
                              }
                          }
                      }
                      is EditText -> {
                          view.setTextColor(textPrimary)
                          view.setHintTextColor(if (isDark) android.graphics.Color.parseColor("#64748B") else android.graphics.Color.parseColor("#94A3B8"))
                      }
                      is androidx.cardview.widget.CardView -> {
                          val tag = view.tag as? String
                          if (tag != "keep_color") {
                              val lp = view.layoutParams
                              val isIconBubble = (lp != null && lp.width > 0 && lp.width <= 50 * view.resources.displayMetrics.density)
                              if (isIconBubble) {
                                  view.setCardBackgroundColor(if (isDark) android.graphics.Color.parseColor("#1E293B") else android.graphics.Color.parseColor("#F1F5F9"))
                              } else {
                                  view.setCardBackgroundColor(bgCard)
                              }
                          }
                      }
                  }
          
                  if (view is ViewGroup) {
                      for (i in 0 until view.childCount) {
                          applyThemeToViewHierarchy(view.getChildAt(i), isDark)
                      }
                  }
              }
          
