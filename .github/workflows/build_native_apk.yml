          package com.soundrip.app

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.util.Log
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.UUID

          enum class QueueStatus {
              QUEUED,
              DOWNLOADING,
              PAUSED,
              COMPLETED,
              FAILED,
              CANCELLED
          }

          enum class PauseReason {
              NONE,
              MANUAL,
              WAITING_WIFI
          }

          data class QueueItem(
              val id: String = UUID.randomUUID().toString(),
              val url: String,
              var title: String,
              val format: String,
              val quality: String,
              val isAudio: Boolean,
              var status: QueueStatus = QueueStatus.QUEUED,
              var pauseReason: PauseReason = PauseReason.NONE,
              var progress: Int = 0,
              var speed: String = "--",
              var eta: String = "--",
              var sizeInfo: String = "--",
              var error: String? = null,
              val timestamp: Long = System.currentTimeMillis()
          ) {
              fun toJson(): JSONObject {
                  val obj = JSONObject()
                  obj.put("id", id)
                  obj.put("url", url)
                  obj.put("title", title)
                  obj.put("format", format)
                  obj.put("quality", quality)
                  obj.put("isAudio", isAudio)
                  obj.put("status", status.name)
                  obj.put("pauseReason", pauseReason.name)
                  obj.put("progress", progress)
                  obj.put("speed", speed)
                  obj.put("eta", eta)
                  obj.put("sizeInfo", sizeInfo)
                  obj.put("error", error ?: "")
                  obj.put("timestamp", timestamp)
                  return obj
              }

              companion object {
                  fun fromJson(obj: JSONObject): QueueItem {
                      val statusStr = obj.optString("status", "QUEUED")
                      val parsedStatus = try {
                          QueueStatus.valueOf(statusStr)
                      } catch (e: Exception) {
                          QueueStatus.QUEUED
                      }
                      val pauseReasonStr = obj.optString("pauseReason", "NONE")
                      val parsedReason = try {
                          PauseReason.valueOf(pauseReasonStr)
                      } catch (e: Exception) {
                          PauseReason.NONE
                      }
                      return QueueItem(
                          id = obj.optString("id", UUID.randomUUID().toString()),
                          url = obj.optString("url", ""),
                          title = obj.optString("title", "Media File"),
                          format = obj.optString("format", "MP3"),
                          quality = obj.optString("quality", "Best"),
                          isAudio = obj.optBoolean("isAudio", true),
                          status = parsedStatus,
                          pauseReason = parsedReason,
                          progress = obj.optInt("progress", 0),
                          speed = obj.optString("speed", "--"),
                          eta = obj.optString("eta", "--"),
                          sizeInfo = obj.optString("sizeInfo", "--"),
                          error = obj.optString("error").takeIf { it.isNotEmpty() },
                          timestamp = obj.optLong("timestamp", System.currentTimeMillis())
                      )
                  }
              }
          }

          object QueueManager {
              private const val TAG = "QueueManager"
              private const val PREFS_NAME = "flowrip_queue_prefs"
              private const val KEY_QUEUE = "key_queue_items_json"

              private val queueItems = mutableListOf<QueueItem>()
              private var isLoaded = false
              private val listeners = mutableListOf<() -> Unit>()

              @Synchronized
              fun addListener(listener: () -> Unit) {
                  if (!listeners.contains(listener)) {
                      listeners.add(listener)
                  }
              }

              @Synchronized
              fun removeListener(listener: () -> Unit) {
                  listeners.remove(listener)
              }

              fun notifyListeners() {
                  val copy = synchronized(this) { listeners.toList() }
                  copy.forEach {
                      try {
                          it.invoke()
                      } catch (e: Exception) {
                          Log.e(TAG, "Listener error: ${e.message}")
                      }
                  }
              }

              @Synchronized
              fun loadQueue(context: Context) {
                  if (isLoaded) return
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val jsonStr = prefs.getString(KEY_QUEUE, null)
                  queueItems.clear()
                  if (!jsonStr.isNullOrEmpty()) {
                      try {
                          val array = JSONArray(jsonStr)
                          for (i in 0 until array.length()) {
                              val item = QueueItem.fromJson(array.getJSONObject(i))
                              // If process was killed while downloading, restore safely as PAUSED
                              if (item.status == QueueStatus.DOWNLOADING) {
                                  item.status = QueueStatus.PAUSED
                                  val wifiOnly = NetworkHelper.isWifiOnlyEnabled(context)
                                  val wifiConnected = NetworkHelper.isWifiConnected(context)
                                  item.pauseReason = if (wifiOnly && !wifiConnected) PauseReason.WAITING_WIFI else PauseReason.MANUAL
                                  item.speed = "--"
                                  item.eta = "--"
                              }
                              queueItems.add(item)
                          }
                      } catch (e: Exception) {
                          Log.e(TAG, "Failed to load queue from storage: ${e.message}")
                      }
                  }
                  isLoaded = true
              }

              @Synchronized
              fun saveQueue(context: Context) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val array = JSONArray()
                  queueItems.forEach { array.put(it.toJson()) }
                  prefs.edit().putString(KEY_QUEUE, array.toString()).apply()
              }

              @Synchronized
              fun getItems(context: Context): List<QueueItem> {
                  loadQueue(context)
                  return queueItems.toList()
              }

              @Synchronized
              fun getItem(context: Context, id: String): QueueItem? {
                  loadQueue(context)
                  return queueItems.find { it.id == id }
              }

              @Synchronized
              fun getActiveItem(context: Context): QueueItem? {
                  loadQueue(context)
                  return queueItems.find { it.status == QueueStatus.DOWNLOADING }
              }

              @Synchronized
              fun getPausedItem(context: Context): QueueItem? {
                  loadQueue(context)
                  return queueItems.find { it.status == QueueStatus.PAUSED }
              }

              @Synchronized
              fun getWaitingWifiItem(context: Context): QueueItem? {
                  loadQueue(context)
                  return queueItems.find { it.status == QueueStatus.PAUSED && it.pauseReason == PauseReason.WAITING_WIFI }
              }

              @Synchronized
              fun getNextEligibleItem(context: Context): QueueItem? {
                  loadQueue(context)
                  // If an item is currently PAUSED or DOWNLOADING, sequential queue must NOT advance
                  if (queueItems.any { it.status == QueueStatus.PAUSED || it.status == QueueStatus.DOWNLOADING }) {
                      return null
                  }
                  // Wi-Fi Only constraint check
                  if (NetworkHelper.isWifiOnlyEnabled(context) && !NetworkHelper.isWifiConnected(context)) {
                      return null
                  }
                  if (!NetworkHelper.isInternetConnected(context)) {
                      return null
                  }
                  return queueItems.find { it.status == QueueStatus.QUEUED }
              }

              @Synchronized
              fun enqueue(context: Context, item: QueueItem): Boolean {
                  loadQueue(context)
                  queueItems.add(item)
                  saveQueue(context)
                  notifyListeners()

                  if (!DownloadService.isDownloading && !DownloadService.isPaused && !queueItems.any { it.status == QueueStatus.PAUSED }) {
                      // Check Wi-Fi Only before auto-starting
                      if (NetworkHelper.isWifiOnlyEnabled(context) && !NetworkHelper.isWifiConnected(context)) {
                          Log.d(TAG, "Item enqueued but Wi-Fi Only is ON and Wi-Fi not connected. Item remains waiting in queue.")
                          return false
                      }
                      startNext(context)
                      return true
                  }
                  return false
              }

              @Synchronized
              fun startNext(context: Context) {
                  loadQueue(context)
                  if (DownloadService.isDownloading || DownloadService.isPaused) return
                  if (queueItems.any { it.status == QueueStatus.PAUSED }) return

                  val nextItem = queueItems.find { it.status == QueueStatus.QUEUED } ?: return

                  // Wi-Fi Only Check BEFORE starting download process
                  if (NetworkHelper.isWifiOnlyEnabled(context) && !NetworkHelper.isWifiConnected(context)) {
                      Log.d(TAG, "QueueManager: Wi-Fi Only is ON and Wi-Fi not connected. Item '${nextItem.title}' remains QUEUED waiting for Wi-Fi.")
                      notifyListeners()
                      return
                  }

                  if (!NetworkHelper.isInternetConnected(context)) {
                      Log.d(TAG, "QueueManager: No internet connection. Item '${nextItem.title}' remains QUEUED.")
                      notifyListeners()
                      return
                  }

                  nextItem.status = QueueStatus.DOWNLOADING
                  nextItem.pauseReason = PauseReason.NONE
                  nextItem.progress = 0
                  saveQueue(context)
                  notifyListeners()

                  val intent = Intent(context, DownloadService::class.java).apply {
                      action = DownloadService.ACTION_START
                      putExtra(DownloadService.EXTRA_TASK_ID, nextItem.id)
                      putExtra(DownloadService.EXTRA_URL, nextItem.url)
                      putExtra(DownloadService.EXTRA_TITLE, nextItem.title)
                      putExtra(DownloadService.EXTRA_IS_AUDIO, nextItem.isAudio)
                      putExtra(DownloadService.EXTRA_QUALITY, nextItem.quality)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(intent)
                  } else {
                      context.startService(intent)
                  }
              }

              @Synchronized
              fun updateProgress(context: Context, taskId: String, progress: Int, speed: String, sizeInfo: String, eta: String) {
                  loadQueue(context)
                  val item = queueItems.find { it.id == taskId } ?: return
                  item.status = QueueStatus.DOWNLOADING
                  item.pauseReason = PauseReason.NONE
                  item.progress = maxOf(item.progress, progress)
                  item.speed = speed
                  item.sizeInfo = sizeInfo
                  item.eta = eta
                  notifyListeners()
              }

              @Synchronized
              fun markPaused(context: Context, taskId: String, progress: Int, sizeInfo: String, reason: PauseReason = PauseReason.MANUAL) {
                  loadQueue(context)
                  val item = queueItems.find { it.id == taskId }
                  if (item != null) {
                      item.status = QueueStatus.PAUSED
                      item.pauseReason = reason
                      item.progress = progress
                      item.sizeInfo = sizeInfo
                      item.speed = "--"
                      item.eta = "--"
                      saveQueue(context)
                      notifyListeners()
                  }
              }

              @Synchronized
              fun resumeItem(context: Context, taskId: String): Boolean {
                  loadQueue(context)
                  val item = queueItems.find { it.id == taskId } ?: return false
                  if (item.status != QueueStatus.PAUSED) return false
                  if (DownloadService.isDownloading) return false

                  // Check Wi-Fi Only constraint
                  if (NetworkHelper.isWifiOnlyEnabled(context) && !NetworkHelper.isWifiConnected(context)) {
                      Log.w(TAG, "Cannot resume item '${item.title}': Wi-Fi Only is ON and Wi-Fi not connected.")
                      item.pauseReason = PauseReason.WAITING_WIFI
                      saveQueue(context)
                      notifyListeners()
                      return false
                  }

                  val intent = Intent(context, DownloadService::class.java).apply {
                      action = DownloadService.ACTION_RESUME
                      putExtra(DownloadService.EXTRA_TASK_ID, item.id)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(intent)
                  } else {
                      context.startService(intent)
                  }
                  return true
              }

              @Synchronized
              fun pauseActiveItem(context: Context, reason: PauseReason = PauseReason.MANUAL): Boolean {
                  val intent = Intent(context, DownloadService::class.java).apply {
                      action = DownloadService.ACTION_PAUSE
                      putExtra(DownloadService.EXTRA_PAUSE_REASON, reason.name)
                  }
                  context.startService(intent)
                  return true
              }

              @Synchronized
              fun onNetworkAvailabilityChanged(context: Context) {
                  loadQueue(context)
                  val wifiAvailable = NetworkHelper.isWifiConnected(context)
                  val wifiOnly = NetworkHelper.isWifiOnlyEnabled(context)
                  val isEligible = if (wifiOnly) wifiAvailable else NetworkHelper.isInternetConnected(context)

                  if (isEligible) {
                      // 1. If an item was paused specifically waiting for Wi-Fi, automatically resume it!
                      val waitingWifiItem = getWaitingWifiItem(context)
                      if (waitingWifiItem != null && !DownloadService.isDownloading) {
                          Log.d(TAG, "Eligible network restored: Auto-resuming network-paused item: ${waitingWifiItem.title}")
                          resumeItem(context, waitingWifiItem.id)
                          return
                      }

                      // 2. If no item is downloading or paused, start next queued item
                      if (!DownloadService.isDownloading && !DownloadService.isPaused && !queueItems.any { it.status == QueueStatus.PAUSED }) {
                          startNext(context)
                      }
                  } else if (wifiOnly && !wifiAvailable && DownloadService.isDownloading) {
                      // Wi-Fi lost while downloading over cellular with Wi-Fi Only ON
                      Log.d(TAG, "Wi-Fi disconnected during download with Wi-Fi Only ON: safely pausing task")
                      pauseActiveItem(context, PauseReason.WAITING_WIFI)
                  }
                  notifyListeners()
              }

              @Synchronized
              fun cancelItem(context: Context, taskId: String) {
                  val intent = Intent(context, DownloadService::class.java).apply {
                      action = DownloadService.ACTION_CANCEL
                      putExtra(DownloadService.EXTRA_TASK_ID, taskId)
                  }
                  context.startService(intent)
              }

              @Synchronized
              fun markCompleted(context: Context, taskId: String, file: File) {
                  loadQueue(context)
                  val item = queueItems.find { it.id == taskId }
                  if (item != null) {
                      item.status = QueueStatus.COMPLETED
