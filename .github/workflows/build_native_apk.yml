              private fun applyCachedFormats(cleanId: String?, cached: DetectedMediaFormats) {
                  currentVideoId = cleanId
                  activeDetectionUrl = null
                  if (cached.title != null) previewTitle.text = cached.title
                  if (cached.author != null) previewDetails.text = cached.author
                  if (cached.thumbnailBitmap != null) {
                      previewThumbnail.setImageBitmap(cached.thumbnailBitmap)
                      downloadingThumb.setImageBitmap(cached.thumbnailBitmap)
                  }
                  detectedVideoQualities.clear()
                  detectedVideoQualities.addAll(cached.videoQualities)
                  detectedAudioQualities.clear()
                  detectedAudioQualities.addAll(cached.audioQualities)
                  hasVideoTrack = cached.hasVideo
                  hasAudioTrack = cached.hasAudio
                  updateVideoSummarySubtitle(cached.videoQualities)

                  if (!hasVideoTrack && hasAudioTrack && !isAudio) {
                      setFormatSelection(true)
                  } else if (!hasAudioTrack && hasVideoTrack && isAudio) {
                      setFormatSelection(false)
                  }

                  hideQualityLoading()
                  updateSpinner()
              }

              private fun inspectUrlAndDetectFormats(rawUrl: String, forceRefresh: Boolean = false) {
                  val cleanId = extractYouTubeId(rawUrl)
                  val url = if (cleanId != null) "https://www.youtube.com/watch?v=$cleanId" else rawUrl.trim()
                  if (url.isEmpty()) return

                  btnClear.visibility = View.VISIBLE
                  showDownloaderState(1)

                  // 1. Check in-memory cache first to avoid redundant extraction
                  if (!forceRefresh) {
                      val cached = formatCache[url]
                      if (cached != null) {
                          applyCachedFormats(cleanId, cached)
                          return
                      }
                      // 2. In-flight request deduplication: if this exact URL is already being inspected, do not start another!
                      if (url == activeDetectionUrl && isLoadingFormats) {
                          return
                      }
                  }

                  val jobId = System.currentTimeMillis()
                  activeDetectionJobId = jobId
                  activeDetectionUrl = url
                  currentVideoId = cleanId
                  lastFormatDetectionUrl = url
                  lastFormatErrorUrl = null

                  // Show loading state: spinner hidden, loading indicator visible, download button disabled
                  showQualityLoading()

                  // Fast preview metadata for YouTube
                  if (cleanId != null) {
                      previewTitle.text = "Loading media..."
                      previewDetails.text = "Fetching details from YouTube..."
                      thread {
                          try {
                              val thumbUrl = "https://img.youtube.com/vi/$cleanId/hqdefault.jpg"
                              val conn = URL(thumbUrl).openConnection() as HttpURLConnection
                              conn.doInput = true
                              conn.connect()
                              val bitmap = BitmapFactory.decodeStream(conn.inputStream)
                              if (bitmap != null && activeDetectionJobId == jobId && activeDetectionUrl == url) {
                                  runOnUiThread {
                                      if (activeDetectionJobId == jobId && activeDetectionUrl == url) {
                                          previewThumbnail.setImageBitmap(bitmap)
                                          downloadingThumb.setImageBitmap(bitmap)
                                      }
                                  }
                              }
                          } catch (e: Exception) {}
                      }
                      thread {
                          try {
                              val oembedUrl = "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$cleanId&format=json"
                              val conn = URL(oembedUrl).openConnection() as HttpURLConnection
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val resp = reader.readText()
                              reader.close()

                              val json = JSONObject(resp)
                              val title = json.optString("title", "YouTube Video")
                              val author = json.optString("author_name", "YouTube Creator")

                              if (activeDetectionJobId == jobId && activeDetectionUrl == url) {
                                  runOnUiThread {
                                      if (activeDetectionJobId == jobId && activeDetectionUrl == url) {
                                          previewTitle.text = title
                                          previewDetails.text = "$author • YouTube Stream"
                                          downloadingTitle.text = title
                                      }
                                  }
                              }
                          } catch (e: Exception) {}
                      }
                  } else {
                      previewTitle.text = "Inspecting stream..."
                      previewDetails.text = "Fetching stream details..."
                  }

                  // Background thread for real yt-dlp format detection (lightest safe request)
                  thread {
                      try {
                          val request = YoutubeDLRequest(url)
                          request.addOption("--no-playlist")
                          request.addOption("--no-check-certificates")
                          request.addOption("--skip-download")
                          request.addOption("--no-warnings")
                          request.addOption("--socket-timeout", "10")
                          val videoInfo = YoutubeDL.getInstance().getInfo(request)

                          // Cancel obsolete detection: if user changed URL, discard this result immediately!
                          if (activeDetectionJobId != jobId || activeDetectionUrl != url) return@thread

                          val fetchedTitle = videoInfo.title
                          val fetchedUploader = videoInfo.uploader
                          val formats = videoInfo.formats ?: arrayListOf()

                          val detectedRes = mutableSetOf<Int>()
                          var videoAvailable = false
                          var audioAvailable = false

                          for (f in formats) {
                              val isVideoFormat = (f.vcodec != null && f.vcodec != "none") || (f.height > 0)
                              val isAudioFormat = (f.acodec != null && f.acodec != "none") || (f.vcodec == "none" && (f.abr > 0 || f.tbr > 0))

                              if (isVideoFormat) {
                                  videoAvailable = true
                                  val dim = if (f.height > 0 && f.width > 0) minOf(f.height, f.width) else f.height
                                  val note = f.formatNote ?: ""
                                  when {
                                      dim >= 2160 || note.contains("2160") -> detectedRes.add(2160)
                                      dim >= 1440 || note.contains("1440") -> detectedRes.add(1440)
                                      dim >= 1080 || note.contains("1080") -> detectedRes.add(1080)
                                      dim >= 720 || note.contains("720") -> detectedRes.add(720)
                                      dim >= 480 || note.contains("480") -> detectedRes.add(480)
                                      dim >= 360 || note.contains("360") -> detectedRes.add(360)
                                      dim >= 240 || note.contains("240") -> detectedRes.add(240)
                                      dim >= 144 || note.contains("144") -> detectedRes.add(144)
                                      dim > 0 -> detectedRes.add(dim)
                                  }
                              }
                              if (isAudioFormat) {
                                  audioAvailable = true
                              }
                          }

                          // Build ordered video qualities
                          val parsedVideo = mutableListOf<String>()
                          if (2160 in detectedRes) parsedVideo.add("2160p (4K UHD)")
                          if (1440 in detectedRes) parsedVideo.add("1440p (2K QHD)")
                          if (1080 in detectedRes) parsedVideo.add("1080p (Full HD)")
                          if (720 in detectedRes) parsedVideo.add("720p (HD)")
                          if (480 in detectedRes) parsedVideo.add("480p")
                          if (360 in detectedRes) parsedVideo.add("360p")
                          if (240 in detectedRes) parsedVideo.add("240p")
                          if (144 in detectedRes) parsedVideo.add("144p")

                          // Safe fallback for video: if no heights parsed but video stream or raw format exists
                          if (parsedVideo.isEmpty()) {
                              if (videoAvailable || formats.isEmpty()) {
                                  parsedVideo.add("Best Available")
                              }
                          }

                          // Build usable audio qualities
                          val parsedAudio = mutableListOf<String>()
                          if (audioAvailable || formats.isEmpty()) {
                              parsedAudio.add("320 kbps (HQ Audio)")
                              parsedAudio.add("256 kbps")
                              parsedAudio.add("192 kbps (Standard)")
                              parsedAudio.add("128 kbps (Fast)")
                          }

                          // Complete cache entry
                          val currentThumb = (previewThumbnail.drawable as? android.graphics.drawable.BitmapDrawable)?.bitmap
                          val detectedData = DetectedMediaFormats(
                              url = url,
                              title = fetchedTitle,
                              author = fetchedUploader,
                              thumbnailBitmap = currentThumb,
                              videoQualities = parsedVideo,
                              audioQualities = parsedAudio,
                              hasVideo = videoAvailable || parsedVideo.isNotEmpty(),
                              hasAudio = audioAvailable || parsedAudio.isNotEmpty()
                          )
                          formatCache[url] = detectedData

                          runOnUiThread {
                              if (activeDetectionJobId != jobId || activeDetectionUrl != url) return@runOnUiThread
                              activeDetectionUrl = null

                              if (!fetchedTitle.isNullOrEmpty() && (previewTitle.text == "Loading media..." || previewTitle.text == "Inspecting stream...")) {
                                  previewTitle.text = fetchedTitle
                                  downloadingTitle.text = fetchedTitle
                              }
                              if (!fetchedUploader.isNullOrEmpty() && (previewDetails.text.contains("Fetching") || previewDetails.text.contains("Inspecting"))) {
                                  previewDetails.text = "$fetchedUploader • Verified Stream"
                              }

                              detectedVideoQualities.clear()
                              detectedVideoQualities.addAll(parsedVideo)

                              detectedAudioQualities.clear()
                              detectedAudioQualities.addAll(parsedAudio)

                              hasVideoTrack = detectedData.hasVideo
                              hasAudioTrack = detectedData.hasAudio
                              updateVideoSummarySubtitle(parsedVideo)

                              // Auto-adjust format selection if media is audio-only or video-only
                              if (!hasVideoTrack && hasAudioTrack && !isAudio) {
                                  setFormatSelection(true)
                              } else if (!hasAudioTrack && hasVideoTrack && isAudio) {
                                  setFormatSelection(false)
                              }

                              hideQualityLoading()
                              updateSpinner()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              if (activeDetectionJobId != jobId || activeDetectionUrl != url) return@runOnUiThread
                              activeDetectionUrl = null
                              hideQualityLoading()
                              lastFormatErrorUrl = url
                              showErrorState("Could not detect available stream qualities: ${e.message ?: "Network or extraction error"}. Please check your connection and tap Retry.")
                          }
                      }
                  }
              }

              private fun updateFilterChipStyles() {
                  val activeBg = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#4F46E5"))
                  val inactiveBg = android.content.res.ColorStateList.valueOf(android.graphics.Color.parseColor("#F1F5F9"))
                  val activeText = android.graphics.Color.WHITE
                  val inactiveText = android.graphics.Color.parseColor("#64748B")

                  chipAll.backgroundTintList = if (historyFilter == "ALL") activeBg else inactiveBg
                  chipAll.setTextColor(if (historyFilter == "ALL") activeText else inactiveText)

                  chipAudio.backgroundTintList = if (historyFilter == "AUDIO") activeBg else inactiveBg
                  chipAudio.setTextColor(if (historyFilter == "AUDIO") activeText else inactiveText)

                  chipVideo.backgroundTintList = if (historyFilter == "VIDEO") activeBg else inactiveBg
                  chipVideo.setTextColor(if (historyFilter == "VIDEO") activeText else inactiveText)
              }

              private fun showSortSelectionDialog() {
                  val options = StorageHelper.HistorySortOrder.values()
                  val labels = options.map { it.label }.toTypedArray()
                  val currentSort = StorageHelper.getHistorySortOrder(this)
                  val checkedIndex = options.indexOf(currentSort)

                  AlertDialog.Builder(this)
                      .setTitle("Sort Downloads")
                      .setSingleChoiceItems(labels, checkedIndex) { dialog, which ->
                          val selectedOrder = options[which]
                          StorageHelper.setHistorySortOrder(this, selectedOrder)
                          txtCurrentSort.text = selectedOrder.label
                          dialog.dismiss()
                          renderHistoryUI()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun refreshHistory(forceRescan: Boolean = false) {
                  if (::txtCurrentSort.isInitialized) {
                      txtCurrentSort.text = StorageHelper.getHistorySortOrder(this).label
                  }

                  if (forceRescan || cachedHistoryItems.isEmpty()) {
                      if (isScanningHistory) return
                      isScanningHistory = true
                      thread(name = "FlowRipHistoryScanThread") {
                          val scanned = StorageHelper.scanAllHistoryItems(applicationContext)
                          cachedHistoryItems = scanned
                          isScanningHistory = false
                          runOnUiThread {
                              renderHistoryUI()
                          }
                      }
                  } else {
                      renderHistoryUI()
                  }
              }

