                              "VIDEO" -> it.name.endsWith(".mp4", ignoreCase = true)
                              else -> it.name.endsWith(".mp3", ignoreCase = true) || it.name.endsWith(".mp4", ignoreCase = true)
                          }
                          val queryMatches = searchQuery.isEmpty() || it.name.lowercase().contains(searchQuery)
                          typeMatches && queryMatches
                      }?.sortedByDescending { it.lastModified() } ?: emptyList()

                      if (files.isEmpty()) {
                          val emptyText = TextView(this).apply {
