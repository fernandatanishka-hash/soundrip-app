              private fun updateDownloadProgressAnimated(targetProgress: Int, animate: Boolean = true) {
                  try {
                      val target = targetProgress.coerceIn(0, 100)
                      val current = circularProgressBar.progress
          
                      if (!animate || target == 0 || target == 100 || target < current) {
                          progressAnimator?.cancel()
                          circularProgressBar.progress = target
                          linearProgressBar.progress = target
                          txtCircularPercent.text = "$target%"
                          return
                      }
          
                      if (target > current) {
                          progressAnimator?.cancel()
                          progressAnimator = ValueAnimator.ofInt(current, target).apply {
                              duration = 200L
                              interpolator = DecelerateInterpolator()
                              addUpdateListener { anim ->
                                  val v = anim.animatedValue as Int
                                  circularProgressBar.progress = v
                                  linearProgressBar.progress = v
                                  txtCircularPercent.text = "$v%"
                              }
                              start()
                          }
                      }
                  } catch (e: Exception) {
                      try {
                          circularProgressBar.progress = targetProgress.coerceIn(0, 100)
                          linearProgressBar.progress = targetProgress.coerceIn(0, 100)
                          txtCircularPercent.text = "${targetProgress.coerceIn(0, 100)}%"
                      } catch (ignored: Exception) {}
                  }
              }
          
