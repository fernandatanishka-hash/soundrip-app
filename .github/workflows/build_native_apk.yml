name: Build FlowRip Studio Pro UI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate FlowRip Studio Project
        run: |
          mkdir -p app/src/main/java/com/soundrip/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 0. Official 3D FlowRip Logo & Launcher Icons
          python3 -c "import base64; open('app/src/main/res/drawable/ic_launcher_emblem.png', 'wb').write(base64.b64decode(''))"
          python3 -c "import base64; open('app/src/main/res/drawable/app_logo.png', 'wb').write(base64.b64decode(''))"

          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_emblem.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # 1. Vector Logos & High-Contrast Navigation Icons
          cat << 'EOF' > app/src/main/res/drawable/ic_play_gradient.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6366F1"
                  android:pathData="M32,24 L86,54 L32,84 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_home.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#4F46E5"
                  android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_history.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#64748B"
                  android:pathData="M13,3a9,9 0 0,0 -9,9H1l3.89,3.89.07.14L9,12H6c0,-3.87 3.13,-7 7,-7s7,3.13 7,7 -3.13,7 -7,7c-1.93,0 -3.68,-0.79 -4.94,-2.06l-1.42,1.42A8.954,8.954 0 0,0 13,21a9,9 0 0,0 0,-18zm-1,5v5l4.28,2.54.72,-1.21 -3.5,-2.08V8H12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#64748B"
                  android:pathData="M12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6 3.6,1.62 3.6,3.6 -1.62,3.6 -3.6,3.6z M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94 0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94l-0.36,-2.54c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87c-0.12,0.21 -0.08,0.47 0.12,0.61l2.03,1.58c-0.05,0.3 -0.09,0.63 -0.09,0.94s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61l-2.01,-1.58z"/>
          </vector>
          EOF

          # Custom Launcher Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6366F1"
                  android:pathData="M54,16 A38,38 0 1,1 53.9,16 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M44,36 L72,54 L44,72 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground>
                  <inset android:drawable="@drawable/ic_launcher_emblem" android:inset="14%" />
              </foreground>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground>
                  <inset android:drawable="@drawable/ic_launcher_emblem" android:inset="14%" />
              </foreground>
          </adaptive-icon>
          EOF

          # 2. Modern Drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_badge.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#EEF2FF" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_search_bar.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F1F5F9" />
              <stroke android:width="1dp" android:color="#E2E8F0" />
              <corners android:radius="22dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_selected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F5F3FF" />
              <stroke android:width="2dp" android:color="#6366F1" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_unselected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F8FAFC" />
              <stroke android:width="1.5dp" android:color="#E2E8F0" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/circular_progress_drawable.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="ring" android:thicknessRatio="14" android:useLevel="false">
                      <solid android:color="#EEF2FF" />
                  </shape>
              </item>
              <item>
                  <rotate android:fromDegrees="270" android:toDegrees="270">
                      <shape android:shape="ring" android:thicknessRatio="14" android:useLevel="true">
                          <solid android:color="#6366F1" />
                      </shape>
                  </rotate>
              </item>
          </layer-list>
          EOF

          cat << 'EOF' > app/src/main/res/xml/provider_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
          </paths>
          EOF

          # 3. Colors & Modern Light Theme (Clean Light Status Bar)
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="flowrip_bg">#F8FAFC</color>
              <color name="flowrip_primary">#6366F1</color>
              <color name="flowrip_primary_dark">#4F46E5</color>
              <color name="flowrip_accent">#10B981</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.FlowRip" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/flowrip_primary</item>
                  <item name="colorPrimaryDark">@color/flowrip_primary_dark</item>
                  <item name="colorAccent">@color/flowrip_accent</item>
                  <item name="android:windowBackground">@color/flowrip_bg</item>
                  <item name="android:statusBarColor">#F8FAFC</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

          # 4. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 5. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "FlowRip"
          include ':app'
          EOF

          # 6. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 7. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.soundrip.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.soundrip.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 18
                  versionName "18.0"

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.cardview:cardview:1.0.0'

              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

              implementation 'com.startapp:inapp-sdk:5.1.0'
          }
          EOF

          # 8. FlowRipApp.kt (Early Core Engine & FFmpeg Initialization)
          cat << 'EOF' > app/src/main/java/com/soundrip/app/FlowRipApp.kt
          package com.soundrip.app

          import android.app.Application
          import android.util.Log
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL

          class FlowRipApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  try {
                      YoutubeDL.getInstance().init(this)
                      FFmpeg.getInstance().init(this)
                      Log.d("FlowRipApp", "YoutubeDL and FFmpeg initialized successfully")
                  } catch (e: Exception) {
                      Log.e("FlowRipApp", "Failed to initialize YoutubeDL / FFmpeg", e)
                  }
              }
          }
          EOF

          # 8. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">FlowRip</string>
          </resources>
          EOF

          # 9. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />

              <application
                  android:name=".FlowRipApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.FlowRip"
                  android:extractNativeLibs="true"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/provider_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 10. Spinner layouts
          cat << 'EOF' > app/src/main/res/layout/item_spinner_selected.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="8dp"
              android:textColor="#0F172A"
              android:textSize="13sp"
              android:textStyle="bold" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_spinner_dropdown.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="12dp"
              android:textColor="#0F172A"
              android:textSize="13sp"
              android:textStyle="bold" />
          EOF

          # 11. Complete activity_main.xml (With Samsung / All-Android Navigation Protection)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:background="#F8FAFC">

              <!-- App Pages Container -->
              <FrameLayout
                  android:id="@+id/containerPages"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/bottomNavSection">

                  <!-- PAGE 1: HOME -->
                  <ScrollView
                      android:id="@+id/pageHome"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:fillViewport="true"
                      android:scrollbars="none">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:paddingHorizontal="24dp"
                          android:paddingTop="36dp"
                          android:paddingBottom="24dp">

                          <!-- Brand Header Row -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical">

                              <androidx.cardview.widget.CardView
                                  android:layout_width="40dp"
                                  android:layout_height="40dp"
                                  app:cardCornerRadius="20dp"
                                  app:cardElevation="2dp"
                                  app:cardBackgroundColor="#03030C">

                                  <ImageView
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:src="@drawable/ic_launcher_emblem"
                                      android:scaleType="fitCenter"
                                      android:padding="5dp" />
                              </androidx.cardview.widget.CardView>

                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginStart="10dp"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:background="@drawable/bg_badge"
                                  android:paddingHorizontal="14dp"
                                  android:paddingVertical="7dp">

                                  <View
                                      android:layout_width="7dp"
                                      android:layout_height="7dp"
                                      android:background="#10B981" />

                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="  Ultra HD 1080p &amp; 320kbps MP3"
                                      android:textColor="#4F46E5"
                                      android:textSize="11sp"
                                      android:textStyle="bold" />
                              </LinearLayout>
                          </LinearLayout>

                          <!-- Hero Title -->
                          <LinearLayout
                              android:id="@+id/viewHomeHero"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:layout_marginTop="20dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Download Media"
                                  android:textColor="#0F172A"
                                  android:textSize="30sp"
                                  android:textStyle="bold"
                                  android:letterSpacing="-0.02" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Fast, studio-quality MP3 audio and 1080p MP4 video downloads from YouTube."
                                  android:textColor="#64748B"
                                  android:textSize="13sp"
                                  android:layout_marginTop="6dp"
                                  android:lineSpacingExtra="3dp" />
                          </LinearLayout>

                          <!-- FULL-WIDTH URL INPUT PILL -->
                          <androidx.cardview.widget.CardView
                              android:layout_width="match_parent"
                              android:layout_height="58dp"
                              android:layout_marginTop="24dp"
                              app:cardCornerRadius="29dp"
                              app:cardElevation="3dp"
                              app:cardBackgroundColor="#FFFFFF">

                              <RelativeLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:paddingHorizontal="20dp">

                                  <TextView
                                      android:id="@+id/txtLinkIcon"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_centerVertical="true"
                                      android:text="🔗"
                                      android:textSize="16sp" />

                                  <EditText
                                      android:id="@+id/urlInput"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:layout_toEndOf="@id/txtLinkIcon"
                                      android:layout_toStartOf="@+id/btnClear"
                                      android:layout_marginStart="10dp"
                                      android:layout_marginEnd="6dp"
                                      android:background="@null"
                                      android:hint="Paste YouTube video or music link..."
                                      android:textColorHint="#94A3B8"
                                      android:textColor="#0F172A"
                                      android:textSize="13sp"
                                      android:singleLine="true"
                                      android:imeOptions="actionDone" />

                                  <TextView
                                      android:id="@+id/btnClear"
                                      android:layout_width="28dp"
                                      android:layout_height="28dp"
                                      android:layout_alignParentEnd="true"
                                      android:layout_centerVertical="true"
                                      android:text="✕"
                                      android:textColor="#94A3B8"
                                      android:textSize="14sp"
                                      android:gravity="center"
                                      android:visibility="gone" />
                              </RelativeLayout>
                          </androidx.cardview.widget.CardView>

                          <!-- FULL-WIDTH MAIN ACTION BUTTON (DIRECTLY BELOW INPUT) -->
                          <Button
                              android:id="@+id/btnMainAction"
                              android:layout_width="match_parent"
                              android:layout_height="56dp"
                              android:layout_marginTop="14dp"
                              android:text="📋 PASTE LINK"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold"
